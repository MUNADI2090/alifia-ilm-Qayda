<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>তাজবীদ · আলিফিয়া ইলম একাডেমি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f3ea; --card:#fffdf8; --ink:#2a2318; --sub:#7d6b50;
  --line:#e6dbc5; --soft:#f1e9d8;
  --grn:#0f7355; --grnS:#e7f2ed;
  --red:#a5372c; --redS:#fbeae7;
  --gold:#a9802a; --goldS:#fbf2da;
  --fs:17px; --ar:30px;
}
html[data-theme="dark"]{
  --bg:#12100e; --card:#1c1916; --ink:#efe7d8; --sub:#a49274;
  --line:#2f2a24; --soft:#221e1a;
  --grn:#54c9a4; --grnS:#12281f;
  --red:#e8897c; --redS:#2b1815;
  --gold:#dfb752; --goldS:#2a2113;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Hind Siliguri',system-ui,sans-serif;
  font-size:var(--fs);line-height:1.85;
  padding:60px 0 74px;
}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate;line-height:2.1}

/* ===== bars ===== */
.top,.bot{
  position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:8px;
  background:var(--card);border-color:var(--line);padding:8px 12px;
}
.top{top:0;border-bottom:1px solid var(--line)}
.bot{bottom:0;border-top:1px solid var(--line)}
.top .ttl{flex:1;font-weight:700;font-size:16px;letter-spacing:.2px}
.top .ttl small{display:block;font-weight:400;font-size:11px;color:var(--sub);line-height:1.2}
.ib{
  border:1px solid var(--line);background:var(--soft);color:var(--ink);
  width:38px;height:38px;border-radius:11px;font-size:16px;cursor:pointer;flex:none;
  display:flex;align-items:center;justify-content:center;font-family:inherit;
}
.ib:active{transform:scale(.94)}
.nb{
  flex:1;border:1px solid var(--line);background:var(--soft);color:var(--ink);
  height:40px;border-radius:11px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
}
.nb:disabled{opacity:.38}
select.nb{text-align:center;padding:0 6px}
.bar{position:fixed;top:54px;left:0;right:0;height:3px;background:var(--line);z-index:19}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}

/* ===== page ===== */
main{max-width:720px;margin:0 auto;padding:16px 14px 10px}
.phead{text-align:center;margin:6px 0 20px}
.phead .kicker{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1.4px}
.phead h1{font-size:25px;margin:4px 0 6px;font-weight:700;line-height:1.35}
.phead .rule{height:1px;background:var(--line);margin:12px 34px 0}

h2.sec{
  font-size:16px;font-weight:700;text-align:center;margin:26px 0 14px;
  background:var(--goldS);color:var(--gold);border:1px solid var(--line);
  padding:7px 18px;border-radius:999px;display:table;margin-left:auto;margin-right:auto;
}
.def{
  background:var(--grnS);border:1px solid var(--line);border-radius:14px;
  padding:12px 15px;margin:0 0 16px;font-weight:500;
}
.tip{
  background:var(--redS);border:1px solid var(--line);border-left:4px solid var(--red);
  border-radius:12px;padding:10px 14px;margin:16px 0;font-size:.94em;color:var(--sub);
}
.tip b{color:var(--red)}
.note{margin:14px 2px;color:var(--sub);font-size:.95em}

/* ===== makhraj row ===== */
.mk{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px 15px 12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.mkh{display:flex;gap:11px;align-items:flex-start}
.mkh p{margin:0;flex:1}
.num{
  flex:none;width:30px;height:30px;border-radius:50%;
  background:var(--grn);color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:center;margin-top:3px;
}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:11px;
  padding-top:11px;border-top:1px dashed var(--line)}
.chip{
  min-width:60px;background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:6px 10px 5px;text-align:center;
}
.chip .a{font-family:'Noto Naskh Arabic',serif;font-size:var(--ar);line-height:1.5;display:block}
.chip .b{display:block;font-size:11.5px;color:var(--sub);margin-top:-2px}

/* ===== rule card ===== */
.rc{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:0 0 13px;margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.rh{display:flex;gap:10px;align-items:center;background:var(--soft);
  padding:10px 14px;border-bottom:1px solid var(--line)}
.rh h3{margin:0;font-size:17px;font-weight:700;flex:1}
.rh .num{background:var(--gold);width:27px;height:27px;font-size:13px;margin:0}
.rc p{margin:11px 15px 0}
.rc p.q{color:var(--sub);font-size:.94em}

/* ===== examples ===== */
.ex{margin:12px 15px 0;padding-top:11px;border-top:1px dashed var(--line)}
.ex .lab{font-size:12px;font-weight:700;color:var(--red);letter-spacing:.5px}
.exs{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:7px}
.exc{
  font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:24px;line-height:2;
  background:var(--redS);border:1px solid var(--line);border-radius:11px;padding:2px 13px;
}

/* ===== key : value rows ===== */
.kv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 15px;margin-bottom:14px}
.kvr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.kvr:last-child{border-bottom:0}
.kvr .l{font-weight:500}
.kvr .d{flex:1;border-bottom:1px dotted var(--line);min-width:14px}
.kvr .v{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:23px;line-height:1.9;font-weight:600}

/* ===== cells grid ===== */
.cells{display:grid;grid-template-columns:repeat(var(--c,3),1fr);gap:9px;margin-bottom:14px}
.cell{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:9px 4px 7px;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.cell .a{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:var(--ar);line-height:1.7;display:block}
.cell .b{display:block;font-size:11.5px;color:var(--sub);margin-top:-1px}

/* ===== ordered list ===== */
.ol{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:10px 15px;margin-bottom:14px;counter-reset:x}
.ol div{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);counter-increment:x}
.ol div:last-child{border-bottom:0}
.ol div::before{
  content:counter(x,bengali) '।';flex:none;color:var(--gold);font-weight:700;min-width:22px;
}

/* ===== index ===== */
.grp{margin:22px 0 10px;font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.6px}
.ix{display:grid;gap:8px}
.ixb{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:11px 13px;color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:500;
}
.ixb:active{background:var(--soft)}
.ixb span.p{
  flex:none;width:28px;height:28px;border-radius:9px;background:var(--grnS);color:var(--grn);
  font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.hero{text-align:center;padding:10px 0 4px}
.hero .bism{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:26px;color:var(--grn);line-height:2}
.hero h1{font-size:27px;margin:6px 0 2px}
.hero p{margin:0;color:var(--sub);font-size:14.5px}
.foot{text-align:center;color:var(--sub);font-size:12.5px;padding:24px 0 6px}
@media(max-width:380px){.cells{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<div class="top">
  <button class="ib" id="bHome" title="হোম">⌂</button>
  <div class="ttl">তাজবীদ<small id="sub">নূরানী পদ্ধতিতে কুরআন শিক্ষা</small></div>
  <button class="ib" id="bFont" title="লেখার আকার">অ</button>

<main id="page"></main>

  <button class="nb" id="bNext">পরের →</button>
</div>

const pg=$('page');
let cur=+(LS.getItem('tj_last')||-1);

function chip(a){return `<span class="chip"><span class="a">${a[0]}</span><span class="b">${a[1]||''}</span></span>`;}
function exRow(lab,items){
  return `<div class="ex"><span class="lab">${lab||'যথা'}</span><div class="exs">`+
    items.map(x=>`<span class="exc">${x}</span>`).join('')+`</div></div>`;
}
function block(b){
  if(b.k==='sec')  return `<h2 class="sec">${b.t}</h2>`;
  if(b.k==='def')  return `<div class="def">${b.t}</div>`;
  if(b.k==='tip')  return `<div class="tip"><b>ওস্তাদের জন্য —</b> ${b.t}</div>`;
  if(b.k==='note') return `<p class="note">${b.t}</p>`;
  if(b.k==='ex')   return exRow(b.lab,b.items);
  if(b.k==='mk')
    return `<div class="mk"><div class="mkh"><span class="num">${bn(b.n)}</span><p>${b.tx}</p></div>`+
           `<div class="chips">${b.ar.map(chip).join('')}</div></div>`;
  if(b.k==='rc')
    return `<div class="rc"><div class="rh">${b.n?`<span class="num">${bn(b.n)}</span>`:''}<h3>${b.h}</h3></div>`+
           `<p>${b.tx}</p>${b.ex?exRow('যথা',b.ex):''}</div>`;
  if(b.k==='kv')
    return `<div class="kv">`+b.items.map(it=>
      `<div class="kvr"><span class="l">${it[0]}</span><span class="d"></span><span class="v ar">${it[1]}</span></div>`).join('')+`</div>`;
  if(b.k==='cells')
    return `<div class="cells" style="--c:${b.cols||3}">`+b.items.map(it=>
      `<div class="cell"><span class="a">${it[0]}</span><span class="b">${it[1]||''}</span></div>`).join('')+`</div>`;
  if(b.k==='ol')
    return `<div class="ol">`+b.items.map(x=>`<div>${x}</div>`).join('')+`</div>`;
  return '';
}

function drawIndex(){
  let h=`<div class="hero"><div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <h1>তাজবীদ</h1><p>সতেরো মাখরাজ থেকে রা হরফের পুর-বারিক পর্যন্ত</p></div>`;
  let last='';
  P.forEach((p,i)=>{
    if(p.g!==last){ h+=(last?'</div>':'')+`<div class="grp">${p.g}</div><div class="ix">`; last=p.g; }
    h+=`<button class="ixb" data-go="${i}"><span class="p">${bn(i+1)}</span>
        <span>${p.t}${p.s?` <span style="color:var(--sub);font-size:13px">· ${p.s}</span>`:''}</span></button>`;
  });
  h+='</div><div class="foot">মোট '+bn(P.length)+' পৃষ্ঠা · আলিফিয়া ইলম একাডেমি</div>';
  pg.innerHTML=h;
  pg.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
}

function drawPage(p,i){
  let h=`<div class="phead"><div class="kicker">${p.g}</div><h1>${p.t}</h1>`+
        (p.s?`<p style="margin:0;color:var(--sub);font-size:14px">${p.s}</p>`:'')+
        `<div class="rule"></div></div>`;
  p.b.forEach(b=>h+=block(b));
  h+=`<div class="foot">পৃষ্ঠা ${bn(i+1)} / ${bn(P.length)}</div>`;
  pg.innerHTML=h;
}

function render(){
  if(cur<0){ drawIndex(); $('sub').textContent='সূচিপত্র'; }
  else { drawPage(P[cur],cur); $('sub').textContent=P[cur].g; }
  $('barI').style.width = (cur<0?0:((cur+1)/P.length*100))+'%';
  $('bPrev').disabled = cur<0;
  $('bNext').disabled = cur>=P.length-1;
  $('sel').value = cur;
}
function go(i){
  cur = i<-1 ? -1 : (i>=P.length ? P.length-1 : i);
  LS.setItem('tj_last',cur);
  render();
  window.scrollTo(0,0);
}

/* ======================= নিয়ন্ত্রণ ======================= */
$('sel').innerHTML='<option value="-1">সূচিপত্র</option>'+
  P.map((p,i)=>`<option value="${i}">${bn(i+1)}. ${p.t}</option>`).join('');
$('sel').onchange=e=>go(+e.target.value);
$('bPrev').onclick=()=>go(cur-1);
$('bNext').onclick=()=>go(cur+1);
$('bHome').onclick=()=>{ location.href='qaida.html?home=1'; };

const FSZ=[16,18,20];
let fi=+(LS.getItem('tj_fs')||0);
const applyFS=()=>document.documentElement.style.setProperty('--fs',FSZ[fi]+'px');
applyFS();
$('bFont').onclick=()=>{ fi=(fi+1)%FSZ.length; LS.setItem('tj_fs',fi); applyFS(); };

const th=LS.getItem('tj_theme')||'light';
const setTh=n=>{ document.documentElement.dataset.theme=n; LS.setItem('tj_theme',n);
  $('bTheme').textContent = n==='dark'?'☀':'☾'; };
setTh(th);
$('bTheme').onclick=()=>setTh(document.documentElement.dataset.theme==='dark'?'light':'dark');

render();
</script>
</body>
