<!DOCTYPE html>
<html lang="bn" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>তাজবীদ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#F6F7F6;--ink:#1A1D1B;--mut:#70766F;--line:#E7EAE6;
 --grn:#12704F;--grnS:#EDF5F1;--gold:#8A6A22;--fs:1}
html[data-t="dark"]{--bg:#0F1210;--soft:#191D1A;--ink:#EAEEE9;--mut:#98A09A;
 --line:#262B27;--grn:#5CC9A3;--grnS:#132A22;--gold:#CFAA60}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
 font-size:calc(16px*var(--fs));line-height:1.85;padding-bottom:96px}
.top{position:sticky;top:0;z-index:9;background:var(--bg);border-bottom:1px solid var(--line);
 display:flex;align-items:center;gap:8px;padding:9px 12px}
.tb{border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:42px;min-height:42px;
 border-radius:11px;font-size:17px;font-family:inherit;display:flex;align-items:center;
 justify-content:center;cursor:pointer;line-height:1.4;padding:4px 8px}
.tb:active{background:var(--soft)}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:.99em;font-weight:600;line-height:1.5;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt i{display:block;font-style:normal;font-size:.75em;color:var(--mut);line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:18px 15px 4px}
.hero{padding:6px 0 20px;border-bottom:1px solid var(--line)}
.hero .b{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.3em;
 color:var(--grn);line-height:2.4;display:block;text-align:center}
.hero h1{margin:10px 0 3px;font-size:1.6em;font-weight:600;line-height:1.7;text-align:center}
.hero p{margin:0;color:var(--mut);font-size:.88em;text-align:center;line-height:1.7}
.sec{margin:22px 0 9px;font-size:.82em;font-weight:600;color:var(--gold);line-height:1.9}
.tcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);
 border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px;cursor:pointer;
 font-family:inherit;color:inherit;font-size:1em}
.tcard:active{background:var(--soft)}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:38px;
 min-height:38px;padding:3px 7px;border-radius:10px;background:var(--grnS);color:var(--grn);
 font-weight:600;font-size:.98em;line-height:1.95}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:1em;line-height:1.6;overflow-wrap:break-word}
.tx i{display:block;font-style:normal;color:var(--mut);font-size:.81em;line-height:1.65;
 overflow-wrap:break-word}
.arw{flex:0 0 auto;color:var(--mut);font-size:1.25em;line-height:1.4}
.phead{padding:2px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.phead .k{color:var(--gold);font-size:.76em;font-weight:600;line-height:1.8}
.phead h1{margin:2px 0 3px;font-size:1.4em;font-weight:600;line-height:1.6}
.phead p{margin:0;color:var(--mut);font-size:.88em;line-height:1.75}
.blk{padding:0 0 4px;margin:0 0 20px}
.blk h3{margin:0 0 7px;font-size:1.02em;font-weight:600;line-height:1.6;color:var(--grn)}
.blk p{margin:0 0 7px;overflow-wrap:break-word}
.blk p:last-child{margin-bottom:0}
.note{background:var(--soft);border-radius:12px;padding:13px 14px;margin:0 0 20px}
.note h3{color:var(--ink)}
.step{counter-reset:s;list-style:none;margin:6px 0 0;padding:0}
.step li{position:relative;padding:6px 0 6px 26px;line-height:1.8}
.step li::before{counter-increment:s;content:counter(s,bengali);position:absolute;left:0;top:6px;
 color:var(--grn);font-weight:600;font-size:.88em}
.lets{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0 0;direction:rtl}
.let{flex:0 0 auto;min-width:56px;text-align:center;border:1px solid var(--line);
 border-radius:10px;padding:5px 8px 4px}
.let .a{display:block;font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.55em;line-height:1.95}
.let .u{display:block;direction:ltr;font-size:.66em;color:var(--mut);line-height:1.8}
.mk{border-top:1px solid var(--line);padding:13px 0 4px}
.mk .hd{display:flex;align-items:flex-start;gap:11px}
.mk .hd .num{background:var(--soft);color:var(--gold);min-width:36px;min-height:36px;font-size:.9em}
.mk .hd b{font-weight:400;font-size:.97em;line-height:1.7;padding-top:4px;overflow-wrap:break-word}
.mk .ex{margin:8px 0 0;color:var(--mut);font-size:.87em;line-height:1.8}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.87em;margin-top:8px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;line-height:1.75}
.tbl th{color:var(--mut);font-weight:600;font-size:.94em}
.tbl .ara{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.25em;
 display:inline-block;line-height:2}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);
 border-top:1px solid var(--line);display:flex;gap:7px;
 padding:8px 11px calc(8px + env(safe-area-inset-bottom))}
.nb{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:11px;
 min-height:46px;padding:7px 14px;font-family:inherit;font-size:.9em;cursor:pointer;line-height:1.6}
.nb[disabled]{opacity:.35}
.nb.mid{flex:1;background:var(--grnS);color:var(--grn);font-weight:600;min-width:0;border-color:transparent}
</style>
</head>
<body>

<div class="top">
  <button class="tb" id="back">←</button>
  <div class="tt"><b id="tN">তাজবীদ</b><i id="tS">সূচিপত্র</i></div>
  <button class="tb" id="fz">অ</button>
  <button class="tb" id="th">☾</button>
</div>

<div class="wrap" id="page"></div>

<div class="nav">
  <button class="nb" id="prev">←</button>
  <button class="nb mid" id="mid">সূচিপত্র</button>
  <button class="nb" id="next">পরের →</button>
</div>

<script>
var $=function(i){return document.getElementById(i)},LS=localStorage;
function bn(s){return String(s).replace(/[0-9]/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
function L(a,u){return {a:a,u:u||''}}

var MK=[
 [1,'হলকের শুরু হইতে','',[L('ء'),L('ه')]],
 [2,'হলকের মধ্যখান হইতে','',[L('ع'),L('ح')]],
 [3,'হলকের শেষ হইতে','',[L('غ'),L('خ')]],
 [4,'জিহবার গোড়া, তার বরাবর উপরের তালুর সঙ্গে লাগাইয়া, দুই নুকতাওয়ালা','',[L('ق')]],
 [5,'জিহবার গোড়া থেকে একটু আগে বাড়িয়া, তার বরাবর উপরের তালুর সঙ্গে লাগাইয়া, মধ্যখান পেঁচানো','',[L('ك')]],
 [6,'জিহবার মধ্যখান, তার বরাবর উপরের তালুর সঙ্গে লাগাইয়া','জিহবার মধ্যখান তিনভাগে বিভক্ত। গোড়ার ভাগে ج, তারপর ش, তারপর ي।',[L('ج'),L('ش'),L('ي')]],
 [7,'জিহবার গোড়ার কিনারা, উপরের মাড়ির দাঁতের গোড়ার সঙ্গে লাগাইয়া','',[L('ض')]],
 [8,'জিহবার আগার কিনারা, সামনের উপরের দাঁতের মাড়ির সঙ্গে লাগাইয়া','',[L('ل')]],
 [9,'জিহবার আগা, তার বরাবর উপরের তালুর সঙ্গে লাগাইয়া','',[L('ن')]],
 [10,'জিহবার আগার পিঠ, তার বরাবর উপরের তালুর সঙ্গে লাগাইয়া','',[L('ر')]],
 [11,'জিহবার আগা, সামনের উপরের দুই দাঁতের গোড়ার সঙ্গে লাগাইয়া','',[L('ط'),L('د'),L('ت')]],
 [12,'জিহবার আগা, সামনের নিচের দুই দাঁতের আগার দিকে লাগাইয়া','',[L('ص'),L('س'),L('ز')]],
 [13,'জিহবার আগা, সামনের উপরের দুই দাঁতের আগার সঙ্গে লাগাইয়া','',[L('ظ'),L('ذ'),L('ث')]],
 [14,'নিচের ঠোঁটের পেট, সামনের উপরের দুই দাঁতের আগার সঙ্গে লাগাইয়া','',[L('ف')]],
 [15,'দুই ঠোঁট হইতে উচ্চারিত হয়','و — ঠোঁট গোল করিয়া মুখ খোলা রাখিয়া। ب — ঠোঁটের ভিজায় ভিজায়। م — ঠোঁটের শুকনা জায়গায়।',[L('و'),L('ب'),L('م')]],
 [16,'মুখের খালি জায়গা হইতে মদ্দের হরফ পড়া যায়','',[L('ا'),L('و'),L('ي')]],
 [17,'নাকের বাঁশি হইতে গুন্নাহ উচ্চারিত হয়','',[L('نّ'),L('مّ')]]
];

var T=[

{sec:'মাখরাজ',t:'মাখরাজ',s:'হরফ উচ্চারণের স্থান',b:[
 {k:'note',h:'পরিচয়',p:['উচ্চারণের স্থানকে মাখরাজ বলে।','আরবী হরফ ২৯টি, মাখরাজ ১৭টি।']},
 {k:'mk'},
 {k:'blk',h:'মুরাক্কাব',p:['ডানের হরফকে বামের হরফের সঙ্গে মিলাইয়া লিখাকে মুরাক্কাব বলে। মুরাক্কাব করিবার সময় হরফের শুধু ডান মাথাটুকু থাকে।','যেমন ب কে আলিফের সঙ্গে মুরাক্কাব করিলে এই সুরত হয় —'],L:[L('با','বা')]},
 {k:'blk',h:'এক দাঁত দিয়া পাঁচ হরফ',p:['এক দাঁতের নিচে এক নুকতা দিলে বা, উপরে এক নুকতা দিলে নূন, নিচে দুই নুকতা দিলে ইয়া, উপরে দুই নুকতা দিলে তা, আর উপরে তিন নুকতা দিলে ছা হয়।'],
  L:[L('ب','বা'),L('ن','না'),L('ي','ইয়া'),L('ت','তা'),L('ث','ছা')]}
]},

{sec:'হরফের গুণ',t:'সিফাত',s:'আওয়াজ কেমন হয়ে বের হবে',b:[
 {k:'note',h:'সহজ কথায়',p:['মাখরাজ হলো হরফের জায়গা, সিফাত হলো সেই জায়গা থেকে আওয়াজটা কেমন হয়ে বের হবে।','তোয়া আর তা-র জায়গা এক, কিন্তু একটা মোটা আরেকটা চিকন — এই পার্থক্যটাই সিফাত।']},
 {k:'blk',h:'হামছ',p:['এই হরফ পড়লে মুখ দিয়ে শ্বাস বের হয়ে যায়, আওয়াজ নরম হয়। মুখস্থ করার শব্দ — ফাহাছাহু শাখছুন।'],
  L:[L('ف'),L('ح'),L('ث'),L('ه'),L('ش'),L('خ'),L('ص'),L('س'),L('ك'),L('ت')],
  a:['এগুলো ছাড়া বাকি হরফে শ্বাস আটকে জোরে আওয়াজ হয়, তাকে জাহর বলে।']},
 {k:'blk',h:'শিদ্দাত',p:['এই হরফ পড়লে আওয়াজ একদম আটকে যায়।'],
  L:[L('ء'),L('ج'),L('د'),L('ق'),L('ط'),L('ب'),L('ك'),L('ت')],
  a:['যেগুলোতে আওয়াজ নরম হয়ে গড়িয়ে যায়, সেগুলোকে রিখওয়াত বলে।']},
 {k:'blk',h:'ইসতিআলা',p:['এই হরফ পড়ার সময় জিহবা উপরে উঠে যায়, আওয়াজ মোটা হয়। মুখস্থ করার শব্দ — খুছ্‌ছা দাগতিন ক্বিজ।'],
  L:[L('خ'),L('ص'),L('ض'),L('غ'),L('ط'),L('ق'),L('ظ')],
  a:['বাকি হরফে জিহবা নিচে থাকে, আওয়াজ চিকন হয় — তাকে ইসতিফাল বলে।']},
 {k:'blk',h:'ইতবাক',p:['এই হরফে জিহবা উপরের তালুর সঙ্গে একদম চেপে যায়, আওয়াজ সবচেয়ে মোটা হয়।'],
  L:[L('ص'),L('ض'),L('ط'),L('ظ')]},
 {k:'blk',h:'ছফীর',p:['এই হরফে শিসের মতো সূক্ষ্ম আওয়াজ হয়।'],L:[L('ص'),L('س'),L('ز')]},
 {k:'blk',h:'লীন',p:['জযমওয়ালা ওয়াও ও ইয়ার আগের হরফে যবর থাকলে আওয়াজ নরম হয়, তাকে লীন বলে।'],
  L:[L('ـَوْ','আও'),L('ـَيْ','আই')]}
]},

{sec:'হরফের গুণ',t:'জযম ও কলকলা',s:'সাকিন হরফ পড়ার নিয়ম',b:[
 {k:'note',h:'জযম',p:['হরফের উপর ছোট গোল চিহ্ন থাকলে তাকে জযম বা সাকিন বলে। সাকিন হরফে হরকত থাকে না, আগের হরফের সঙ্গে মিলিয়ে থেমে পড়তে হয়।']},
 {k:'blk',h:'কলকলা',p:['এই পাঁচ হরফ সাকিন হলে পড়ার সময় হালকা ঝাঁকি দিয়ে আওয়াজ ছাড়তে হয়। মুখস্থ করার শব্দ — কুতুবে জাদ।'],
  L:[L('قْ'),L('طْ'),L('بْ'),L('جْ'),L('دْ')]},
 {k:'blk',h:'কতটুকু ঝাঁকি',p:['শব্দের মাঝখানে হলে ঝাঁকি হালকা। শব্দের শেষে থেমে গেলে স্পষ্ট। তাশদীদওয়ালা হরফে থামলে সবচেয়ে স্পষ্ট।']}
]},

{sec:'তাশদীদ ও গুন্নাহ',t:'তাশদীদ',s:'একবার লিখে দুইবার পড়া',b:[
 {k:'note',h:'নিয়ম',p:['হরফের উপর তাশদীদের চিহ্ন থাকলে ওই হরফ দুইবার পড়তে হয় — প্রথমবার সাকিন করে, দ্বিতীয়বার হরকতের সঙ্গে।']},
 {k:'blk',h:'কীভাবে পড়বেন',steps:['প্রথম হরফটা জযমের মতো আটকে ধরুন।','একটু চাপ দিয়ে ধরে রাখুন।','তারপর হরকতের সঙ্গে ছেড়ে দিন।']},
 {k:'blk',h:'উদাহরণ',L:[L('رَبَّ','রব-বা'),L('إِنَّ','ইন-না'),L('مُحَمَّد','মুহাম-মাদ')]}
]},

{sec:'তাশদীদ ও গুন্নাহ',t:'গুন্নাহ',s:'নাক দিয়ে আওয়াজ টানা',b:[
 {k:'note',h:'নিয়ম',p:['তাশদীদওয়ালা নূন ও মীম আসলে নাক দিয়ে আওয়াজ টেনে পড়তে হয়। এই টানাকেই গুন্নাহ বলে। টান এক আলিফ পরিমাণ।']},

var page=$('page'),cur=-1,idxY=0;

function lets(a){if(!a||!a.length)return '';var h='<div class="lets">';
 for(var i=0;i<a.length;i++){h+='<span class="let"><span class="a">'+a[i].a+'</span>'+
 (a[i].u?'<span class="u">'+a[i].u+'</span>':'')+'</span>'}return h+'</div>'}
function ps(p){if(!p)return '';var a=(p instanceof Array)?p:[p],h='';
 for(var i=0;i<a.length;i++)h+='<p>'+a[i]+'</p>';return h}
function st(s){if(!s)return '';var h='<ol class="step">';
 for(var i=0;i<s.length;i++)h+='<li>'+s[i]+'</li>';return h+'</ol>'}

function blk(b){
 if(b.k==='mk'){var h='';
  for(var i=0;i<MK.length;i++){var m=MK[i];
   h+='<div class="mk"><div class="hd"><span class="num">'+bn(m[0])+'</span><b>'+m[1]+'</b></div>'+
      lets(m[3])+(m[2]?'<p class="ex">'+m[2]+'</p>':'')+'</div>'}
  return h}
 if(b.k==='tb'){var t='<div class="blk"><h3>'+b.h+'</h3><div class="scroll"><table class="tbl"><tr>';
  for(var j=0;j<b.head.length;j++)t+='<th>'+b.head[j]+'</th>';t+='</tr>';
  for(var r=0;r<b.rows.length;r++){t+='<tr>';
   for(var c=0;c<b.rows[r].length;c++){var v=b.rows[r][c];
    t+='<td>'+(/[\u0600-\u06FF]/.test(v)?'<span class="ara">'+v+'</span>':v)+'</td>'}
   t+='</tr>'}
  return t+'</table></div></div>'}
 return '<div class="'+(b.k==='note'?'note':'blk')+'">'+(b.h?'<h3>'+b.h+'</h3>':'')+
  ps(b.p)+st(b.steps)+lets(b.L)+ps(b.a)+'</div>';
}

function drawIndex(){
 var h='<div class="hero"><span class="b">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</span>'+
   '<h1>তাজবীদ</h1><p>মাখরাজ থেকে ওয়াক্‌ফ পর্যন্ত</p></div>',last='';
 for(var i=0;i<T.length;i++){
  if(T[i].sec!==last){h+='<div class="sec">'+T[i].sec+'</div>';last=T[i].sec}
  h+='<button class="tcard" type="button" data-i="'+i+'"><span class="num">'+bn(i+1)+
     '</span><span class="tx"><b>'+T[i].t+'</b><i>'+T[i].s+'</i></span><span class="arw">›</span></button>'}
 page.innerHTML=h;
 var c=page.getElementsByClassName('tcard');
 for(var k=0;k<c.length;k++)c[k].onclick=function(){idxY=window.scrollY;go(+this.getAttribute('data-i'))};
 $('tN').textContent='তাজবীদ';$('tS').textContent='সূচিপত্র';
 $('prev').disabled=true;$('next').disabled=false;$('next').textContent='শুরু করুন →';
}

function drawChap(i){
 var c=T[i],h='<div class="phead"><div class="k">'+c.sec+'</div><h1>'+c.t+'</h1><p>'+c.s+'</p></div>';
 for(var j=0;j<c.b.length;j++)h+=blk(c.b[j]);
 page.innerHTML=h;
 $('tN').textContent=c.t;$('tS').textContent=bn(i+1)+' / '+bn(T.length);
 $('prev').disabled=(i===0);$('next').disabled=(i===T.length-1);
 $('prev').textContent='←';$('next').textContent='পরের →';
}

function go(i,keep){
 cur=i;
 if(i<0){drawIndex();window.scrollTo(0,keep?idxY:0)}
 else{drawChap(i);window.scrollTo(0,0)}
}

$('back').onclick=function(){ if(cur>=0) go(-1,true); else location.href='qaida.html'; };
$('mid').onclick=function(){ if(cur>=0) go(-1,true); };
$('prev').onclick=function(){ if(cur>0) go(cur-1); };
$('next').onclick=function(){ if(cur<T.length-1) go(cur+1); };

function theme(v){document.documentElement.setAttribute('data-t',v);LS.setItem('tj_th',v);
 $('th').textContent=(v==='dark'?'☀':'☾')}
theme(LS.getItem('tj_th')||'light');
$('th').onclick=function(){theme(document.documentElement.getAttribute('data-t')==='dark'?'light':'dark')};

var FS=[1,1.12,1.26];
function fs(k){k=(+k||0)%FS.length;document.documentElement.style.setProperty('--fs',FS[k]);LS.setItem('tj_fs',k)}
fs(LS.getItem('tj_fs')||0);
$('fz').onclick=function(){fs((+LS.getItem('tj_fs')||0)+1)};

go(-1);
