<!DOCTYPE html>
<html lang="bn" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>তাজবীদ · আলিফিয়া ইলম একাডেমি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F0; --card:#FFFFFF; --ink:#1F2328; --mut:#6E7378; --line:#EEE6D8;
  --grn:#1D7A5B; --grnS:#E7F3EE;
  --red:#B4532A; --redS:#FBEEE5;
  --gold:#A8762A; --acc:#F4E7CE;
  --sh:0 1px 2px rgba(31,35,40,.05), 0 8px 22px rgba(31,35,40,.05);
  --r:16px; --fs:1;
}
html[data-t="dark"]{
  --bg:#111310; --card:#1A1D18; --ink:#ECE9E2; --mut:#9CA29A; --line:#2A2E27;
  --grn:#63D2AC; --grnS:#18302A; --red:#EC9970; --redS:#33221A;
  --gold:#D9B166; --acc:#2B2A21;
  --sh:0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  font-size:calc(16px * var(--fs));line-height:1.75;
  padding-bottom:104px;
}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate;line-height:2}

/* ---------- টপ বার ---------- */
.top{
  position:sticky;top:0;z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 14px;
}
.tbtn{
  border:1px solid var(--line);background:var(--acc);color:var(--ink);
  min-width:46px;height:46px;border-radius:14px;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-family:inherit;line-height:1;padding:0 10px;
}
.tbtn:active{transform:scale(.96)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:1.05em;font-weight:700;line-height:1.4}
.ttl i{display:block;font-style:normal;font-size:.8em;color:var(--mut);line-height:1.4}

/* ---------- র‍্যাপার ---------- */
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 10px}
.fade{animation:f .28s ease}
@keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- সূচিপত্র ---------- */
.hero{text-align:center;padding:14px 6px 22px}
.hero .bism{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.45em;color:var(--grn);line-height:2.1}
.hero h1{margin:6px 0 4px;font-size:2em;font-weight:700;line-height:1.5}
.hero p{margin:0;color:var(--mut);font-size:.95em}

.sec{
  display:flex;align-items:center;gap:10px;
  margin:26px 4px 12px;font-size:.92em;font-weight:600;color:var(--gold);
  letter-spacing:.2px;
}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}

.tcard{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;margin:0 0 10px;cursor:pointer;
  font-family:inherit;color:inherit;font-size:1em;transition:.15s;
}
.tcard:active{transform:scale(.99)}
.num{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:46px;height:46px;border-radius:14px;
  background:var(--grnS);color:var(--grn);
  font-weight:700;font-size:1.05em;line-height:1.6;overflow:visible;
}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:1.02em;line-height:1.5;word-break:break-word}
.tx i{display:block;font-style:normal;color:var(--mut);font-size:.85em;line-height:1.55;margin-top:2px}
.arw{flex:0 0 auto;color:var(--mut);font-size:1.4em;line-height:1}

/* ---------- অধ্যায়ের ভিতর ---------- */
.phead{margin:6px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.phead .kicker{color:var(--gold);font-size:.82em;font-weight:600}
.phead h1{margin:4px 0 6px;font-size:1.6em;font-weight:700;line-height:1.5}
.phead p{margin:0;color:var(--mut);font-size:.95em}

.aim{
  background:var(--grnS);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin:0 0 18px;font-size:.95em;
}
.aim b{color:var(--grn)}

.blk{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px;margin:0 0 14px;
}
.blk > h3{
  margin:0 0 10px;font-size:1.08em;font-weight:700;line-height:1.5;
  display:flex;align-items:baseline;gap:8px;
}
.blk > h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
.blk p{margin:0 0 8px}
.blk p:last-child{margin-bottom:0}
.note{background:var(--redS)}

/* সারি সারি নিয়ম */
.ul{list-style:none;margin:0;padding:0}
.ul li{
  position:relative;padding:8px 0 8px 22px;border-top:1px dashed var(--line);
}
.ul li:first-child{border-top:0}
.ul li::before{content:"•";position:absolute;left:6px;top:8px;color:var(--gold)}

/* হরফের ঘর */
.lets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;direction:rtl}
.let{
  min-width:60px;flex:0 0 auto;text-align:center;
  border:1px solid var(--line);border-radius:12px;background:var(--bg);
  padding:8px 6px 6px;
}
.let .a{font-family:'Noto Naskh Arabic',serif;font-size:1.7em;line-height:1.6;display:block}
.let .u{display:block;direction:ltr;font-size:.72em;color:var(--mut);line-height:1.5;margin-top:2px}
.let.hi{background:var(--grnS);border-color:var(--grn)}

/* মাখরাজের কার্ড */
.mk{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  box-shadow:var(--sh);padding:14px;margin:0 0 12px;
}
.mk .hd{display:flex;align-items:center;gap:12px}
.mk .hd .num{width:40px;height:40px;border-radius:12px;font-size:.98em;background:var(--redS);color:var(--red)}
.mk .hd b{font-weight:600;font-size:1.02em;line-height:1.5}
.mk .pl{margin:10px 0 0;color:var(--mut);font-size:.93em}

/* সারণি */
.tb{width:100%;border-collapse:collapse;font-size:.92em}
.tb th,.tb td{border:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:middle;line-height:1.6}
.tb th{background:var(--acc);font-weight:600}
.tb td.c{text-align:center}
.tb td .ara{font-family:'Noto Naskh Arabic',serif;font-size:1.35em;direction:rtl;display:inline-block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- নিচের নেভিগেশন ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;align-items:center;
}
.nb{
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:14px;height:48px;padding:0 14px;font-family:inherit;font-size:.95em;
  cursor:pointer;flex:0 0 auto;
}
.nb[disabled]{opacity:.42;cursor:default}
.nb.mid{flex:1;background:var(--acc);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

  {k:'blk',h:'রা পুর — মোটা করে পড়া',p:['রা-র উপরে যবর বা পেশ থাকলে রা মোটা করে পড়তে হবে। সাকিন রা-র আগের হরফে যবর বা পেশ থাকলেও মোটা হবে।'],L:[L('رَ','রা'),L('رُ','রু'),L('ـَرْ','আর')]},
  {k:'blk',h:'রা বারীক — চিকন করে পড়া',p:['রা-র নিচে যের থাকলে রা চিকন করে পড়তে হবে। সাকিন রা-র আগের হরফে যের থাকলেও চিকন হবে।'],L:[L('رِ','রি'),L('ـِرْ','ইর')]}
 ]},

/* ১১ */ {sec:'ওয়াক্‌ফ', t:'ওয়াক্‌ফের চিহ্ন', s:'কোথায় থামবেন, কোথায় থামবেন না',
 aim:'পড়ার সময় শ্বাস ছেড়ে থামার নিয়ম ও কুরআনের কিনারার চিহ্নগুলো।',
 b:[
  {k:'note',h:'ওয়াক্‌ফ মানে কী',p:['ওয়াক্‌ফ মানে পড়ার সময় একটু থেমে শ্বাস নেওয়া। অর্থ ঠিক থাকে এমন জায়গায় থামতে হয়। কথার মাঝখানে থামলে অর্থ নষ্ট হয়ে যেতে পারে।']},
  {k:'tb',h:'চিহ্নগুলো',head:['চিহ্ন','নাম','কী করবেন'],rows:[
   ['م','ওয়াক্‌ফে লাযিম','অবশ্যই থামতে হবে'],
   ['لا','লা ওয়াক্‌ফা','থামা যাবে না'],
   ['ج','ওয়াক্‌ফে জায়েয','থামলেও হয়, না থামলেও হয়'],
   ['قلى','আল ওয়াক্‌ফু আওলা','থামাই ভালো'],
   ['صلى','আল ওয়াছলু আওলা','না থেমে মিলিয়ে পড়াই ভালো'],
   ['س','সাকতা','আওয়াজ থামবে, শ্বাস নেওয়া যাবে না'],

  ]},
  {k:'note',h:'খেয়াল রাখুন',p:['থামার সময় শেষ হরফ সাকিন করে পড়তে হয়। আর থামার কারণে যদি মদের হরফের পরে জযম এসে যায়, তখন মদ্দে আরিযী হয় — তিন আলিফ টান।']}
 ]}

];

/* ================= রেন্ডার ================= */
const page=$('page');
let cur=-1;            /* -1 = সূচিপত্র */
let idxScroll=0;

function letters(arr){
  if(!arr||!arr.length) return '';
  return '<div class="lets">'+arr.map(x=>
    '<span class="let'+(x.hi?' hi':'')+'"><span class="a">'+x.a+'</span>'+
    (x.u?'<span class="u">'+x.u+'</span>':'')+'</span>').join('')+'</div>';
}
function paras(p){
  if(!p) return '';
  return (Array.isArray(p)?p:[p]).map(t=>'<p>'+t+'</p>').join('');
}

function block(b){
  if(b.k==='mk'){
    return b.items.map(m=>
      '<div class="mk"><div class="hd"><span class="num">'+bn(m.n)+'</span><b>'+m.name+'</b></div>'+
      letters(m.L)+'<p class="pl">'+m.pl+'</p></div>').join('');
  }
  if(b.k==='tb'){
    return '<div class="blk"><h3><span class="dot"></span>'+b.h+'</h3><div class="scroll"><table class="tb">'+
      '<thead><tr>'+b.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+
      b.rows.map(r=>'<tr>'+r.map((c,i)=>{
        const ar=/[\u0600-\u06FF]/.test(c);
        return '<td'+(i===0||ar?' class="c"':'')+'>'+(ar?'<span class="ara">'+c+'</span>':c)+'</td>';
      }).join('')+'</tr>').join('')+'</tbody></table></div></div>';
  }
  const cls='blk'+(b.k==='note'?' note':'');
  return '<div class="'+cls+'">'+(b.h?'<h3><span class="dot"></span>'+b.h+'</h3>':'')+
    paras(b.p)+letters(b.L)+paras(b.after)+'</div>';
}

function drawIndex(){
  let h='<div class="hero"><div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>'+
        '<h1>তাজবীদ</h1><p>মাখরাজ থেকে ওয়াক্‌ফ পর্যন্ত — '+bn(T.length)+'টি পাঠ</p></div>';
  let last='';
  T.forEach((c,i)=>{
    if(c.sec!==last){ h+='<h2 class="sec">'+c.sec+'</h2>'; last=c.sec; }
    h+='<button class="tcard" type="button" data-i="'+i+'">'+
       '<span class="num">'+bn(i+1)+'</span>'+
       '<span class="tx"><b>'+c.t+'</b><i>'+c.s+'</i></span>'+
       '<span class="arw">›</span></button>';
  });
  page.className='wrap fade'; page.innerHTML=h;
  page.querySelectorAll('.tcard').forEach(btn=>{
    btn.onclick=()=>{ idxScroll=window.scrollY; go(+btn.dataset.i); };
  });
  $('crumb').textContent='সূচিপত্র';
  $('mid').textContent='সূচিপত্র';
  $('prev').disabled=true; $('next').disabled=T.length===0;
  $('next').textContent='শুরু করুন →';
}

function drawChapter(i){
  const c=T[i];
  let h='<div class="phead"><div class="kicker">'+c.sec+' · পাঠ '+bn(i+1)+'</div>'+
        '<h1>'+c.t+'</h1><p>'+c.s+'</p></div>';
  if(c.aim) h+='<div class="aim"><b>উদ্দেশ্য:</b> '+c.aim+'</div>';
  c.b.forEach(b=>h+=block(b));
  page.className='wrap fade'; page.innerHTML=h;
  $('crumb').textContent=c.sec+' · '+bn(i+1)+'/'+bn(T.length);
  $('mid').textContent=c.t;
  $('prev').disabled=false; $('next').disabled=(i===T.length-1);
  $('prev').textContent='← পূর্বের'; $('next').textContent='পরের →';
}

function go(i,keep){
  cur=i;
  if(i<0){ drawIndex(); window.scrollTo({top:keep?idxScroll:0,behavior:keep?'auto':'smooth'}); }
  else{ drawChapter(i); window.scrollTo({top:0,behavior:'smooth'}); }
  LS.setItem('tj_last',i);
}

/* নেভিগেশন */
$('prev').onclick=()=>{ if(cur>0) go(cur-1); else if(cur===0) go(-1,true); };
$('next').onclick=()=>{ if(cur<T.length-1) go(cur+1); };
$('mid').onclick=()=>{ if(cur>=0) go(-1,true); };
$('home').onclick=()=>{ location.href='index.html'; };

/* থিম ও লেখার আকার */
function theme(v){ document.documentElement.dataset.t=v; LS.setItem('tj_th',v); $('th').textContent=(v==='dark'?'☀':'☾'); }
theme(LS.getItem('tj_th')||'light');
$('th').onclick=()=>theme(document.documentElement.dataset.t==='dark'?'light':'dark');

const FS=[1,1.12,1.26];
function fs(k){ k=(+k||0)%FS.length; document.documentElement.style.setProperty('--fs',FS[k]); LS.setItem('tj_fs',k); }
fs(LS.getItem('tj_fs')||0);
$('fz').onclick=()=>fs((+LS.getItem('tj_fs')||0)+1);

go(-1);
</script>
</body>
</html>
