<!DOCTYPE html>
<html lang="bn" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>তাজবীদ · আলিফিয়া ইলম একাডেমি</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF7F0; --card:#FFFFFF; --ink:#1F2328; --mut:#6E7378; --line:#EEE6D8;
  --grn:#1D7A5B; --grnS:#E7F3EE;
  --red:#B4532A; --redS:#FBEEE5;
  --gold:#A8762A; --acc:#F4E7CE;
  --sh:0 1px 2px rgba(31,35,40,.05),0 8px 22px rgba(31,35,40,.05);
  --r:16px; --fs:1;
}
html[data-t="dark"]{
  --bg:#121410; --card:#1B1E18; --ink:#ECE9E2; --mut:#9DA39B; --line:#2B2F28;
  --grn:#64D3AD; --grnS:#18302A; --red:#EC9970; --redS:#33221A;
  --gold:#D9B166; --acc:#2B2A21;
  --sh:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  font-size:calc(16px * var(--fs));line-height:1.8;padding-bottom:110px;
}

/* ===== উপরের বার ===== */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:10px 12px}
.tb{border:1px solid var(--line);background:var(--acc);color:var(--ink);
  min-width:44px;min-height:44px;border-radius:13px;font-size:17px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:6px 10px;line-height:1.4}
.tb:active{transform:scale(.96)}
.tt{flex:1;min-width:0;padding:0 2px}
.tt b{display:block;font-size:1.02em;font-weight:700;line-height:1.5}
.tt i{display:block;font-style:normal;font-size:.78em;color:var(--mut);line-height:1.5}

.wrap{max-width:720px;margin:0 auto;padding:18px 14px 8px}
.fade{animation:f .3s ease}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== সূচিপত্র ===== */
.hero{text-align:center;padding:12px 6px 20px}
.hero .bism{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.4em;color:var(--grn);line-height:2.2}
.hero h1{margin:8px 0 4px;font-size:1.9em;font-weight:700;line-height:1.55}
.hero p{margin:0;color:var(--mut);font-size:.94em;line-height:1.7}
.sec{display:flex;align-items:center;gap:10px;margin:26px 2px 12px;
  font-size:.9em;font-weight:600;color:var(--gold);line-height:1.8}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.tcard{width:100%;display:flex;align-items:center;gap:13px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);
  padding:13px;margin:0 0 10px;cursor:pointer;font-family:inherit;color:inherit;font-size:1em}
.tcard:active{transform:scale(.99)}
.num{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;min-height:44px;padding:4px 8px;border-radius:13px;
  background:var(--grnS);color:var(--grn);font-weight:700;font-size:1.02em;line-height:1.9}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:1.01em;line-height:1.6;overflow-wrap:break-word}
.tx i{display:block;font-style:normal;color:var(--mut);font-size:.84em;line-height:1.65;margin-top:1px;overflow-wrap:break-word}
.arw{flex:0 0 auto;color:var(--mut);font-size:1.35em;line-height:1.4;padding-left:2px}

/* ===== অধ্যায় ===== */
.phead{margin:4px 0 18px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.phead .kick{color:var(--gold);font-size:.8em;font-weight:600;line-height:1.8}
.phead h1{margin:3px 0 5px;font-size:1.55em;font-weight:700;line-height:1.55}
.phead p{margin:0;color:var(--mut);font-size:.93em;line-height:1.75}
.aim{background:var(--grnS);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin:0 0 16px;font-size:.94em}
.aim b{color:var(--grn)}
.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:15px;margin:0 0 13px}
.blk h3{margin:0 0 9px;font-size:1.05em;font-weight:700;line-height:1.6;
  display:flex;align-items:baseline;gap:8px}
.blk h3 .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--red);margin-top:.5em}
.blk p{margin:0 0 8px;overflow-wrap:break-word}
.blk p:last-child{margin-bottom:0}
.note{background:var(--redS)}
.step{counter-reset:s;list-style:none;margin:8px 0 0;padding:0}
.step li{position:relative;padding:8px 0 8px 30px;border-top:1px dashed var(--line);line-height:1.8}
.step li:first-child{border-top:0}
.step li::before{counter-increment:s;content:counter(s,bengali)".";position:absolute;left:0;top:8px;
  color:var(--gold);font-weight:600}

/* হরফের ঘর */
.lets{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;direction:rtl}
.let{flex:0 0 auto;min-width:62px;text-align:center;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:7px 8px 6px}
.let .a{display:block;font-family:'Noto Naskh Arabic',serif;direction:rtl;
  font-size:1.65em;line-height:1.85}
.let .u{display:block;direction:ltr;font-size:.7em;color:var(--mut);line-height:1.7}
.let.hi{background:var(--grnS);border-color:var(--grn)}

/* মাখরাজ কার্ড */
.mk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:14px;margin:0 0 12px}
.mk .hd{display:flex;align-items:flex-start;gap:12px}
.mk .hd .num{background:var(--redS);color:var(--red);min-width:40px;min-height:40px;
  border-radius:12px;font-size:.96em}
.mk .hd b{font-weight:600;font-size:1em;line-height:1.65;overflow-wrap:break-word;padding-top:6px}
.mk .pl{margin:10px 0 0;color:var(--mut);font-size:.92em;line-height:1.8}

/* সারণি */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 10px;text-align:left;line-height:1.75;vertical-align:middle}
.tbl th{background:var(--acc);font-weight:600}
.tbl td.c{text-align:center}
.tbl .ara{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:1.3em;
  display:inline-block;line-height:1.9}

/* ===== নিচের নেভিগেশন ===== */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  border-top:1px solid var(--line);display:flex;gap:8px;align-items:stretch;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.nb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;
  min-height:48px;padding:8px 13px;font-family:inherit;font-size:.93em;line-height:1.6;cursor:pointer}
.nb[disabled]{opacity:.4}
.nb.mid{flex:1;background:var(--acc);font-weight:600;min-width:0;overflow-wrap:break-word}
</style>
</head>
<body>

<div class="top">
  <button class="tb" id="home">⌂</button>
  <div class="tt"><b>তাজবীদ</b><i id="crumb">সূচিপত্র</i></div>
  <button class="tb" id="fz">অ</button>
  <button class="tb" id="th">☾</button>
</div>

<div class="wrap" id="page"></div>

<div class="nav">
  <button class="nb" id="prev">← পূর্বের</button>
  <button class="nb mid" id="mid">সূচিপত্র</button>
  <button class="nb" id="next">পরের →</button>
</div>

{sec:'মাখরাজ',t:'সতেরো মাখরাজ',s:'হরফ উচ্চারণের সতেরোটি স্থান',

b:[
 {k:'note',h:'মাখরাজ মানে কী',p:['মাখরাজ মানে হরফ বের হওয়ার জায়গা। মুখের যে জায়গা থেকে হরফের আওয়াজ বের হয়, সেটাই ওই হরফের মাখরাজ।','আরবি হরফ ঊনত্রিশটি, আর মাখরাজ সতেরোটি। এই সতেরোটি পাঁচটা বড় জায়গায় ভাগ করা — গলা, জিহবা, দুই ঠোঁট, নাক আর মুখের ভিতরের খালি জায়গা।']},

/* ===== রেন্ডার ===== */
var page=$('page'), cur=-1, idxY=0;

function letters(arr){
  if(!arr||!arr.length) return '';
  var h='<div class="lets">';
  for(var i=0;i<arr.length;i++){
    var x=arr[i];
    h+='<span class="let'+(x.hi?' hi':'')+'"><span class="a">'+x.a+'</span>';
    if(x.u) h+='<span class="u">'+x.u+'</span>';
    h+='</span>';
  }
  return h+'</div>';
}
function paras(p){
  if(!p) return '';
  var a=(p instanceof Array)?p:[p], h='';
  for(var i=0;i<a.length;i++) h+='<p>'+a[i]+'</p>';
  return h;
}
function steps(s){
  if(!s||!s.length) return '';
  var h='<ol class="step">';
  for(var i=0;i<s.length;i++) h+='<li>'+s[i]+'</li>';
  return h+'</ol>';
}
function block(b){
  if(b.k==='mk'){
    var h='';
    for(var i=0;i<b.items.length;i++){
      var m=b.items[i];
      h+='<div class="mk"><div class="hd"><span class="num">'+bn(m.n)+'</span><b>'+m.name+'</b></div>'+
         letters(m.L)+'<p class="pl">'+m.pl+'</p></div>';
    }
    return h;
  }
  if(b.k==='tb'){
    var t='<div class="blk"><h3><span class="dot"></span>'+b.h+'</h3><div class="scroll"><table class="tbl"><thead><tr>';
    for(var j=0;j<b.head.length;j++) t+='<th>'+b.head[j]+'</th>';
    t+='</tr></thead><tbody>';
    for(var r=0;r<b.rows.length;r++){
      t+='<tr>';
      for(var c=0;c<b.rows[r].length;c++){
        var v=b.rows[r][c], ar=/[\u0600-\u06FF]/.test(v);
        t+='<td'+(ar||c===0?' class="c"':'')+'>'+(ar?'<span class="ara">'+v+'</span>':v)+'</td>';
      }
      t+='</tr>';
    }
    return t+'</tbody></table></div></div>';
  }
  return '<div class="blk'+(b.k==='note'?' note':'')+'">'+
    (b.h?'<h3><span class="dot"></span>'+b.h+'</h3>':'')+
    paras(b.p)+steps(b.steps)+letters(b.L)+paras(b.after)+'</div>';
}

function drawIndex(){
  var h='<div class="hero"><div class="bism">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>'+
        '<h1>তাজবীদ</h1><p>মাখরাজ থেকে ওয়াক্‌ফ পর্যন্ত '+bn(T.length)+'টি পাঠ</p></div>';
  var last='';
  for(var i=0;i<T.length;i++){
    if(T[i].sec!==last){ h+='<div class="sec">'+T[i].sec+'</div>'; last=T[i].sec; }
    h+='<button class="tcard" type="button" data-i="'+i+'">'+
       '<span class="num">'+bn(i+1)+'</span>'+
       '<span class="tx"><b>'+T[i].t+'</b><i>'+T[i].s+'</i></span>'+
       '<span class="arw">›</span></button>';
  }
  page.className='wrap fade'; page.innerHTML=h;
  var cards=page.getElementsByClassName('tcard');
  for(var k=0;k<cards.length;k++){
    cards[k].onclick=function(){ idxY=window.scrollY; go(+this.getAttribute('data-i')); };
  }
  $('crumb').textContent='সূচিপত্র';
  $('mid').textContent='সূচিপত্র';
  $('prev').disabled=true;
  $('next').disabled=false;
  $('next').textContent='শুরু করুন →';
}

function drawChap(i){
  var c=T[i];
  var h='<div class="phead"><div class="kick">'+c.sec+' · পাঠ '+bn(i+1)+'</div>'+
        '<h1>'+c.t+'</h1><p>'+c.s+'</p></div>';
  if(c.aim) h+='<div class="aim"><b>উদ্দেশ্য:</b> '+c.aim+'</div>';
  for(var j=0;j<c.b.length;j++) h+=block(c.b[j]);
  page.className='wrap fade'; page.innerHTML=h;
  $('crumb').textContent=bn(i+1)+' / '+bn(T.length)+' · '+c.sec;
  $('mid').textContent='সূচিপত্র';
  $('prev').disabled=false;
  $('next').disabled=(i===T.length-1);
  $('prev').textContent='← পূর্বের';
  $('next').textContent='পরের →';
}

function go(i,keep){
  cur=i;
  if(i<0){
    drawIndex();
    window.scrollTo(0, keep?idxY:0);
  }else{
    drawChap(i);
    window.scrollTo(0,0);
  }
  LS.setItem('tj_last',i);
}

$('prev').onclick=function(){ if(cur>0) go(cur-1); else if(cur===0) go(-1,true); };
$('next').onclick=function(){ if(cur<T.length-1) go(cur+1); };
$('mid').onclick=function(){ if(cur>=0) go(-1,true); };
$('home').onclick=function(){ location.href='index.html'; };

function theme(v){
  document.documentElement.setAttribute('data-t',v);
  LS.setItem('tj_th',v);
  $('th').textContent=(v==='dark'?'☀':'☾');
}
theme(LS.getItem('tj_th')||'light');
$('th').onclick=function(){
  theme(document.documentElement.getAttribute('data-t')==='dark'?'light':'dark');
};

var FS=[1,1.12,1.26];
function fs(k){
  k=(+k||0)%FS.length;
  document.documentElement.style.setProperty('--fs',FS[k]);
  LS.setItem('tj_fs',k);
}
fs(LS.getItem('tj_fs')||0);
$('fz').onclick=function(){ fs((+LS.getItem('tj_fs')||0)+1); };

go(-1);
</script>
