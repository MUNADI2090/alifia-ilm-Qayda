<!DOCTYPE html>
<html lang="bn" data-t="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>তাজবীদ · আলিফিয়া ইলম একাডেমি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F1; --card:#FFFFFF; --soft:#FFFDF8;
  --ink:#1E2227; --mut:#6C7278; --line:#EDE5D6;
  --grn:#1C7A57; --grnS:#EAF5F0;
  --red:#A9512A; --redS:#FAEFE7;
  --blu:#2B5C8C; --bluS:#EAF1F8;
  --gold:#9C7226; --goldS:#F8F1E0;
  --r:14px; --fs:1;
}
html[data-t="dark"]{
  --bg:#13150F; --card:#1C1F18; --soft:#20241C;
  --ink:#EDEAE2; --mut:#9AA096; --line:#2C3129;
  --grn:#63D2AA; --grnS:#17302A;
  --red:#E9996F; --redS:#32211A;
  --blu:#82B4E4; --bluS:#1A2734;
  --gold:#D6AE63; --goldS:#2C2519;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Hind Siliguri',system-ui,-apple-system,sans-serif;
  font-size:calc(16px * var(--fs));line-height:1.85;
  padding:60px 0 96px;overflow-wrap:break-word;
}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;unicode-bidi:isolate;line-height:2.1}

/* ---------- top bar ---------- */
.top{
  position:fixed;top:0;left:0;right:0;z-index:50;height:56px;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--card);border-bottom:1px solid var(--line);
}
.tb{
  flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;
  display:flex;align-items:center;justify-content:center;
  background:var(--soft);color:var(--ink);
  border:1px solid var(--line);border-radius:11px;
  font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
}
.tb:active{background:var(--line)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tt{flex:1 1 auto;min-width:0;text-align:center;line-height:1.25}
.tt b{display:block;font-size:16px;font-weight:700}
.tt i{display:block;font-style:normal;font-size:12px;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 10px}

/* ---------- index ---------- */
.hero{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 18px;text-align:center;margin-bottom:18px;
}
.hero .ar{font-size:1.5em;color:var(--grn);margin-bottom:6px}
.hero h1{margin:0 0 6px;font-size:1.35em;font-weight:700}
.hero p{margin:0;color:var(--mut);font-size:.92em}

.ilist{display:flex;flex-direction:column;gap:10px}
.item{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:right;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 14px;cursor:pointer;font-family:inherit;color:inherit;
  font-size:1em;direction:ltr;
}
.item:active{background:var(--soft)}
.inum{
  flex:0 0 auto;min-width:38px;padding:5px 8px;border-radius:10px;
  background:var(--grnS);color:var(--grn);
  font-weight:700;font-size:.95em;text-align:center;line-height:1.5;
}
.itxt{flex:1 1 auto;min-width:0}
.itxt b{display:block;font-size:1.05em;font-weight:700;line-height:1.5}
.itxt span{display:block;color:var(--mut);font-size:.86em;line-height:1.6}
.iarw{flex:0 0 auto;color:var(--mut);font-size:1.2em;padding-top:2px}

/* ---------- chapter ---------- */
.chead{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px;margin-bottom:16px;
}
.cbadge{
  display:inline-block;padding:4px 12px;border-radius:999px;
  background:var(--goldS);color:var(--gold);font-size:.8em;font-weight:700;margin-bottom:8px;
}
.chead h2{margin:0 0 4px;font-size:1.3em;font-weight:700;line-height:1.5}
.chead p{margin:0;color:var(--mut);font-size:.9em}

.sec{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px;margin-bottom:14px;
}
.sec > :first-child{margin-top:0}
.sec > :last-child{margin-bottom:0}

h3.hd{
  margin:0 0 12px;font-size:1.1em;font-weight:700;color:var(--grn);
  padding-bottom:8px;border-bottom:1px solid var(--line);line-height:1.6;
}
p.tx{margin:0 0 12px;line-height:1.95}
.note{
  background:var(--bluS);border-right:4px solid var(--blu);border-radius:10px;
  padding:12px 14px;margin:0 0 12px;font-size:.95em;line-height:1.85;
}
.warn{
  background:var(--redS);border-right:4px solid var(--red);border-radius:10px;
  padding:12px 14px;margin:0 0 12px;font-size:.95em;line-height:1.85;
}

/* ---------- makhraj card ---------- */
.gtitle{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;
  font-size:1.02em;font-weight:700;color:var(--gold);
}
.gtitle:before{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.gtitle span{flex:0 0 auto}
.gtitle:after{content:"";flex:1 1 auto;height:1px;background:var(--line)}

.mk{
  border:1px solid var(--line);border-radius:12px;
  background:var(--soft);padding:13px 13px;margin-bottom:11px;
}
.mkh{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.mkn{
  flex:0 0 auto;min-width:40px;padding:6px 8px;border-radius:10px;
  background:var(--grn);color:#fff;font-weight:700;font-size:.95em;
  text-align:center;line-height:1.5;
}
.mkt{flex:1 1 auto;min-width:0}
.mkt b{display:block;font-weight:700;font-size:1em;line-height:1.55}
.mkt span{display:block;color:var(--mut);font-size:.88em;line-height:1.7;margin-top:2px}

/* ---------- letter boxes ---------- */
.lets{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:flex-start}
.let{
  flex:0 0 auto;min-width:64px;padding:9px 10px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  text-align:center;
}
.let .a{
  display:block;font-family:'Noto Naskh Arabic',serif;direction:rtl;
  font-size:1.65em;font-weight:500;line-height:1.7;color:var(--ink);
}
.let .u{display:block;font-size:.76em;color:var(--mut);line-height:1.6;margin-top:1px;direction:ltr}

/* ---------- numbered rows ---------- */
.rows{display:flex;flex-direction:column;gap:10px}
.row{
  display:flex;align-items:flex-start;gap:11px;
  background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 12px;
}
.rn{
  flex:0 0 auto;min-width:36px;padding:5px 7px;border-radius:9px;
  background:var(--goldS);color:var(--gold);font-weight:700;font-size:.9em;
  text-align:center;line-height:1.5;
}
.rc{flex:1 1 auto;min-width:0}
.rc b{display:block;font-weight:700;line-height:1.6;margin-bottom:2px}
.rc span{display:block;color:var(--mut);font-size:.92em;line-height:1.85}
.rc .ex{
  display:block;margin-top:7px;padding:7px 11px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);
  font-family:'Noto Naskh Arabic',serif;direction:rtl;text-align:right;
  font-size:1.35em;line-height:2;color:var(--grn);
}
.rc .sign{
  display:inline-block;margin-bottom:6px;padding:4px 14px;border-radius:9px;
  background:var(--card);border:1px solid var(--line);
  font-family:'Noto Naskh Arabic',serif;direction:rtl;
  font-size:1.3em;line-height:1.9;color:var(--red);
}

/* ---------- big arabic line ---------- */
.big{
  background:var(--soft);border:1px solid var(--line);border-radius:12px;
  padding:14px 14px;margin:0 0 12px;text-align:center;
}
.big .a{
  font-family:'Noto Naskh Arabic',serif;direction:rtl;
  font-size:1.8em;line-height:2.1;color:var(--grn);display:block;
}
.big .u{display:block;font-size:.85em;color:var(--mut);margin-top:6px;line-height:1.7}

/* ---------- key/value list ---------- */
.kv{display:flex;flex-direction:column;gap:8px}
.kvr{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;background:var(--soft);
  border:1px solid var(--line);border-radius:11px;
}
.kvr b{flex:0 0 38%;font-weight:700;line-height:1.7}
.kvr span{flex:1 1 auto;color:var(--mut);line-height:1.8;font-size:.94em}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line);
}
.nb{
  flex:1 1 0;min-width:0;padding:12px 6px;border-radius:12px;
  background:var(--soft);color:var(--ink);border:1px solid var(--line);
  font-family:inherit;font-size:.95em;font-weight:600;cursor:pointer;line-height:1.5;
}
.nb:active{background:var(--line)}
.nb.mid{background:var(--grn);color:#fff;border-color:var(--grn)}
.nb[disabled]{opacity:.35}
.foot{text-align:center;color:var(--mut);font-size:.82em;padding:14px 0 4px;line-height:1.8}
</style>
</head>
<body>

<div class="top">
  <button class="tb" id="back" aria-label="পিছনে">
    <svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
  </button>
  <div class="tt"><b>তাজবীদ</b><i id="crumb">সূচিপত্র</i></div>
  <button class="tb" id="fz" aria-label="লেখার আকার">অ</button>
  <button class="tb" id="th" aria-label="থিম">☾</button>
</div>

<div class="wrap" id="page"></div>

<div class="nav">
  <button class="nb" id="prev">← আগের</button>
  <button class="nb mid" id="mid">সূচিপত্র</button>
  <button class="nb" id="next">পরের →</button>
</div>

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function L(a,u){ return {a:a, u:u||''}; }

function R(t,d,a){ return {t:t, d:d||'', a:a||''}; }

{

       [L('ل','লাম')]),
    MK(9,'জিহ্বার আগা ও উপরের মাড়ির গোড়া',
       'লামের জায়গার চেয়ে একটু নিচে, জিহ্বার আগা উপরের মাড়ির গোড়ায় লাগে। সাথে নাক দিয়ে গুন্নাহ আসে।',

    MK(14,'নিচের ঠোঁটের ভিতর ও উপরের সামনের দুই দাঁতের আগা',

/* =====================================================================
   রেন্ডার
   ===================================================================== */
function letsHTML(list){
  var h = '<div class="lets">';
  for (var i=0;i<list.length;i++){
    h += '<div class="let"><span class="a">'+list[i].a+'</span>'+
         (list[i].u ? '<span class="u">'+esc(list[i].u)+'</span>' : '')+'</div>';
  }
  return h + '</div>';
}

function blockHTML(b){
  switch(b.k){
    case 'h':    return '<h3 class="hd">'+b.t+'</h3>';
    case 'p':    return '<p class="tx">'+b.t+'</p>';
    case 'note': return '<div class="note">'+b.t+'</div>';
    case 'warn': return '<div class="warn">'+b.t+'</div>';
    case 'g':    return '<div class="gtitle"><span>'+b.t+'</span></div>';
    case 'lets': return letsHTML(b.L);
    case 'big':  return '<div class="big"><span class="a">'+b.a+'</span>'+
                        (b.u ? '<span class="u">'+esc(b.u)+'</span>' : '')+'</div>';
    case 'mk':
      return '<div class="mk">'+
               '<div class="mkh">'+
                 '<div class="mkn">'+bn(b.n)+'</div>'+
                 '<div class="mkt"><b>'+b.t+'</b><span>'+b.d+'</span></div>'+
               '</div>'+
               letsHTML(b.L)+
             '</div>';
    case 'rows':
      var r = '<div class="rows">';
      for (var i=0;i<b.L.length;i++){
        var it = b.L[i];
        r += '<div class="row">'+
               '<div class="rn">'+bn(i+1)+'</div>'+
               '<div class="rc">'+
                 (it.a && it.a.length<=6 && b.sign ? '<span class="sign">'+it.a+'</span>' : '')+
                 '<b>'+it.t+'</b>'+
                 (it.d ? '<span>'+it.d+'</span>' : '')+
                 (it.a && !b.sign ? '<span class="ex">'+it.a+'</span>' : '')+
               '</div>'+
             '</div>';
      }
      return r + '</div>';
    case 'kv':
      var k = '<div class="kv">';
      for (var j=0;j<b.L.length;j++){
        k += '<div class="kvr"><b>'+esc(b.L[j][0])+'</b><span>'+esc(b.L[j][1])+'</span></div>';
      }
      return k + '</div>';
    case 'sec':
      var s = '<div class="sec">';
      for (var m=0;m<b.c.length;m++) s += blockHTML(b.c[m]);
      return s + '</div>';
    default: return '';
  }
}

/* ---------- সূচিপত্র ---------- */
function drawIndex(){
  var h = '<div class="hero">'+
            '<div class="ar">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</div>'+
            '<h1>তাজবীদ শিক্ষা</h1>'+
            '<p>মোট '+bn(T.length)+'টি অধ্যায় · ধাপে ধাপে সহজ ভাষায়</p>'+
          '</div><div class="ilist">';
  for (var i=0;i<T.length;i++){
    h += '<button class="item" data-i="'+i+'">'+
           '<span class="inum">'+bn(i+1)+'</span>'+
           '<span class="itxt"><b>'+T[i].t+'</b><span>'+T[i].s+'</span></span>'+
           '<span class="iarw">›</span>'+
         '</button>';
  }
  h += '</div><div class="foot">আলিফিয়া ইলম একাডেমি</div>';
  return h;
}

/* ---------- অধ্যায় ---------- */
function drawChapter(i){
  var c = T[i];
  var h = '<div class="chead">'+
            '<div class="cbadge">অধ্যায় '+bn(i+1)+'</div>'+
            '<h2>'+c.t+'</h2><p>'+c.s+'</p>'+
          '</div>';
  for (var j=0;j<c.b.length;j++) h += blockHTML(c.b[j]);
  h += '<div class="foot">অধ্যায় '+bn(i+1)+' / '+bn(T.length)+'</div>';
  return h;
}

var cur  = -1;             /* -1 = সূচিপত্র */
var idxScroll = 0;         /* সূচিপত্রের স্ক্রল মনে রাখার জন্য */

function paint(){
  var p = $('page');
  if (cur < 0){
    p.innerHTML = drawIndex();
    $('crumb').textContent = 'সূচিপত্র';
    $('prev').disabled = true;
    $('next').disabled = false;
    $('prev').textContent = '← আগের';
    $('next').textContent = 'শুরু করুন →';
    $('mid').textContent  = 'হোম';
    /* সূচিতে ফিরে আগের জায়গায় নিয়ে যাই */
    window.scrollTo(0, idxScroll);
  } else {
    p.innerHTML = drawChapter(cur);
    $('crumb').textContent = T[cur].t;
    $('prev').disabled = (cur === 0);
    $('next').disabled = (cur === T.length - 1);
    $('prev').textContent = '← আগের';
    $('next').textContent = 'পরের →';
    $('mid').textContent  = 'সূচিপত্র';
    window.scrollTo(0, 0);
  }
}

function goto(i){
  if (cur < 0) idxScroll = window.pageYOffset || document.documentElement.scrollTop;
  cur = i;
  paint();
}

/* সূচিপত্রে ক্লিক */
$('page').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.item') : null;
  if (b) goto(parseInt(b.getAttribute('data-i'), 10));
});

/* উপরের বাম দিকের ব্যাক অ্যারো */
$('back').addEventListener('click', function(){
  if (cur >= 0) { cur = -1; paint(); }
  else { window.location.href = HOME; }
});

/* নিচের বাটন */
$('prev').addEventListener('click', function(){ if (cur > 0) goto(cur - 1); });
$('next').addEventListener('click', function(){
  if (cur < 0) goto(0);
  else if (cur < T.length - 1) goto(cur + 1);
});
$('mid').addEventListener('click', function(){
  if (cur >= 0) { cur = -1; paint(); }
  else { window.location.href = HOME; }
});

/* মোবাইলের ব্যাক বোতামেও যেন সূচিতে ফেরে */
history.replaceState({v:-1}, '');
window.addEventListener('popstate', function(){
  if (cur >= 0) { cur = -1; paint(); history.pushState({v:-1}, ''); }
});
document.addEventListener('click', function(e){
  if (e.target.closest && e.target.closest('.item')) history.pushState({v:0}, '');
});

   থিম ও লেখার আকার
   ===================================================================== */

  var t = LS.getItem('tj_theme') || 'light';
  document.documentElement.setAttribute('data-t', t);
  $('th').textContent = (t === 'dark' ? '☀' : '☾');
})();
$('th').addEventListener('click', function(){
  var n = document.documentElement.getAttribute('data-t') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-t', n);
  LS.setItem('tj_theme', n);
  this.textContent = (n === 'dark' ? '☀' : '☾');
});

var SZ = [0.92, 1, 1.12, 1.26];
var si = parseInt(LS.getItem('tj_size') || '1', 10);
function applySize(){
  document.documentElement.style.setProperty('--fs', SZ[si]);
  LS.setItem('tj_size', si);
}
applySize();
$('fz').addEventListener('click', function(){
  si = (si + 1) % SZ.length;
  applySize();
});

/* শুরু */
paint();
