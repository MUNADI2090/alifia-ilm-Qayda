<!DOCTYPE html>
<html lang="bn" data-theme="light" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>আলিফিয়া ইলম কায়দা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --card:#ffffff; --line:#d7dee8;
  --ink:#0b1220; --ink2:#46536b;
  --ar:#0b1220;
  --green:#0e7a52; --green-bg:#e3f5ec;
  --red:#b32b32; --red-bg:#fdeaea;
  --btn:#ffffff; --btn-ink:#0b1220;
  --shadow:0 2px 10px rgba(16,24,40,.07);
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#0d1420; --card:#161f2e; --line:#2c3a4f;
  --ink:#f2f6fb; --ink2:#c3cfdf;
  --ar:#ffffff;
  --green:#4ade9b; --green-bg:#122e24;
  --red:#ff8d8d; --red-bg:#331a1c;
  --btn:#1e293b; --btn-ink:#f2f6fb;
  --shadow:0 2px 10px rgba(0,0,0,.35);
}
html[data-fs="s"]{--base:16px; --arsz:40px; --tilesz:56px;}
html[data-fs="m"]{--base:18px; --arsz:50px; --tilesz:68px;}
html[data-fs="l"]{--base:21px; --arsz:62px; --tilesz:82px;}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif;
  font-size:var(--base); line-height:1.75; font-weight:500;
}
.ar{font-family:'Noto Naskh Arabic',serif; direction:rtl; color:var(--ar); font-weight:600;}

/* ---------- হেডার ---------- */
header{
  position:sticky; top:0; z-index:30; background:var(--card);
  border-bottom:2px solid var(--line); box-shadow:var(--shadow);
}
.hwrap{max-width:900px; margin:auto; padding:10px 14px; display:flex; align-items:center; gap:10px;}
.logo{
  width:42px; height:42px; border-radius:12px; flex:0 0 auto;
  background:var(--green-bg); color:var(--green);
  display:flex; align-items:center; justify-content:center;
  font-family:'Noto Naskh Arabic',serif; font-size:24px; font-weight:700;
}
.hname{flex:1; min-width:0;}
.hname b{display:block; font-size:1.05em; font-weight:700; line-height:1.3;}
.hname span{display:block; font-size:.78em; color:var(--ink2);}
.tool{
  border:2px solid var(--line); background:var(--btn); color:var(--btn-ink);
  border-radius:11px; padding:7px 11px; font-size:.85em; font-weight:700;
  cursor:pointer; font-family:inherit;
}
.tool:active{transform:scale(.96);}

/* ---------- মোড বার ---------- */
.modebar{max-width:900px; margin:auto; padding:0 14px 10px; display:flex; gap:8px; align-items:center;}
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
  border-radius:999px; font-size:.82em; font-weight:700; border:2px solid transparent;
}
.chip.stu{background:var(--red-bg); color:var(--red); border-color:var(--red);}
.chip.ust{background:var(--green-bg); color:var(--green); border-color:var(--green);}
.dot{width:9px; height:9px; border-radius:50%; background:currentColor;}

/* ---------- অগ্রগতি ---------- */
.prog{max-width:900px; margin:auto; padding:0 14px 10px;}
.ptxt{font-size:.8em; color:var(--ink2); font-weight:600; margin-bottom:5px;}
.pbar{height:9px; background:var(--line); border-radius:99px; overflow:hidden;}
.pfill{height:100%; width:0; background:var(--green); border-radius:99px; transition:width .3s;}

/* ---------- পৃষ্ঠা ---------- */
main{max-width:900px; margin:auto; padding:6px 14px 120px;}
.page{background:var(--card); border:2px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px 16px; margin-bottom:16px;}
.pno{
  display:inline-block; background:var(--green-bg); color:var(--green);
  font-size:.78em; font-weight:700; padding:3px 12px; border-radius:99px; margin-bottom:10px;
}
h1{font-size:1.35em; margin:0 0 4px; font-weight:700; line-height:1.4;}
.sub{color:var(--ink2); font-size:.92em; margin:0 0 12px;}
.aim{
  background:var(--green-bg); color:var(--ink); border-left:5px solid var(--green);
  border-radius:10px; padding:10px 13px; font-size:.92em; margin-bottom:16px; font-weight:600;
}
html[data-theme="dark"] .aim{color:var(--ink);}

.blk{margin-bottom:20px;}
.blk h3{
  font-size:1.02em; font-weight:700; margin:0 0 10px; padding-bottom:6px;
  border-bottom:2px solid var(--line);
}

/* হরফের ঘর */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(var(--tilesz),1fr)); gap:9px;}
.tile{
  position:relative; aspect-ratio:1/1; border:2px solid var(--line); border-radius:12px;
  background:var(--card); display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:.15s;
}
.tile .ar{font-size:var(--arsz); line-height:1;}
.tile:active{transform:scale(.94); border-color:var(--green);}
.tile.done{border-color:var(--green); background:var(--green-bg);}
.tick{
  position:absolute; top:-7px; left:-7px; width:22px; height:22px; border-radius:50%;
  background:var(--green); color:#fff; font-size:13px; font-weight:700;
  display:none; align-items:center; justify-content:center; border:2px solid var(--card);
}
.tile.done .tick{display:flex;}
.tmark{
  position:absolute; bottom:-6px; right:-6px; width:24px; height:24px; border-radius:50%;
  background:var(--btn); color:var(--ink2); border:2px solid var(--line);
  font-size:13px; font-weight:700; display:none; align-items:center; justify-content:center;
}
body.ustad .tmark{display:flex;}

/* সারি / উদাহরণ */
.row{display:flex; flex-wrap:wrap; gap:8px;}
.pill{
  border:2px solid var(--line); border-radius:11px; background:var(--card);
  padding:8px 14px; min-width:56px; text-align:center;
}
.pill .ar{font-size:calc(var(--arsz) * .68); line-height:1.3;}
.ex{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px;}
.exi{border:2px solid var(--line); border-radius:11px; padding:9px 12px; background:var(--card); text-align:center;}
.exi .ar{display:block; font-size:calc(var(--arsz) * .62); line-height:1.6;}
.exi small{display:block; color:var(--ink2); font-size:.8em; font-weight:600;}

/* তালিকা */
ul.pt{margin:0; padding-left:20px;}
ul.pt li{margin-bottom:7px;}
ul.pt li b{color:var(--green);}

/* টেবিল */
.tw{overflow-x:auto; border:2px solid var(--line); border-radius:11px;}
table{width:100%; border-collapse:collapse; font-size:.93em;}
th{background:var(--green-bg); color:var(--green); font-weight:700; text-align:left; padding:9px 11px;}
td{padding:9px 11px; border-top:1px solid var(--line); vertical-align:middle;}
td .ar{font-size:calc(var(--arsz) * .55);}

/* উস্তাদের নোট */
.unote{display:none; border:2px dashed var(--green); background:var(--green-bg); border-radius:11px; padding:11px 13px;}
body.ustad .unote{display:block;}
.unote b{color:var(--green); display:block; margin-bottom:4px;}

/* ---------- নিচের নেভিগেশন ---------- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30; background:var(--card);
  border-top:2px solid var(--line); box-shadow:0 -2px 12px rgba(16,24,40,.10);
}
.nwrap{max-width:900px; margin:auto; padding:10px 14px; display:flex; gap:9px; align-items:center;}
.nbtn{
  flex:0 0 auto; border:2px solid var(--line); background:var(--btn); color:var(--btn-ink);
  border-radius:12px; padding:11px 16px; font-size:.95em; font-weight:700; cursor:pointer; font-family:inherit;
}
.nbtn.main{background:var(--green); color:#fff; border-color:var(--green);}
.nbtn:disabled{opacity:.4;}
select{
  flex:1; min-width:0; border:2px solid var(--line); background:var(--btn); color:var(--btn-ink);
  border-radius:12px; padding:11px 8px; font-size:.88em; font-weight:600; font-family:inherit;
}
footer{text-align:center; color:var(--ink2); font-size:.8em; padding:4px 0 10px;}

/* ---------- পপ-আপ ---------- */
.mask{
  position:fixed; inset:0; z-index:50; background:rgba(8,14,24,.62);
  display:none; align-items:center; justify-content:center; padding:20px;
}
.mask.on{display:flex;}
.modal{
  background:var(--card); border:2px solid var(--line); border-radius:18px;
  padding:22px 18px; max-width:380px; width:100%; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.4);
}
.modal .big{font-size:calc(var(--arsz) * 1.5); line-height:1.2; display:block; margin-bottom:10px;}
.modal h4{margin:0 0 3px; font-size:1.25em; font-weight:700;}
.modal .mk{color:var(--ink2); font-size:.93em; margin:8px 0 0;}
.modal .un{display:none; margin-top:13px; padding:10px 12px; border-radius:10px; background:var(--green-bg); color:var(--ink); font-size:.9em; text-align:left; border-left:5px solid var(--green);}
body.ustad .modal .un{display:block;}
.mclose{margin-top:16px; width:100%; border:none; background:var(--green); color:#fff; padding:12px; border-radius:12px; font-size:1em; font-weight:700; cursor:pointer; font-family:inherit;}
@media(max-width:420px){
  .hname span{display:none;}
  .nbtn{padding:11px 13px;}
}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="logo ar">ا</div>
    <div class="hname">
      <b>আলিফিয়া ইলম কায়দা</b>
      <span>আলিফিয়া ইলম একাডেমি</span>
    </div>
    <button class="tool" id="bTheme" title="আলো / অন্ধকার">🌙</button>
    <button class="tool" id="bFont" title="লেখার আকার">অ+</button>
    <button class="tool" id="bMode" title="মোড">মোড</button>
  </div>
  <div class="modebar">
    <span class="chip stu" id="chip"><span class="dot"></span><span id="chipTxt">ছাত্র মোড</span></span>
    <span style="font-size:.78em;color:var(--ink2);font-weight:600" id="hint">হরফে চাপ দিন — নাম ও মাখরাজ দেখুন</span>
  </div>
  <div class="prog">
    <div class="ptxt" id="ptxt">শেখা হয়েছে ০ / ২৯</div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
  </div>
</header>

<main id="main"></main>

<nav>
  <div class="nwrap">
    <button class="nbtn" id="bPrev">‹ আগের</button>
    <select id="jump"></select>
    <button class="nbtn main" id="bNext">পরের ›</button>
  </div>
  <footer>আলিফিয়া ইলম একাডেমি</footer>
</nav>

<div class="mask" id="mask">
  <div class="modal">
    <span class="big ar" id="mAr"></span>
    <h4 id="mName"></h4>
    <p class="mk" id="mMk"></p>
    <div class="un" id="mUn"></div>
    <button class="mclose" id="mClose">ঠিক আছে</button>
  </div>
</div>

<script>
/* ===== বাংলা সংখ্যা ===== */
const BN = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);

/* ===== ২৯ হরফ ===== */
const HORF = [
 ['ا','আলিফ','জাওফ — মুখের ভেতরের শূন্যস্থান থেকে','মাদ্দের হরফ; হরকত থাকলে হামযার মাখরাজ হয়'],
 ['ب','বা','দুই ঠোঁট মিলিয়ে','ঠোঁট ভালোভাবে মিলবে, কলকলার হরফ'],
 ['ت','তা','জিহ্বার ডগা ও সামনের দুই দাঁতের গোড়ায়','পাতলা হরফ, মোটা করা যাবে না'],
 ['ث','ছা','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','জিহ্বার ডগা অল্প বেরোবে'],
 ['ج','জীম','জিহ্বার মধ্যভাগ ও উপরের তালুতে','কলকলার হরফ'],
 ['ح','হা','কণ্ঠনালীর মধ্যভাগ থেকে','হালকা, শ্বাস ছেড়ে'],
 ['خ','খা','কণ্ঠনালীর উপরিভাগ থেকে','মোটা হরফ'],
 ['د','দাল','জিহ্বার ডগা ও সামনের দুই দাঁতের গোড়ায়','কলকলার হরফ'],
 ['ذ','যাল','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','ز ও ظ থেকে আলাদা রাখুন'],
 ['ر','রা','জিহ্বার ডগা সামান্য উঁচু করে','একবারই নড়বে, ঘুরাবেন না'],
 ['ز','যা','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','শিসের হরফ'],
 ['س','সীন','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','শিসের হরফ, পাতলা'],
 ['ش','শীন','জিহ্বার মধ্যভাগ ও উপরের তালুতে','বাতাস ছড়িয়ে পড়বে'],
 ['ص','সোয়াদ','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','মোটা, س-এর সঙ্গে মেশাবেন না'],
 ['ض','দোয়াদ','জিহ্বার এক পাশ ও মাড়ির দাঁতে','সবচেয়ে কঠিন হরফ, দীর্ঘ করে'],
 ['ط','তোয়া','জিহ্বার ডগা ও সামনের দাঁতের গোড়ায়','মোটা, কলকলার হরফ'],
 ['ظ','যোয়া','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','মোটা, ذ থেকে আলাদা'],
 ['ع','আইন','কণ্ঠনালীর মধ্যভাগ থেকে','গলা চেপে নয়, খোলা স্বরে'],
 ['غ','গাইন','কণ্ঠনালীর উপরিভাগ থেকে','মোটা হরফ'],
 ['ف','ফা','নিচের ঠোঁট ও উপরের দাঁতের ডগায়','দাঁত ঠোঁট স্পর্শ করবে'],
 ['ق','ক্বাফ','জিহ্বার শেষভাগ ও উপরের তালুতে','মোটা, কলকলার হরফ'],
 ['ك','কাফ','ق-এর সামান্য নিচে জিহ্বার শেষভাগে','পাতলা হরফ'],
 ['ل','লাম','জিহ্বার ডগা ও উপরের দাঁতের গোড়ার মাংসে','সাধারণত পাতলা'],
 ['م','মীম','দুই ঠোঁট মিলিয়ে','গুন্নাহর হরফ'],
 ['ن','নূন','জিহ্বার ডগা ল-এর কিছু পিছনে','গুন্নাহর হরফ'],
 ['و','ওয়াও','দুই ঠোঁট গোল করে','মাদ্দ ও লীন দুই কাজেই আসে'],
 ['ه','হা','কণ্ঠনালীর শেষ বা গভীর ভাগ থেকে','খুব হালকা, শ্বাসের সঙ্গে'],
 ['ء','হামযা','কণ্ঠনালীর গভীর ভাগ থেকে','ঝটকা দিয়ে থেমে'],
 ['ي','ইয়া','জিহ্বার মধ্যভাগ ও উপরের তালুতে','মাদ্দি ও গায়রে মাদ্দি — দুই রকম']
];
const g29 = HORF.map(h => ({a:h[0], n:h[1], m:h[2], u:h[3]}));
const mk = (L,s) => L.map(x => ({a:x, n:'', m:s}));

/* ===== পৃষ্ঠাগুলো ===== */
const PAGES = [
{t:'হরফ পরিচিতি', s:'আরবি ২৯টি হরফ', aim:'প্রতিটি হরফ চিনে নেওয়া এবং কোন জায়গা থেকে বের হয় তা জানা।', b:[
  {t:'grid', h:'২৯ হরফ — আলিফ থেকে ইয়া', items:g29},
  {t:'note', h:'মনে রাখুন', li:['প্রতিটি হরফের <b>নিজের একটি জায়গা</b> আছে, সেটিকে মাখরাজ বলে।','মাখরাজ ঠিক না হলে অর্থ বদলে যায়, তাই ধীরে ধীরে শিখুন।','প্রথমে হরফ চিনুন, তারপর উচ্চারণ ঠিক করুন।']},
  {t:'unote', li:['প্রথম দিনে ৫-৭টির বেশি হরফ দেবেন না।','ছাত্রকে আয়নার সামনে বসিয়ে ঠোঁট ও জিহ্বার নড়াচড়া দেখান।','প্রতিটি হরফ তিনবার শুনিয়ে তারপর ছাত্রকে বলতে দিন।']}
]},

{t:'হরফের আকৃতি', s:'শুরু, মধ্য ও শেষে লেখার রূপ', aim:'একই হরফ শব্দের ভিন্ন জায়গায় ভিন্ন দেখায় — এটি বোঝা।', b:[
  {t:'table', h:'রূপের পরিবর্তন', head:['হরফ','শুরুতে','মধ্যে','শেষে'], rows:[
    ['ب','بـ','ـبـ','ـب'],['ت','تـ','ـتـ','ـت'],['ج','جـ','ـجـ','ـج'],
    ['س','سـ','ـسـ','ـس'],['ع','عـ','ـعـ','ـع'],['ك','كـ','ـكـ','ـك'],
    ['م','مـ','ـمـ','ـم'],['ه','هـ','ـهـ','ـه'],['ي','يـ','ـيـ','ـي']

  {t:'note', h:'যা শিখলাম', li:['২৯ হরফ ও তাদের মাখরাজ।','হরকত, তানভীন, জযম, মাদ্দ ও তাশদীদ।','নূন সাকিন, মীম সাকিন ও গুন্নাহর নিয়ম।','মাদ্দের দশ প্রকার, লাম ও রার হুকুম, কলকলা ও ওয়াক্‌ফ।']},
  {t:'ex', h:'দোয়া', items:[['رَبِّ زِدْنِي عِلْمًا','হে আমার রব, আমার জ্ঞান বাড়িয়ে দিন']]},
  {t:'note', h:'পরামর্শ', li:['প্রতিদিন অল্প করে পড়ুন, তবে <b>নিয়ম করে</b> পড়ুন।','উস্তাদকে না শুনিয়ে নিজে নিজে উচ্চারণ ঠিক হয় না — মুখে মুখে শুনে নিন।']}
]}
];

/* ===== অবস্থা ===== */
const S = {
  page: +(localStorage.getItem('aiq_page') || 0),
  mode: localStorage.getItem('aiq_mode') || 'stu',
  learned: new Set(JSON.parse(localStorage.getItem('aiq_learned') || '[]'))
};
const save = () => {
  localStorage.setItem('aiq_page', S.page);
  localStorage.setItem('aiq_mode', S.mode);
  localStorage.setItem('aiq_learned', JSON.stringify([...S.learned]));
};

/* ===== থিম ও ফন্ট ===== */
const H = document.documentElement;
H.dataset.theme = localStorage.getItem('aiq_theme') || 'light';
H.dataset.fs = localStorage.getItem('aiq_fs') || 'm';
const bTheme = document.getElementById('bTheme');
const setThemeIcon = () => bTheme.textContent = H.dataset.theme === 'dark' ? '☀️' : '🌙';
setThemeIcon();
bTheme.onclick = () => {
  H.dataset.theme = H.dataset.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('aiq_theme', H.dataset.theme);
  setThemeIcon();
};
document.getElementById('bFont').onclick = () => {
  const o = ['s','m','l'];
  H.dataset.fs = o[(o.indexOf(H.dataset.fs) + 1) % 3];
  localStorage.setItem('aiq_fs', H.dataset.fs);
};

/* ===== মোড ===== */
const chip = document.getElementById('chip'), chipTxt = document.getElementById('chipTxt'), hint = document.getElementById('hint');
function applyMode(){
  const u = S.mode === 'ust';
  document.body.classList.toggle('ustad', u);
  chip.className = 'chip ' + (u ? 'ust' : 'stu');
  chipTxt.textContent = u ? 'উস্তাদ মোড' : 'ছাত্র মোড';
  hint.textContent = u ? 'ঘরের কোণে ✓ চেপে শেখা হয়েছে চিহ্ন দিন' : 'হরফে চাপ দিন — নাম ও মাখরাজ দেখুন';
}
document.getElementById('bMode').onclick = () => {
  if (S.mode === 'ust') { S.mode = 'stu'; }
  else {
    const c = prompt('উস্তাদ মোডের কোড লিখুন');
    if (c === null) return;
    if (c.trim().toUpperCase() !== 'ALIF-USTAD') { alert('কোড মেলেনি।'); return; }
    S.mode = 'ust';
  }
  applyMode(); save(); render();
};

/* ===== অগ্রগতি ===== */
function progress(){
  const n = [...S.learned].length;
  document.getElementById('ptxt').textContent = 'শেখা হয়েছে ' + BN(n) + ' / ' + BN(29);
  document.getElementById('pfill').style.width = (n / 29 * 100) + '%';
}

/* ===== তৈরি করার সহায়ক ===== */
function E(tag, cls, html){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

/* ===== ব্লক আঁকা ===== */
function drawBlock(b){
  const w = E('div','blk');
  if (b.h) w.appendChild(E('h3', null, b.h));

  if (b.t === 'grid'){
    const g = E('div','grid');
    b.items.forEach(it => {
      const d = E('div','tile');
      if (S.learned.has(it.a)) d.classList.add('done');
      d.appendChild(E('span','ar', it.a));
      d.appendChild(E('span','tick','✓'));
      const tm = E('span','tmark','✓');
      tm.onclick = ev => {
        ev.stopPropagation();
        S.learned.has(it.a) ? S.learned.delete(it.a) : S.learned.add(it.a);
        d.classList.toggle('done');
        save(); progress();
      };
      d.appendChild(tm);
      d.onclick = () => openModal(it);
      g.appendChild(d);
    });
    w.appendChild(g);
  }

  else if (b.t === 'row'){
    const r = E('div','row');
    b.items.forEach(x => { const p = E('div','pill'); p.appendChild(E('span','ar', x)); r.appendChild(p); });
    w.appendChild(r);
  }

  else if (b.t === 'ex'){
    const g = E('div','ex');
    b.items.forEach(([a, s]) => {
      const d = E('div','exi');
      d.appendChild(E('span','ar', a));
      d.appendChild(E('small', null, s));
      g.appendChild(d);
    });
    w.appendChild(g);
  }

  else if (b.t === 'table'){
    const tw = E('div','tw');
    let html = '<table><thead><tr>' + b.head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>';
    b.rows.forEach(r => {
      html += '<tr>' + r.map(c => '<td>' + (/[\u0600-\u06FF]/.test(c) ? '<span class="ar">' + c + '</span>' : c) + '</td>').join('') + '</tr>';
    });
    tw.innerHTML = html + '</tbody></table>';
    w.appendChild(tw);
  }

  else if (b.t === 'note'){
    const u = E('ul','pt');
    b.li.forEach(x => u.appendChild(E('li', null, x)));
    w.appendChild(u);
  }

  else if (b.t === 'unote'){
    const n = E('div','unote','<b>উস্তাদের নোট</b>');
    const u = E('ul','pt');
    b.li.forEach(x => u.appendChild(E('li', null, x)));
    n.appendChild(u);
    w.appendChild(n);
  }

  return w;
}

/* ===== পপ-আপ ===== */
const mask = document.getElementById('mask');
function openModal(it){
  document.getElementById('mAr').textContent = it.a;
  document.getElementById('mName').textContent = it.n || '';
  document.getElementById('mMk').textContent = it.m || '';
  const un = document.getElementById('mUn');
  un.innerHTML = it.u ? '<b>উস্তাদের নোট:</b> ' + it.u : '';
  un.style.display = (it.u && S.mode === 'ust') ? 'block' : 'none';
  mask.classList.add('on');
}
document.getElementById('mClose').onclick = () => mask.classList.remove('on');
mask.onclick = e => { if (e.target === mask) mask.classList.remove('on'); };

/* ===== পৃষ্ঠা আঁকা ===== */
const main = document.getElementById('main');
function render(){
  const p = PAGES[S.page];
  main.innerHTML = '';
  const box = E('div','page');
  box.appendChild(E('div','pno','পৃষ্ঠা ' + BN(S.page + 1) + ' / ' + BN(PAGES.length)));
  box.appendChild(E('h1', null, p.t));
  box.appendChild(E('p','sub', p.s));
  if (p.aim) box.appendChild(E('div','aim','<b>উদ্দেশ্য:</b> ' + p.aim));
  p.b.forEach(b => box.appendChild(drawBlock(b)));
  main.appendChild(box);
  document.getElementById('bPrev').disabled = S.page === 0;
  document.getElementById('bNext').disabled = S.page === PAGES.length - 1;
  document.getElementById('jump').value = S.page;
  window.scrollTo({top:0, behavior:'smooth'});
  save();
}

/* ===== নেভিগেশন ===== */
const jump = document.getElementById('jump');
PAGES.forEach((p, i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = 'পৃষ্ঠা ' + BN(i + 1) + ' — ' + p.t;
  jump.appendChild(o);
});
jump.onchange = () => { S.page = +jump.value; render(); };
document.getElementById('bPrev').onclick = () => { if (S.page > 0) { S.page--; render(); } };
document.getElementById('bNext').onclick = () => { if (S.page < PAGES.length - 1) { S.page++; render(); } };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') document.getElementById('bNext').click();
  if (e.key === 'ArrowLeft') document.getElementById('bPrev').click();
  if (e.key === 'Escape') mask.classList.remove('on');
});

/* ===== শুরু ===== */
if (S.page >= PAGES.length) S.page = 0;
applyMode(); progress(); render();
</script>
</body>
</html>
