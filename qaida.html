<!DOCTYPE html>
<html lang="bn" data-theme="light" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আলিফিয়া ইলম একাডেমি</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6fa; --card:#fff; --soft:#f8fafc; --line:#d5dde8;
  --ink:#0a111d; --ink2:#48566d;
  --ar:#0a111d;
  --gr:#0d7a52; --grbg:#e2f5ec;
  --rd:#b52a31; --rdbg:#fdeaea;
  --btn:#fff; --btnk:#0a111d;
  --sh:0 2px 10px rgba(16,24,40,.07);
}
html[data-theme="dark"]{
  --bg:#0c131e; --card:#151e2c; --soft:#1b2634; --line:#2e3d53;
  --ink:#f3f7fc; --ink2:#c6d2e2;
  --ar:#fff;
  --gr:#4fe0a0; --grbg:#102e23;
  --rd:#ff9090; --rdbg:#341a1c;
  --btn:#1d2836; --btnk:#f3f7fc;
  --sh:0 2px 10px rgba(0,0,0,.4);
}
html[data-fs="s"]{--bs:16px;--az:38px;--tz:56px}
html[data-fs="m"]{--bs:18px;--az:48px;--tz:68px}
html[data-fs="l"]{--bs:21px;--az:60px;--tz:82px}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-size:var(--bs);line-height:1.75;font-weight:500;
 font-family:'Hind Siliguri',system-ui,'Noto Sans Bengali',sans-serif}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;color:var(--ar);font-weight:600}
.wrap{max-width:900px;margin:auto}

/* হেডার */
header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:2px solid var(--line);box-shadow:var(--sh)}
.hb{display:flex;align-items:center;gap:9px;padding:9px 14px}
.logo{width:42px;height:42px;flex:0 0 auto;border-radius:12px;background:var(--grbg);color:var(--gr);
 display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-size:23px;font-weight:700;cursor:pointer}
.hn{flex:1;min-width:0}
.hn b{display:block;font-size:1.02em;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hn span{display:block;font-size:.76em;color:var(--ink2)}
.tl{border:2px solid var(--line);background:var(--btn);color:var(--btnk);border-radius:11px;
 padding:7px 10px;font-size:.84em;font-weight:700;cursor:pointer;font-family:inherit}
.tl:active{transform:scale(.95)}

.bar{display:flex;align-items:center;gap:8px;padding:0 14px 9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:.8em;font-weight:700;border:2px solid}
.chip.s{background:var(--rdbg);color:var(--rd);border-color:var(--rd)}
.chip.u{background:var(--grbg);color:var(--gr);border-color:var(--gr)}
.dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.hint{font-size:.77em;color:var(--ink2);font-weight:600}

.pw{padding:0 14px 10px}
.pt{font-size:.78em;color:var(--ink2);font-weight:600;margin-bottom:5px}
.pb{position:relative;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
.pf{position:absolute;top:0;left:0;height:100%;border-radius:99px;transition:width .3s}
.pf.r{background:var(--rd)} .pf.g{background:var(--gr)}

/* হোম */
.home{padding:20px 14px 40px}
.hero{text-align:center;padding:14px 0 24px}
.hero .bism{font-size:calc(var(--az)*.75);line-height:1.6;display:block;margin-bottom:8px}
.hero h1{margin:0;font-size:1.5em;font-weight:700}
.hero p{margin:4px 0 0;color:var(--ink2);font-size:.92em}
.cards{display:grid;gap:14px}
.bcard{display:block;width:100%;text-align:right;border:2px solid var(--line);background:var(--card);
 border-radius:18px;padding:18px;box-shadow:var(--sh);cursor:pointer;font-family:inherit;color:var(--ink)}
.bcard:active{transform:scale(.99)}
.bcard .top{display:flex;align-items:center;gap:13px;text-align:left}
.bicon{width:58px;height:58px;flex:0 0 auto;border-radius:16px;background:var(--grbg);color:var(--gr);
 display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-size:32px;font-weight:700}
.bcard.t2 .bicon{background:var(--rdbg);color:var(--rd)}
.bcard h2{margin:0;font-size:1.25em;font-weight:700}
.bcard small{display:block;color:var(--ink2);font-size:.85em;font-weight:500;line-height:1.5}
.bmeta{margin-top:12px;display:flex;justify-content:space-between;align-items:center;
 font-size:.8em;color:var(--ink2);font-weight:600;text-align:left}
.go{background:var(--gr);color:#fff;border-radius:10px;padding:5px 14px;font-weight:700}
.bcard.t2 .go{background:var(--rd)}

/* পৃষ্ঠা */
main{padding:6px 14px 118px}
.page{background:var(--card);border:2px solid var(--line);border-radius:16px;box-shadow:var(--sh);padding:18px 15px;margin-bottom:14px}
.pno{display:inline-block;background:var(--grbg);color:var(--gr);font-size:.76em;font-weight:700;padding:3px 12px;border-radius:99px;margin-bottom:9px}
h1.pgt{font-size:1.3em;margin:0 0 3px;font-weight:700;line-height:1.4}
.sub{color:var(--ink2);font-size:.9em;margin:0 0 12px}
.aim{background:var(--grbg);border-left:5px solid var(--gr);border-radius:10px;padding:10px 13px;
 font-size:.9em;font-weight:600;margin-bottom:16px;color:var(--ink)}

.blk{margin-bottom:20px}
.blk:last-child{margin-bottom:0}
.blk h3{font-size:1em;font-weight:700;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line)}

/* টাইল */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tz),1fr));gap:9px}
.tile{position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-radius:13px;background:var(--card);
 display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.tile .ar{font-size:var(--az);line-height:1}
.tile:active{transform:scale(.94)}
.tile.s{border-color:var(--rd);background:var(--rdbg)}
.tile.u{border-color:var(--gr);background:var(--grbg)}
.mk{position:absolute;bottom:-8px;right:-8px;width:28px;height:28px;border-radius:50%;
 border:2px solid var(--line);background:var(--btn);color:var(--ink2);
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer}
.tile.s .mk{background:var(--rd);color:#fff;border-color:var(--rd)}
.tile.u .mk{background:var(--gr);color:#fff;border-color:var(--gr)}

/* সারি */
.row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:7px 14px;min-width:54px;text-align:center}
.pill .ar{font-size:calc(var(--az)*.66);line-height:1.4}

/* জোড়া */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px}
.pr{border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:9px 10px;
 display:flex;align-items:center;justify-content:center;gap:9px}
.pr .ar{font-size:calc(var(--az)*.6);line-height:1.4}
.pr .eq{color:var(--gr);font-weight:700;font-size:1.05em}
.pr .rt .ar{color:var(--gr)}

/* উদাহরণ */
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.exi{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:9px 11px;text-align:center}
.exi .ar{display:block;font-size:calc(var(--az)*.6);line-height:1.7}
.exi small{display:block;color:var(--ink2);font-size:.79em;font-weight:600}

/* বাক্য */
.sent{display:grid;gap:9px}
.si{border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:11px 14px}
.si .ar{display:block;font-size:calc(var(--az)*.6);line-height:2;text-align:right}
.si small{display:block;color:var(--ink2);font-size:.8em;font-weight:600;margin-top:3px}

/* সূরা */
.shead{text-align:center;border:2px solid var(--gr);background:var(--grbg);border-radius:13px;padding:11px;margin-bottom:12px}
.shead .ar{font-size:calc(var(--az)*.72);display:block;line-height:1.7}
.shead small{color:var(--ink2);font-size:.82em;font-weight:600}
.ayat{display:grid;gap:9px}
.ay{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:11px 13px;position:relative}
.ay .no{position:absolute;top:9px;left:11px;background:var(--grbg);color:var(--gr);
 font-size:.7em;font-weight:700;border-radius:99px;padding:1px 9px}
.ay .ar{display:block;font-size:calc(var(--az)*.62);line-height:2.1;text-align:right;padding-top:2px}
.ay small{display:block;color:var(--ink2);font-size:.8em;font-weight:600;margin-top:4px}

/* মাখরাজ কার্ড */
.mx{display:grid;gap:10px}
.mi{border:2px solid var(--line);border-radius:13px;background:var(--card);padding:12px 13px;display:flex;gap:12px;align-items:flex-start}
.mnum{width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--grbg);color:var(--gr);
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.86em}
.mbd{flex:1;min-width:0}
.mbd .ar{font-size:calc(var(--az)*.72);line-height:1.5;display:block;margin-bottom:2px}
.mbd b{display:block;font-size:.93em}
.mbd small{display:block;color:var(--ink2);font-size:.83em;font-weight:500;line-height:1.55}

/* টেবিল */
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92em}
th{background:var(--grbg);color:var(--gr);font-weight:700;text-align:left;padding:9px 11px;white-space:nowrap}
td{padding:9px 11px;border-top:1px solid var(--line)}
td .ar{font-size:calc(var(--az)*.54)}

ul.li{margin:0;padding-left:20px}
ul.li li{margin-bottom:7px}
ul.li li b{color:var(--gr)}

.unote{display:none;border:2px dashed var(--gr);background:var(--grbg);border-radius:12px;padding:11px 13px}
body.ustad .unote{display:block}
.unote>b{color:var(--gr);display:block;margin-bottom:4px}

/* নিচের নেভিগেশন */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2px solid var(--line);box-shadow:0 -2px 12px rgba(16,24,40,.1)}
.nb{display:flex;gap:8px;align-items:center;padding:10px 14px}
.nbtn{flex:0 0 auto;border:2px solid var(--line);background:var(--btn);color:var(--btnk);border-radius:12px;
 padding:11px 14px;font-size:.93em;font-weight:700;cursor:pointer;font-family:inherit}
.nbtn.main{background:var(--gr);color:#fff;border-color:var(--gr)}
.nbtn:disabled{opacity:.38}
select{flex:1;min-width:0;border:2px solid var(--line);background:var(--btn);color:var(--btnk);
 border-radius:12px;padding:11px 8px;font-size:.86em;font-weight:600;font-family:inherit}
footer{text-align:center;color:var(--ink2);font-size:.78em;padding:2px 0 9px}

/* পপ-আপ */
.mask{position:fixed;inset:0;z-index:50;background:rgba(6,12,20,.65);display:none;align-items:center;justify-content:center;padding:20px}
.mask.on{display:flex}
.modal{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px 18px;max-width:380px;width:100%;text-align:center}
.modal .big{display:block;font-size:calc(var(--az)*1.5);line-height:1.2;margin-bottom:10px}
.modal h4{margin:0;font-size:1.22em;font-weight:700}
.modal .mkt{color:var(--ink2);font-size:.92em;margin:7px 0 0}
.modal .un{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--grbg);
 border-left:5px solid var(--gr);font-size:.88em;text-align:left;color:var(--ink)}
body.ustad .modal .un.has{display:block}
.mc{margin-top:15px;width:100%;border:none;background:var(--gr);color:#fff;padding:12px;border-radius:12px;font-size:1em;font-weight:700;cursor:pointer;font-family:inherit}
@media(max-width:420px){.hn span{display:none}.nbtn{padding:11px 12px}}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="hb">
   <div class="logo ar" id="home">ا</div>
   <div class="hn"><b id="htitle">আলিফিয়া ইলম একাডেমি</b><span id="hsub">কুরআন শিক্ষার প্রথম ধাপ</span></div>
   <button class="tl" id="bT">🌙</button>
   <button class="tl" id="bF">অ+</button>
   <button class="tl" id="bM">মোড</button>
  </div>
  <div class="bar">
   <span class="chip s" id="chip"><span class="dot"></span><span id="chipT">ছাত্র মোড</span></span>
   <span class="hint" id="hint">হরফে চাপ দিন — নাম ও মাখরাজ দেখুন</span>
  </div>
  <div class="pw" id="pw" style="display:none">
   <div class="pt" id="ptxt"></div>
   <div class="pb"><div class="pf r" id="pfr"></div><div class="pf g" id="pfg"></div></div>
  </div>
 </div>
</header>

<div id="app"></div>

<nav id="nav" style="display:none">
 <div class="wrap">
  <div class="nb">
   <button class="nbtn" id="bH">হোম</button>
   <button class="nbtn" id="bP">‹</button>
   <select id="jp"></select>
   <button class="nbtn main" id="bN">পরের ›</button>
  </div>
  <footer>আলিফিয়া ইলম একাডেমি</footer>
 </div>
</nav>

<div class="mask" id="mask">
 <div class="modal">
  <span class="big ar" id="mA"></span>
  <h4 id="mN"></h4>
  <p class="mkt" id="mK"></p>
  <div class="un" id="mU"></div>
  <button class="mc" id="mC">ঠিক আছে</button>
 </div>
</div>

<script>
/* ============ সহায়ক ============ */
const BN = n => String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const R  = s => s.split('|').map(x=>x.trim());
const grid=(h,items)=>({t:'grid',h,items});
const row =(h,s)=>({t:'row',h,items:R(s)});
const ex  =(h,items)=>({t:'ex',h,items});
const pair=(h,items)=>({t:'pair',h,items});
const sent=(h,items)=>({t:'sent',h,items});
const tbl =(h,head,rows)=>({t:'table',h,head,rows});
const note=(h,li)=>({t:'note',h,li});
const un  =li=>({t:'unote',li});
const mx  =(h,items)=>({t:'mx',h,items});
const sura=(ar,bn,ayat)=>({t:'surah',ar,bn,ayat});
const L   = (s,m)=>R(s).map(a=>({a,m}));

/* ============ ২৯ হরফ ============ */
const HORF=[
['ا','আলিফ','জাওফ — মুখের ভেতরের ফাঁকা জায়গা','হরকত থাকলে হামযার মাখরাজ ধরা হয়'],
['ب','বা','দুই ঠোঁট মিলিয়ে','কলকলার হরফ, ঠোঁট ভালোভাবে মিলবে'],
['ت','তা','জিহ্বার ডগা ও সামনের দুই দাঁতের গোড়ায়','পাতলা হরফ, ط-এর মতো মোটা নয়'],
['ث','ছা','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','জিহ্বার ডগা সামান্য বেরোবে'],
['ج','জীম','জিহ্বার মধ্যভাগ ও উপরের তালুতে','কলকলার হরফ'],
['ح','হা','কণ্ঠনালীর মধ্যভাগ','খোলা গলায়, শ্বাস ছেড়ে'],
['خ','খা','কণ্ঠনালীর উপরিভাগ','মোটা হরফ'],
['د','দাল','জিহ্বার ডগা ও সামনের দুই দাঁতের গোড়ায়','কলকলার হরফ'],
['ذ','যাল','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','ز ও ظ থেকে আলাদা রাখুন'],
['ر','রা','জিহ্বার ডগা সামান্য উঁচু করে','জিহ্বা একবারই নড়বে'],
['ز','যা','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','শিসের হরফ'],
['س','সীন','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','শিসের হরফ, পাতলা'],
['ش','শীন','জিহ্বার মধ্যভাগ ও উপরের তালুতে','বাতাস মুখে ছড়িয়ে পড়ে'],
['ص','সোয়াদ','জিহ্বার ডগা ও সামনের দাঁতের ডগার কাছে','মোটা, س-এর সঙ্গে মেলাবেন না'],
['ض','দোয়াদ','জিহ্বার এক পাশ ও উপরের মাড়ির দাঁত','সবচেয়ে কঠিন হরফ, আওয়াজ লম্বা হয়'],
['ط','তোয়া','জিহ্বার ডগা ও সামনের দাঁতের গোড়ায়','মোটা ও কলকলার হরফ'],
['ظ','যোয়া','জিহ্বার ডগা ও উপরের দুই দাঁতের কিনারায়','মোটা, ذ থেকে আলাদা'],
['ع','আইন','কণ্ঠনালীর মধ্যভাগ','গলা চেপে নয়, খোলা স্বরে'],
['غ','গাইন','কণ্ঠনালীর উপরিভাগ','মোটা হরফ'],
['ف','ফা','নিচের ঠোঁট ও উপরের দাঁতের ডগায়','দাঁত ঠোঁট ছোঁবে'],
['ق','ক্বাফ','জিহ্বার শেষভাগ ও উপরের তালুতে','মোটা ও কলকলার হরফ'],
['ك','কাফ','ক্বাফের সামান্য নিচে','পাতলা হরফ'],
['ل','লাম','জিহ্বার ডগা ও উপরের দাঁতের গোড়ার মাংসে','সাধারণত পাতলা'],
['م','মীম','দুই ঠোঁট মিলিয়ে','গুন্নাহর হরফ'],
['ن','নূন','জিহ্বার ডগা, লামের কিছু পিছনে','গুন্নাহর হরফ'],

 note('নিয়ম',['রায় <b>যবর বা পেশ</b> থাকলে মোটা।','রায় <b>যের</b> থাকলে পাতলা।','রা সাকিন হলে <b>আগের হরকত</b> দেখতে হবে — আগে যের হলে পাতলা, নইলে মোটা।']),
 ex('মোটা রা',[['رَبِّ','রাব্বি'],['رُزِقَ','রুযিক্বা'],['الْقُرْآن','আল-কুরআন'],['مَرْيَم','মারইয়াম']]),
 ex('পাতলা রা',[['رِزْق','রিযক্ব'],['فِرْعَوْن','ফির‘আউন'],['الذِّكْرِ','আয-যিকরি'],['مِرْيَة','মিরইয়াতুন']]),
 un(['রা-তে জিহ্বা বারবার কাঁপলে সঙ্গে সঙ্গে শুধরে দিন।'])
]},
{t:'কলকলা',s:'পাঁচ হরফের ঝাঁকি',aim:'কলকলার হরফে ঝাঁকি দিয়ে পড়তে শেখা।',b:[
 grid('কলকলার হরফ',L('ق|ط|ب|ج|د','সাকিন হলে ঝাঁকি দিয়ে পড়তে হবে')),
 note('দুই প্রকার',['<b>কলকলায়ে সুগরা</b> — শব্দের মাঝে সাকিন হলে, ঝাঁকি হালকা।','<b>কলকলায়ে কুবরা</b> — শব্দের শেষে থামলে, ঝাঁকি স্পষ্ট।','মনে রাখার শব্দ — <b>কুতুবে জাদ</b> (قطب جد)।']),
 ex('উদাহরণ',[['يَقْطَعُ','সুগরা'],['أَبْصَارِهِمْ','সুগরা'],['يَجْعَلُ','সুগরা'],['أَحَدْ','কুবরা'],['الْفَلَقْ','কুবরা'],['مُحِيطْ','কুবরা']])
]},
{t:'তাফখীম ও তারকীক',s:'মোটা ও পাতলা',aim:'শেষ পর্যায়ের মোটা-পাতলা অনুশীলন।',b:[
 grid('সবসময় মোটা — সাতটি',L('خ|ص|ض|غ|ط|ق|ظ','মোটা করে পড়তে হবে')),
 note('অবস্থা অনুযায়ী',['<b>ل</b> — কেবল আল্লাহর নামে যবর বা পেশের পরে মোটা।','<b>ر</b> — যবর বা পেশে মোটা, যেরে পাতলা।','<b>ا</b> — আগের হরফ মোটা হলে মোটা, পাতলা হলে পাতলা।']),
 pair('পাশাপাশি মিলিয়ে দেখুন',[['سَ','صَ'],['تَ','طَ'],['ذَ','ظَ'],['كَ','قَ'],['دَ','ضَ'],['هَ','حَ'],['أَ','عَ'],['غَ','خَ']])
]},
{t:'ওয়াক্‌ফ',s:'থামার নিয়ম',aim:'কোথায় থামা যাবে আর কোথায় যাবে না তা জানা।',b:[
 tbl('ওয়াক্‌ফের চিহ্ন',['চিহ্ন','নাম','অর্থ'],[
 ['م','লাযিম','থামা জরুরি'],
 ['لا','মামনু','থামা যাবে না'],
 ['ج','জায়েয','থামা যায়, না থামলেও চলে'],
 ['قلى','আওলা ওয়াক্‌ফ','থামা উত্তম'],
 ['صلى','আওলা ওসল','না থেমে পড়া উত্তম'],
 ['س','সাকতা','নিঃশ্বাস না ছেড়ে অল্প থামা'],
 ['∴ ∴','মু‘আনাক্বা','দুটির যেকোনো একটিতে থামতে হবে']]),
 note('মনে রাখুন',['থামার সময় শেষ হরফ <b>সাকিন</b> করে পড়তে হয়।','অর্থ নষ্ট হয় এমন জায়গায় থামা যাবে না।','শ্বাস ফুরিয়ে গেলে সুবিধামতো জায়গায় থেমে আগের শব্দ থেকে আবার শুরু করবেন।']),
 un(['আয়াত ছোট ছোট ভাগে ভাগ করে শ্বাসের হিসাব শেখান।'])
]},
{t:'শেষ পাতা',s:'তাজবীদ সমাপ্ত',aim:'সব নিয়ম একবার ঝালিয়ে নেওয়া।',b:[
 note('যা শিখলাম',['১৭ মাখরাজ ও হরফের সিফাত।','নূন সাকিন, মীম সাকিন ও গুন্নাহ।','মাদ্দের দশ প্রকার।','লাম, রা, কলকলা, তাফখীম-তারকীক ও ওয়াক্‌ফ।']),
 note('শেষ কথা',['নিয়ম মুখস্থ করলেই তাজবীদ হয় না — <b>উস্তাদকে শুনিয়ে</b> পড়তে হয়।','প্রতিদিন অল্প করে, তবে নিয়ম করে পড়ুন।'])
]}
];

const BOOKS={
 qaida :{id:'qaida', ico:'ا', name:'কায়দা', sub:'হরফ থেকে সূরা পর্যন্ত',
   desc:'২৯ হরফ, হরকত, তানভীন, জযম, মাদ্দ ও তাশদীদ — তারপর শব্দ, বাক্য এবং নামাযের ১০টি সূরা।', pages:QAIDA},
 tajwid:{id:'tajwid',ico:'✦', name:'তাজবীদ', sub:'পড়ার নিয়ম',
   desc:'১৭ মাখরাজ, হরফের গুণ, নূন ও মীম সাকিন, গুন্নাহ, মাদ্দের প্রকার, লাম-রা, কলকলা ও ওয়াক্‌ফ।', pages:TAJWID}
};

/* ============ অবস্থা ============ */
const ST={
 view:'home', book:'qaida',
 page:JSON.parse(localStorage.getItem('aq_page')||'{"qaida":0,"tajwid":0}'),
 mode:localStorage.getItem('aq_mode')||'stu',
 s:new Set(JSON.parse(localStorage.getItem('aq_s')||'[]')),
 u:new Set(JSON.parse(localStorage.getItem('aq_u')||'[]'))
};
const save=()=>{
 localStorage.setItem('aq_page',JSON.stringify(ST.page));
 localStorage.setItem('aq_mode',ST.mode);
 localStorage.setItem('aq_s',JSON.stringify([...ST.s]));
 localStorage.setItem('aq_u',JSON.stringify([...ST.u]));
};

/* ============ থিম ও ফন্ট ============ */
const H=document.documentElement;
H.dataset.theme=localStorage.getItem('aq_th')||'light';
H.dataset.fs=localStorage.getItem('aq_fs')||'m';
const bT=document.getElementById('bT');
const icon=()=>bT.textContent=H.dataset.theme==='dark'?'☀️':'🌙'; icon();
bT.onclick=()=>{H.dataset.theme=H.dataset.theme==='dark'?'light':'dark';localStorage.setItem('aq_th',H.dataset.theme);icon();};
document.getElementById('bF').onclick=()=>{const o=['s','m','l'];H.dataset.fs=o[(o.indexOf(H.dataset.fs)+1)%3];localStorage.setItem('aq_fs',H.dataset.fs);};

/* ============ মোড ============ */
const chip=document.getElementById('chip'),chipT=document.getElementById('chipT'),hint=document.getElementById('hint');
function applyMode(){
 const u=ST.mode==='ust';
 document.body.classList.toggle('ustad',u);
 chip.className='chip '+(u?'u':'s');
 chipT.textContent=u?'উস্তাদ মোড':'ছাত্র মোড';
 hint.textContent=u?'কোণার বোতামে চাপ দিলে সবুজ চিহ্ন বসবে':'কোণার বোতামে চাপ দিলে লাল চিহ্ন বসবে';
}
document.getElementById('bM').onclick=()=>{
 if(ST.mode==='ust'){ST.mode='stu';}
 else{
  const c=prompt('উস্তাদ মোডের কোড লিখুন');
  if(c===null)return;
  if(c.trim().toUpperCase()!=='ALIF-USTAD'){alert('কোড মেলেনি।');return;}
  ST.mode='ust';
 }
 applyMode();save();draw();
};

/* ============ অগ্রগতি ============ */
function keysOf(bid){
 const k=[];
 BOOKS[bid].pages.forEach((p,i)=>p.b.forEach(b=>{if(b.t==='grid')b.items.forEach(it=>k.push(bid+':'+it.a));}));
 return [...new Set(k)];
}
const KEYS={qaida:keysOf('qaida'),tajwid:keysOf('tajwid')};
function count(bid){
 const k=KEYS[bid];
 return {tot:k.length, s:k.filter(x=>ST.s.has(x)).length, u:k.filter(x=>ST.u.has(x)).length};
}
function progress(){
 const pw=document.getElementById('pw');
 if(ST.view!=='book'){pw.style.display='none';return;}
 pw.style.display='block';
 const c=count(ST.book);
 document.getElementById('ptxt').textContent=
  'ছাত্রের চিহ্ন '+BN(c.s)+' · উস্তাদের চিহ্ন '+BN(c.u)+' / মোট '+BN(c.tot);
 document.getElementById('pfr').style.width=(c.tot?c.s/c.tot*100:0)+'%';
 document.getElementById('pfg').style.width=(c.tot?c.u/c.tot*100:0)+'%';
}

/* ============ DOM সহায়ক ============ */
const E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const isAr=s=>/[\u0600-\u06FF]/.test(s);

/* ============ ব্লক আঁকা ============ */
function block(b){
 const w=E('div','blk');
 if(b.h)w.appendChild(E('h3',null,b.h));

 if(b.t==='grid'){
  const g=E('div','grid');
  b.items.forEach(it=>{
   const key=ST.book+':'+it.a;
   const d=E('div','tile');
   if(ST.s.has(key))d.classList.add('s');
   if(ST.u.has(key))d.classList.add('u');
   d.appendChild(E('span','ar',it.a));
   const m=E('span','mk','✓');
   m.onclick=ev=>{
    ev.stopPropagation();
    const set=ST.mode==='ust'?ST.u:ST.s;
    set.has(key)?set.delete(key):set.add(key);
    d.classList.toggle('s',ST.s.has(key));
    d.classList.toggle('u',ST.u.has(key));
    save();progress();
   };
   d.appendChild(m);
   d.onclick=()=>modal(it);
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='row'){
  const r=E('div','row');
  b.items.forEach(x=>{const p=E('div','pill');p.appendChild(E('span','ar',x));r.appendChild(p);});
  w.appendChild(r);
 }

 else if(b.t==='pair'){
  const g=E('div','pairs');
  b.items.forEach(([a,c])=>{
   const d=E('div','pr');
   const l=E('span','lt');l.appendChild(E('span','ar',a));
   const rt=E('span','rt');rt.appendChild(E('span','ar',c));
   d.appendChild(l);d.appendChild(E('span','eq','='));d.appendChild(rt);
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='ex'){
  const g=E('div','ex');
  b.items.forEach(([a,s])=>{
   const d=E('div','exi');
   d.appendChild(E('span','ar',a));
   d.appendChild(E('small',null,s));
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='sent'){
  const g=E('div','sent');
  b.items.forEach(([a,s])=>{
   const d=E('div','si');
   d.appendChild(E('span','ar',a));
   d.appendChild(E('small',null,s));
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='mx'){
  const g=E('div','mx');
  b.items.forEach(([n,ar,place,tip])=>{
   const d=E('div','mi');
   d.appendChild(E('div','mnum',BN(n)));
   const bd=E('div','mbd');
   bd.appendChild(E('span','ar',ar));
   bd.appendChild(E('b',null,place));
   bd.appendChild(E('small',null,tip));
   d.appendChild(bd);
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='surah'){
  const hd=E('div','shead');
  hd.appendChild(E('span','ar',b.ar));
  hd.appendChild(E('small',null,b.bn));
  w.appendChild(hd);
  const g=E('div','ayat');
  b.ayat.forEach(([a,m],i)=>{
   const d=E('div','ay');
   d.appendChild(E('span','no',BN(i+1)));
   d.appendChild(E('span','ar',a));
   d.appendChild(E('small',null,m));
   g.appendChild(d);
  });
  w.appendChild(g);
 }

 else if(b.t==='table'){
  const tw=E('div','tw');
  let h='<table><thead><tr>'+b.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>';
  b.rows.forEach(r=>{h+='<tr>'+r.map(c=>'<td>'+(isAr(c)?'<span class="ar">'+c+'</span>':c)+'</td>').join('')+'</tr>';});
  tw.innerHTML=h+'</tbody></table>';
  w.appendChild(tw);
 }

 else if(b.t==='note'){
  const u=E('ul','li'); b.li.forEach(x=>u.appendChild(E('li',null,x))); w.appendChild(u);
 }

 else if(b.t==='unote'){
  const n=E('div','unote','<b>উস্তাদের নোট</b>');
  const u=E('ul','li'); b.li.forEach(x=>u.appendChild(E('li',null,x)));
  n.appendChild(u); w.appendChild(n);
 }
 return w;
}

/* ============ পপ-আপ ============ */
const mask=document.getElementById('mask');
function modal(it){
 document.getElementById('mA').textContent=it.a;
 document.getElementById('mN').textContent=it.n||'';
 document.getElementById('mK').textContent=it.m||'';
 const u=document.getElementById('mU');
 u.innerHTML=it.u?'<b>উস্তাদের নোট:</b> '+it.u:'';
 u.className='un'+(it.u?' has':'');
 mask.classList.add('on');
}
document.getElementById('mC').onclick=()=>mask.classList.remove('on');
mask.onclick=e=>{if(e.target===mask)mask.classList.remove('on');};

/* ============ আঁকা ============ */
const app=document.getElementById('app'),nav=document.getElementById('nav'),jp=document.getElementById('jp');

function drawHome(){
 nav.style.display='none';
 document.getElementById('htitle').textContent='আলিফিয়া ইলম একাডেমি';
 document.getElementById('hsub').textContent='কুরআন শিক্ষার প্রথম ধাপ';
 app.innerHTML='';
 const w=E('div','wrap'); const h=E('div','home');
 const hero=E('div','hero');
 hero.appendChild(E('span','bism ar','بِسْمِ اللهِ الرَّحْمَٰنِ الرَّحِيمِ'));
 hero.appendChild(E('h1',null,'আলিফিয়া ইলম একাডেমি'));
 hero.appendChild(E('p',null,'নিচ থেকে বেছে নিন — কায়দা অথবা তাজবীদ'));
 h.appendChild(hero);
 const cs=E('div','cards');
 ['qaida','tajwid'].forEach((id,i)=>{
  const bk=BOOKS[id],c=count(id);
  const b=E('button','bcard'+(i?' t2':''));
  const top=E('div','top');
  top.appendChild(E('div','bicon'+(i?'':' ar'),bk.ico));
  const tx=E('div');
  tx.appendChild(E('h2',null,bk.name));
  tx.appendChild(E('small',null,bk.desc));
  top.appendChild(tx);
  b.appendChild(top);
  const mt=E('div','bmeta');
  mt.appendChild(E('span',null,'মোট '+BN(bk.pages.length)+' পৃষ্ঠা · চলছে পৃষ্ঠা '+BN((ST.page[id]||0)+1)));
  mt.appendChild(E('span','go','শুরু করুন ›'));
  b.appendChild(mt);
  b.onclick=()=>{ST.view='book';ST.book=id;draw();};
  cs.appendChild(b);
 });
 h.appendChild(cs);
 w.appendChild(h); app.appendChild(w);
 progress();
}

function drawBook(){
 const bk=BOOKS[ST.book];
 let i=ST.page[ST.book]||0;
 if(i>=bk.pages.length)i=0;
 ST.page[ST.book]=i;
 const p=bk.pages[i];

 document.getElementById('htitle').textContent='আলিফিয়া ইলম '+bk.name;
 document.getElementById('hsub').textContent=bk.sub;

 app.innerHTML='';
 const w=E('div','wrap'), m=E('main');
 const box=E('div','page');
 box.appendChild(E('div','pno','পৃষ্ঠা '+BN(i+1)+' / '+BN(bk.pages.length)));
 box.appendChild(E('h1','pgt',p.t));
 box.appendChild(E('p','sub',p.s));
 if(p.aim)box.appendChild(E('div','aim','<b>উদ্দেশ্য:</b> '+p.aim));
 p.b.forEach(b=>box.appendChild(block(b)));
 m.appendChild(box); w.appendChild(m); app.appendChild(w);

 jp.innerHTML='';
 bk.pages.forEach((pp,k)=>{
  const o=document.createElement('option');
  o.value=k; o.textContent=BN(k+1)+'. '+pp.t;
  jp.appendChild(o);
 });
 jp.value=i;
 document.getElementById('bP').disabled=i===0;
 document.getElementById('bN').disabled=i===bk.pages.length-1;
 nav.style.display='block';
 window.scrollTo({top:0,behavior:'smooth'});
 progress(); save();
}

function draw(){ ST.view==='home'?drawHome():drawBook(); }

/* ============ নেভিগেশন ============ */
const goHome=()=>{ST.view='home';draw();};
document.getElementById('home').onclick=goHome;
document.getElementById('bH').onclick=goHome;
jp.onchange=()=>{ST.page[ST.book]=+jp.value;draw();};
document.getElementById('bP').onclick=()=>{if(ST.page[ST.book]>0){ST.page[ST.book]--;draw();}};
document.getElementById('bN').onclick=()=>{if(ST.page[ST.book]<BOOKS[ST.book].pages.length-1){ST.page[ST.book]++;draw();}};
document.addEventListener('keydown',e=>{
 if(ST.view!=='book')return;
 if(e.key==='ArrowRight')document.getElementById('bN').click();
 if(e.key==='ArrowLeft')document.getElementById('bP').click();
 if(e.key==='Escape')mask.classList.remove('on');
});

applyMode(); draw();
</script>
</body>
</html>
