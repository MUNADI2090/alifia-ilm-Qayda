<!doctype html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>আলিফিয়া ইলম একাডেমি — কায়দা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600;700&family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============ ভিত্তি ============ */
:root{
  --fB:'Hind Siliguri',system-ui,sans-serif;
  --fH:'Baloo Da 2','Hind Siliguri',sans-serif;
  --fA:'Scheherazade New','Amiri',serif;
  --fQ:'Amiri','Scheherazade New',serif;
  --bg:#f5f6fb; --card:#ffffff; --soft:#fafbff;
  --ink:#16202c; --mut:#6b7789; --line:#e5e9f2;
  --grn:#1f8a4c; --grnS:#e9f6ee; --red:#d93a3a; --redS:#fdeced;
  --sh:0 1px 2px rgba(16,24,40,.05),0 6px 18px rgba(16,24,40,.05);
  --fs:16px;
}
html[data-theme="dark"]{
  --bg:#0b1118; --card:#131c26; --soft:#0f1822;
  --ink:#eef4fa; --mut:#9db0c4; --line:#22303f;
  --grnS:#11301e; --redS:#31161a;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs);scroll-behavior:auto;overflow-anchor:none}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--fB);font-weight:400;
  line-height:1.95;                 /* বাংলা মাত্রা যেন না কাটে */
  -webkit-text-size-adjust:100%;
  padding-bottom:5.5rem;
}
/* সংখ্যা যেন কখনো লাইন ভেঙে আলাদা না হয় */
.n,.num,b,strong{display:inline;white-space:nowrap}
b,strong{font-weight:700;color:var(--grn)}
h1,h2,h3,h4{font-family:var(--fH);font-weight:700;line-height:1.7;margin:0}
p{margin:0 0 .55rem}
p:last-child{margin-bottom:0}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ============ ভূমিকা বাছাই ============ */
.gate{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:1.25rem}
.gate .box{width:100%;max-width:26rem;text-align:center}
.gate .logo{width:4.5rem;height:4.5rem;margin:0 auto 1rem;border-radius:1.25rem;
  background:var(--grnS);color:var(--grn);display:flex;align-items:center;justify-content:center;
  font-family:var(--fA);font-size:2.6rem;line-height:1}
.gate h1{font-size:1.6rem;margin-bottom:.2rem}
.gate .sub{color:var(--mut);font-size:.92rem;margin-bottom:1.5rem}
.pick{display:grid;gap:.75rem}
.pick button{padding:1rem;border-radius:1rem;border:1.5px solid var(--line);
  background:var(--card);font-size:1.05rem;font-weight:600;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center;gap:.5rem}
.pick button .dot{width:.7rem;height:.7rem;border-radius:50%}
.pick .st .dot{background:var(--red)} .pick .us .dot{background:var(--grn)}
.gate .code{margin-top:1rem;display:none}
.gate .code input{width:100%;padding:.8rem 1rem;border-radius:.9rem;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:1rem;text-align:center}
.gate .code .go{margin-top:.6rem;width:100%;padding:.8rem;border-radius:.9rem;border:0;
  background:var(--grn);color:#fff;font-weight:700;font-size:1rem}
.gate .err{color:var(--red);font-size:.85rem;margin-top:.5rem;min-height:1.2rem}

/* ============ হেডার ============ */
header{position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(0,0,0,.02)}
.hd1{display:flex;align-items:center;gap:.7rem;padding:.7rem .9rem .5rem}
.brand{width:2.6rem;height:2.6rem;border-radius:.8rem;background:var(--grnS);color:var(--grn);
  display:flex;align-items:center;justify-content:center;font-family:var(--fA);font-size:1.7rem;flex:0 0 auto}
.btitle{flex:1;min-width:0}
.btitle h1{font-size:1.15rem}
.btitle span{display:block;font-size:.78rem;color:var(--mut);line-height:1.5}
.tools{display:flex;gap:.4rem;flex:0 0 auto}
.tools button{width:2.5rem;height:2.5rem;border-radius:.75rem;border:1.5px solid var(--line);
  background:var(--card);font-size:1rem;display:flex;align-items:center;justify-content:center}
.hd2{display:flex;align-items:center;gap:.6rem;padding:0 .9rem .5rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .8rem;border-radius:999px;
  font-size:.85rem;font-weight:600;border:1.5px solid}
.chip .dot{width:.55rem;height:.55rem;border-radius:50%}
.chip.st{color:var(--red);border-color:var(--red);background:var(--redS)}
.chip.st .dot{background:var(--red)}
.chip.us{color:var(--grn);border-color:var(--grn);background:var(--grnS)}
.chip.us .dot{background:var(--grn)}
.hint{font-size:.8rem;color:var(--mut);flex:1;min-width:8rem;line-height:1.6}
.stat{padding:0 .9rem .45rem;font-size:.8rem;color:var(--mut)}
.bar{height:.28rem;background:var(--line)}
.bar i{display:block;height:100%;background:var(--grn);width:0;transition:width .25s}

/* ============ পাতা ============ */
main{max-width:46rem;margin:0 auto;padding:1rem .9rem 1.5rem}
.phead{margin-bottom:1rem}
.phead h1{font-size:1.5rem;line-height:1.6}
.psub{color:var(--mut);font-size:.92rem;margin-top:.1rem}
.aim{margin-top:.7rem;padding:.65rem .9rem;border-right:4px solid var(--grn);
  background:var(--grnS);border-radius:.7rem;font-size:.9rem}
html[dir] .aim{border-right:0;border-left:4px solid var(--grn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;
  padding:1rem 1.05rem;box-shadow:var(--sh);margin-bottom:1rem;position:relative}
.card h3{font-size:1.05rem;color:var(--grn);margin-bottom:.5rem}
.sec{font-size:1rem;color:var(--mut);margin:1.3rem 0 .6rem;padding-bottom:.4rem;
  border-bottom:1px solid var(--line)}
.tip{background:var(--soft);border:1px dashed var(--line);border-radius:.9rem;
  padding:.7rem .95rem;font-size:.88rem;color:var(--mut);margin-bottom:1rem}

/* ============ ঘর (এক ডিজাইন সব পাতায়) ============ */
.grid{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
  gap:.6rem;margin-bottom:1rem}
.cell{position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:.95rem;box-shadow:var(--sh);padding:1.15rem .4rem .7rem;
  text-align:center;overflow:hidden}
.cell .ar{font-family:var(--fA);direction:rtl;unicode-bidi:isolate;
  font-size:clamp(1.6rem,7.5vw,2.3rem);line-height:2.15;
  padding:.1rem .15rem;word-break:keep-all}
.cell .bn{font-size:.72rem;color:var(--mut);line-height:1.8;margin-top:.35rem;
  padding:0 .15rem;word-break:break-word}
.cell[data-info]{cursor:pointer}
.cell[data-info]:active{border-color:var(--grn)}
.grid[style*="--cols:1"] .cell .ar,.grid[style*="--cols:2"] .cell .ar{font-size:clamp(1.5rem,6vw,2.1rem)}
/* চিহ্নের বোতাম — শুধু কোণে */
.mk{position:absolute;top:.35rem;inset-inline-start:.35rem;width:1.15rem;height:1.15rem;
  border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0;z-index:2}
.mk.s{background:var(--red);border-color:var(--red);box-shadow:0 0 0 3px var(--redS)}
.mk.u{background:var(--grn);border-color:var(--grn);box-shadow:0 0 0 3px var(--grnS)}

/* ============ সূরা ============ */
.surah .sname{font-family:var(--fH);font-size:1.25rem;font-weight:700;text-align:center}
.surah .smeta{text-align:center;color:var(--mut);font-size:.85rem;margin-bottom:.8rem}
.stext{direction:rtl;text-align:center;font-family:var(--fQ);
  font-size:clamp(1.35rem,5.6vw,1.75rem);line-height:2.6;
  background:var(--soft);border:1px solid var(--line);border-radius:.9rem;padding:1rem .8rem}
.bism{display:block;margin-bottom:.7rem;font-size:.9em}
.ayn{display:inline-block;min-width:1.55rem;height:1.55rem;line-height:1.5rem;
  border:1.5px solid var(--grn);color:var(--grn);border-radius:50%;
  font-family:var(--fB);font-size:.72rem;text-align:center;margin:0 .3rem;
  vertical-align:middle;white-space:nowrap}
.mean ol{margin:0;padding-inline-start:1.4rem}
.mean li{margin-bottom:.4rem;font-size:.92rem}

/* ============ মডাল ============ */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(8,14,22,.45);padding:1rem}
.modal[hidden]{display:none}
.modal .mbox{width:100%;max-width:26rem;background:var(--card);border-radius:1.2rem;
  padding:1.2rem;box-shadow:var(--sh);text-align:center}
.modal .mar{font-family:var(--fA);font-size:3.2rem;line-height:1.8;direction:rtl}
.modal h3{font-size:1.2rem;margin:.2rem 0 .4rem}
.modal p{color:var(--mut);font-size:.92rem}
.modal .close{margin-top:1rem;width:100%;padding:.75rem;border-radius:.85rem;border:0;
  background:var(--grn);color:#fff;font-weight:700;font-size:.95rem}

/* ============ নিচের নেভিগেশন ============ */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
  border-top:1px solid var(--line);padding:.55rem .7rem calc(.55rem + env(safe-area-inset-bottom))}
.nrow{max-width:46rem;margin:0 auto;display:flex;gap:.4rem;align-items:center}
.nrow button,.nrow select{border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:.8rem;padding:.6rem .7rem;font-size:.88rem;font-family:inherit;font-weight:600}
.nrow select{flex:1;min-width:0;text-overflow:ellipsis}
.nrow .next{background:var(--grn);color:#fff;border-color:var(--grn);white-space:nowrap}
.nrow button:disabled{opacity:.4}
.foot{text-align:center;font-size:.72rem;color:var(--mut);margin-top:.35rem}

/* ============ হোম ============ */
.hcard{display:flex;gap:.9rem;align-items:flex-start;background:var(--card);
  border:1px solid var(--line);border-radius:1.1rem;padding:1.05rem;box-shadow:var(--sh);
  margin-bottom:.9rem;width:100%;text-align:start;font:inherit}
.hcard .ic{width:3.2rem;height:3.2rem;border-radius:.9rem;display:flex;align-items:center;
  justify-content:center;font-family:var(--fA);font-size:2rem;flex:0 0 auto}
.hcard h3{font-size:1.15rem;color:var(--ink);margin-bottom:.3rem}
.hcard p{font-size:.88rem;color:var(--mut);line-height:1.85}
.hcard .meta{margin-top:.45rem;font-size:.8rem;color:var(--grn);font-weight:600}
.hcard.soon{opacity:.75}
.hero{text-align:center;margin:.5rem 0 1.4rem}
.hero .ara{font-family:var(--fA);font-size:1.9rem;color:var(--mut);direction:rtl;line-height:2}
.hero h2{font-size:1.7rem;margin:.2rem 0 .25rem}
.hero p{color:var(--mut);font-size:.92rem}
</style>
</head>
<body>

<!-- ভূমিকা বাছাই -->
<div class="gate" id="gate">
  <div class="box">
    <div class="logo">ا</div>
    <h1>আলিফিয়া ইলম একাডেমি</h1>
    <div class="sub">আপনি কে? নিচ থেকে বেছে নিন।</div>
    <div class="pick">
      <button class="st" id="bSt" type="button"><span class="dot"></span> ছাত্র</button>
      <button class="us" id="bUs" type="button"><span class="dot"></span> উস্তাদ</button>
    </div>
    <div class="code" id="codeBox">
      <input id="codeIn" type="text" placeholder="উস্তাদের কোড" autocomplete="off">
      <button class="go" id="codeGo" type="button">প্রবেশ করুন</button>
      <div class="err" id="codeErr"></div>
    </div>
  </div>
</div>

<header id="hd" hidden>
  <div class="hd1">
    <div class="brand">ا</div>
    <div class="btitle"><h1>আলিফিয়া ইলম</h1><span id="branch">কায়দা শাখা</span></div>
    <div class="tools">
      <button id="tTheme" type="button" title="আলো/আঁধার">🌙</button>
      <button id="tFont" type="button" title="লেখার আকার">অ+</button>
      <button id="tRole" type="button" title="ভূমিকা বদল">↻</button>
    </div>
  </div>
  <div class="hd2">
    <span class="chip st" id="chip"><span class="dot"></span> ছাত্র</span>
    <span class="hint" id="hint">ঘরের কোণে চাপ দিলে লাল চিহ্ন বসবে</span>
  </div>
  <div class="stat" id="stat"></div>
  <div class="bar"><i id="barI"></i></div>
</header>

<main><div id="page"></div></main>

<nav id="nav" hidden>
  <div class="nrow">
    <button id="nHome" type="button">হোম</button>
    <button id="nPrev" type="button">‹</button>
    <select id="nSel"></select>
    <button id="nNext" class="next" type="button">পরের ›</button>
  </div>
  <div class="foot">আলিফিয়া ইলম একাডেমি</div>
</nav>

<div class="modal" id="modal" hidden>
  <div class="mbox">
    <div class="mar" id="mAr"></div>
    <h3 id="mName"></h3>
    <p id="mInfo"></p>
    <button class="close" id="mClose" type="button">ঠিক আছে</button>
  </div>
</div>

<script>
/* ===================== ছোট সহায়ক ===================== */
const BN='০১২৩৪৫৬৭৮৯';
const bn = n => String(n).replace(/\d/g, d => BN[+d]);
const F='\u064E', K='\u0650', D='\u064F';          // যবর যের পেশ
const FT='\u064B', KT='\u064D', DT='\u064C';       // তানবীন
const SK='\u0652', SH='\u0651';                    // জযম, তাশদীদ
const Z='\u200D';                                  // যোগচিহ্ন
const lng = s => s.replace(/ি/g,'ী').replace(/ু/g,'ূ').replace(/ই/g,'ঈ').replace(/উ/g,'ঊ');

/* ===================== ২৯ হরফ ===================== */
/* [আরবি, নাম, যবর, যের, পেশ, জযম, মাখরাজ] */
const L=[
['ا','আলিফ','আ','ই','উ','আ','কণ্ঠের একদম শুরু থেকে'],
['ب','বা','বা','বি','বু','আব্','দুই ঠোঁট মিলিয়ে'],
['ت','তা','তা','তি','তু','আত্','জিহ্বার আগা ও উপরের সামনের দাঁতের গোড়া'],
['ث','ছা','ছা','ছি','ছু','আছ্','জিহ্বার আগা ও উপরের দাঁতের কিনারা'],
['ج','জীম','জা','জি','জু','আজ্','জিহ্বার মধ্যভাগ ও উপরের তালু'],
['ح','হা','হা','হি','হু','আহ্','কণ্ঠের মাঝখান'],
['خ','খা','খা','খি','খু','আখ্','কণ্ঠের উপরিভাগ'],
['د','দাল','দা','দি','দু','আদ্','জিহ্বার আগা ও দাঁতের গোড়া'],
['ذ','যাল','যা','যি','যু','আয্','জিহ্বার আগা ও দাঁতের কিনারা'],
['ر','রা','রা','রি','রু','আর্','জিহ্বার আগা, তালুর কাছাকাছি'],
['ز','যা','যা','যি','যু','আয্','জিহ্বার আগা ও নিচের দাঁত'],
['س','সীন','সা','সি','সু','আস্','জিহ্বার আগা ও নিচের দাঁত'],
['ش','শীন','শা','শি','শু','আশ্','জিহ্বার মধ্যভাগ ও তালু'],
['ص','ছোয়াদ','ছা','ছি','ছু','আছ্','জিহ্বার আগা ও নিচের দাঁত — মোটা করে'],
['ض','দোয়াদ','দা','দি','দু','আদ্','জিহ্বার পাশ ও উপরের মাড়ির দাঁত'],
['ط','ত্বোয়া','তা','তি','তু','আত্','জিহ্বার আগা ও দাঁতের গোড়া — মোটা করে'],
['ظ','যোয়া','যা','যি','যু','আয্','জিহ্বার আগা ও দাঁতের কিনারা — মোটা করে'],
['ع','আইন','আ','ই','উ','আ‘','কণ্ঠের মাঝখান'],
['غ','গাইন','গা','গি','গু','আগ্','কণ্ঠের উপরিভাগ'],
['ف','ফা','ফা','ফি','ফু','আফ্','নিচের ঠোঁট ও উপরের সামনের দাঁত'],
['ق','ক্বাফ','ক্বা','ক্বি','ক্বু','আক্','জিহ্বার গোড়া ও নরম তালু'],
['ك','কাফ','কা','কি','কু','আক্','জিহ্বার গোড়া, ক্বাফের একটু সামনে'],
['ل','লাম','লা','লি','লু','আল্','জিহ্বার আগার পাশ ও উপরের মাড়ি'],
['م','মীম','মা','মি','মু','আম্','দুই ঠোঁট মিলিয়ে — নাক থেকে গুন্নাহ'],
['ن','নূন','না','নি','নু','আন্','জিহ্বার আগা ও মাড়ি — নাক থেকে গুন্নাহ'],
['و','ওয়াও','ওয়া','ওয়ি','ওয়ু','আও','দুই ঠোঁট গোল করে'],
['ه','হা','হা','হি','হু','আহ্','কণ্ঠের একদম শুরু'],
['ء','হামযা','আ','ই','উ','আ’','কণ্ঠের একদম শুরু'],
['ي','ইয়া','ইয়া','ইয়ি','ইয়ু','আই','জিহ্বার মধ্যভাগ ও তালু']
];

/* ===================== ঘর তৈরির কারখানা ===================== */
const g = (fn, skip=0) => L.slice(skip).map(fn);

const gHrf   = g(x=>[x[0], x[1], x[6]]);
const gRup   = g(x=>[`${Z+x[0]} ${Z+x[0]+Z} ${x[0]+Z}`, x[1]]);
const gFat   = g(x=>[x[0]+F, x[2]]);
const gKas   = g(x=>[x[0]+K, x[3]]);

['সূরা আন-নাসর','মাদানী · তিন (৩) আয়াত',true,[
 'إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ','وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللَّهِ أَفْوَاجًا',
 'فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا'],
 ['যখন আল্লাহর সাহায্য ও বিজয় আসবে।','আর আপনি মানুষকে দলে দলে আল্লাহর দ্বীনে প্রবেশ করতে দেখবেন।',
  'তখন আপনার প্রতিপালকের প্রশংসাসহ তাসবীহ পড়ুন ও ক্ষমা চান। নিশ্চয়ই তিনি তওবা কবুলকারী।']],

['সূরা আল-কাফিরূন','মক্কী · ছয় (৬) আয়াত',true,[
 'قُلْ يَا أَيُّهَا الْكَافِرُونَ','لَا أَعْبُدُ مَا تَعْبُدُونَ','وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ',
 'وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّمْ','وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ','لَكُمْ دِينُكُمْ وَلِيَ دِينِ'],
 ['বলুন, হে কাফিরগণ।','আমি তার ইবাদত করি না, যার ইবাদত তোমরা করো।',
  'তোমরাও তাঁর ইবাদতকারী নও, যাঁর ইবাদত আমি করি।','আমিও তার ইবাদতকারী নই, যার ইবাদত তোমরা করেছ।',
  'তোমরাও তাঁর ইবাদতকারী নও, যাঁর ইবাদত আমি করি।','তোমাদের দ্বীন তোমাদের, আমার দ্বীন আমার।']],

['সূরা আল-কাউছার','মক্কী · তিন (৩) আয়াত',true,[
 'إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ','فَصَلِّ لِرَبِّكَ وَانْحَرْ','إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ'],
 ['নিশ্চয়ই আমি আপনাকে কাউছার দান করেছি।','অতএব আপনার প্রতিপালকের জন্য নামায পড়ুন ও কুরবানি করুন।',
  'নিশ্চয়ই আপনার শত্রুই নির্বংশ।']],

['সূরা আল-মাউন','মক্কী · সাত (৭) আয়াত',true,[
 'أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ','فَذَٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ','وَلَا يَحُضُّ عَلَىٰ طَعَامِ الْمِسْكِينِ',
 'فَوَيْلٌ لِّلْمُصَلِّينَ','الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ','الَّذِينَ هُمْ يُرَاءُونَ','وَيَمْنَعُونَ الْمَاعُونَ'],
 ['আপনি কি তাকে দেখেছেন, যে বিচার দিনকে অস্বীকার করে?','সে-ই তো এতিমকে দূর দূর করে তাড়ায়।',
  'আর মিসকীনকে খাওয়াতে উৎসাহ দেয় না।','অতএব দুর্ভোগ সেই নামাযীদের জন্য।',
  'যারা নিজেদের নামায সম্পর্কে উদাসীন।','যারা লোক দেখানোর জন্য করে।','আর নিত্যপ্রয়োজনীয় জিনিস দিতে বাধা দেয়।']],

['সূরা কুরাইশ','মক্কী · চার (৪) আয়াত',true,[
 'لِإِيلَافِ قُرَيْشٍ','إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ','فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ',
 'الَّذِي أَطْعَمَهُم مِّن جُوعٍ وَآمَنَهُم مِّنْ خَوْفٍ'],
 ['কুরাইশের অভ্যস্ততার কারণে।','শীত ও গ্রীষ্মের সফরে তাদের অভ্যস্ততার কারণে।',
  'অতএব তারা যেন এই ঘরের প্রতিপালকের ইবাদত করে।',
  'যিনি তাদের ক্ষুধায় খাইয়েছেন এবং ভয় থেকে নিরাপদ করেছেন।']]
];
S.forEach(s=>P.push({t:s[0], s:'নামাযের সূরা', aim:'আয়াতগুলো শুদ্ধভাবে পড়তে পারা।',
  b:[{k:'surah',n:s[0],meta:s[1],bism:s[2],a:s[3]}, {k:'mean',m:s[4]}]}));

/* ===================== অবস্থা ===================== */
const LS=localStorage;
let role = LS.getItem('aq_role')||'';
let cur  = +(LS.getItem('aq_page')||-1);          // -1 = হোম
let MS   = new Set(JSON.parse(LS.getItem('aq_ms')||'[]'));
let MU   = new Set(JSON.parse(LS.getItem('aq_mu')||'[]'));
const save=()=>{LS.setItem('aq_page',cur);LS.setItem('aq_ms',JSON.stringify([...MS]));
  LS.setItem('aq_mu',JSON.stringify([...MU]));};

let TOTAL=0;
P.forEach((p,pi)=>p.b.forEach(b=>{ if(b.k==='grid') TOTAL+=b.items.length; if(b.k==='surah') TOTAL+=1; }));

const $=id=>document.getElementById(id);
const pageEl=$('page');

/* ===================== ভূমিকা ===================== */
$('bSt').onclick=()=>setRole('st');
$('bUs').onclick=()=>{ $('codeBox').style.display='block'; $('codeIn').focus(); };
$('codeGo').onclick=()=>{
  if($('codeIn').value.trim().toUpperCase()==='ALIF-USTAD') setRole('us');
  else $('codeErr').textContent='কোড মেলেনি। আবার চেষ্টা করুন।';
};
$('codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') $('codeGo').click(); });

function setRole(r){
  role=r; LS.setItem('aq_role',r);
  $('gate').style.display='none'; $('hd').hidden=false; $('nav').hidden=false;
  const c=$('chip');
  c.className='chip '+(r==='us'?'us':'st');
  c.innerHTML='<span class="dot"></span> '+(r==='us'?'উস্তাদ':'ছাত্র');
  $('hint').textContent = r==='us'
    ? 'ঘরের কোণে চাপ দিলে সবুজ চিহ্ন বসবে'
    : 'ঘরের কোণে চাপ দিলে লাল চিহ্ন বসবে';
  render();
}
$('tRole').onclick=()=>{ LS.removeItem('aq_role'); location.reload(); };

/* ===================== থিম ও আকার ===================== */
const th=LS.getItem('aq_theme')||'light';
document.documentElement.dataset.theme=th;
$('tTheme').textContent = th==='dark'?'☀️':'🌙';
$('tTheme').onclick=()=>{
  const d=document.documentElement;
  const n=d.dataset.theme==='dark'?'light':'dark';
  d.dataset.theme=n; LS.setItem('aq_theme',n);
  $('tTheme').textContent = n==='dark'?'☀️':'🌙';
};
const FSZ=[16,18,20];
let fi=+(LS.getItem('aq_fs')||0);
const applyFS=()=>document.documentElement.style.setProperty('--fs',FSZ[fi]+'px');
applyFS();
$('tFont').onclick=()=>{ fi=(fi+1)%FSZ.length; LS.setItem('aq_fs',fi); applyFS(); };

/* ===================== নেভিগেশন ===================== */
const sel=$('nSel');
sel.innerHTML=P.map((p,i)=>`<option value="${i}">${bn(i+1)}. ${p.t}</option>`).join('');
sel.onchange=()=>go(+sel.value);
$('nHome').onclick=()=>go(-1);
$('nPrev').onclick=()=>go(cur-1);
$('nNext').onclick=()=>go(cur+1);
function go(i){
  cur = i<-1 ? -1 : (i>=P.length ? P.length-1 : i);
  save(); render(); window.scrollTo(0,0);
}

/* ===================== আঁকা ===================== */
function render(){
  if(cur<0){ drawHome(); } else { drawPage(P[cur]); }
  const done = role==='us'?MU.size:MS.size;
  $('stat').innerHTML = `ছাত্রের চিহ্ন <span class="n">${bn(MS.size)}</span> · উস্তাদের চিহ্ন <span class="n">${bn(MU.size)}</span> · মোট ঘর <span class="n">${bn(TOTAL)}</span>`;
  $('barI').style.width = (TOTAL? (done/TOTAL*100):0)+'%';
  $('branch').textContent = cur<0 ? 'একাডেমি' : 'কায়দা শাখা';
  $('nPrev').disabled = cur<0;
  $('nNext').disabled = cur>=P.length-1;
  sel.value = cur<0?0:cur;
}

function drawHome(){
  pageEl.innerHTML=`
  <div class="hero">
    <div class="ara">بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ</div>
    <h2>আলিফিয়া ইলম একাডেমি</h2>
    <p>নিচ থেকে বেছে নিন</p>
  </div>
  <button class="hcard" type="button" id="goQ">
    <span class="ic" style="background:var(--grnS);color:var(--grn)">ا</span>
    <span>
      <h3>কায়দা</h3>
      <p>ঊনত্রিশ <span class="n">(২৯)</span> হরফ, যবর-যের-পেশ, তানবীন, জযম, তাশদীদ, মাদ্দ, শব্দ, বাক্য ও নামাযের দশ সূরা।</p>
      <span class="meta">মোট <span class="n">${bn(P.length)}</span> পৃষ্ঠা · চলছে পৃষ্ঠা <span class="n">${bn(Math.max(1,(+LS.getItem('aq_last')||1)))}</span></span>
    </span>
  </button>
  <button class="hcard" type="button" id="goT">
    <span class="ic" style="background:var(--redS);color:var(--red)">✦</span>
    <span>
      <h3>তাজবীদ</h3>
      <p>সতেরো <span class="n">(১৭)</span>টি মাখরাজ, হরফের গুণ, নূন ও মীম সাকিন, গুন্নাহ, মাদ্দের প্রকার, লাম-রা, কলকলা ও ওয়াক্‌ফ।</p>
      <span class="meta">মোট <span class="n">২৭</span> পৃষ্ঠা</span>
    </span>
  </button>`;
  $('goQ').onclick=()=>go(Math.max(0,(+LS.getItem('aq_last')||1)-1));
  $('goT').onclick=()=>{ location.href='tajwid.html'; };
}


function drawPage(p){
  LS.setItem('aq_last',cur+1);
  let h=`<div class="phead"><h1>${p.t}</h1>`;
  if(p.s) h+=`<p class="psub">${p.s}</p>`;
  if(p.aim) h+=`<div class="aim"><b>উদ্দেশ্য:</b> ${p.aim}</div>`;
  h+='</div>';
  p.b.forEach((b,bi)=>h+=block(b,bi));
  pageEl.innerHTML=h;
  paint();
}
  
function block(b,bi){
  if(b.k==='note')
    return `<section class="card"><h3>${b.t}</h3>${b.items.map(x=>`<p>${x}</p>`).join('')}</section>`;
  if(b.k==='sec')  return `<h2 class="sec">${b.t}</h2>`;
  if(b.k==='tip')  return `<div class="tip">${b.t}</div>`;
  if(b.k==='grid') return `<div class="grid" style="--cols:${b.cols}">`+
      b.items.map((it,ci)=>cellHTML(it,`${cur}.${bi}.${ci}`)).join('')+`</div>`;
  if(b.k==='surah'){
    const id=`${cur}.${bi}.0`;
    const ar=b.a.map((x,i)=>`${x}<span class="ayn">${bn(i+1)}</span>`).join(' ');
    return `<section class="card surah" data-id="${id}">
      <button class="mk" type="button" data-mk="${id}" aria-label="চিহ্ন"></button>
      <div class="sname">${b.n}</div><div class="smeta">${b.meta}</div>
      <div class="stext">${b.bism?'<span class="bism">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>':''}${ar}</div>
    </section>`;
  }
  if(b.k==='mean')
    return `<section class="card mean"><h3>অর্থ</h3><ol>${b.m.map(x=>`<li>${x}</li>`).join('')}</ol></section>`;
  return '';
}

function cellHTML(it,id){
  const info = it[2] ? ` data-info="${encodeURIComponent(it[2])}" data-name="${encodeURIComponent(it[1])}"` : '';
  return `<div class="cell" data-id="${id}"${info}>
    <button class="mk" type="button" data-mk="${id}" aria-label="চিহ্ন"></button>
    <div class="ar">${it[0]}</div>
    ${it[1]?`<div class="bn">${it[1]}</div>`:''}
  </div>`;
}

/* চিহ্ন বসানো — পাতা নতুন করে আঁকা হয় না, তাই স্ক্রল নড়ে না */
function paint(){
  pageEl.querySelectorAll('.mk').forEach(el=>{
    const id=el.dataset.mk;
    el.classList.toggle('s',MS.has(id));
    el.classList.toggle('u',MU.has(id));
  });
}

pageEl.addEventListener('click',e=>{
  const mk=e.target.closest('.mk');
  if(mk){
    e.preventDefault(); e.stopPropagation();
    const id=mk.dataset.mk, set = role==='us'?MU:MS, cls = role==='us'?'u':'s';
    if(set.has(id)) set.delete(id); else set.add(id);
    mk.classList.toggle(cls,set.has(id));
    save();
    const done = role==='us'?MU.size:MS.size;
    $('stat').innerHTML = `ছাত্রের চিহ্ন <span class="n">${bn(MS.size)}</span> · উস্তাদের চিহ্ন <span class="n">${bn(MU.size)}</span> · মোট ঘর <span class="n">${bn(TOTAL)}</span>`;
    $('barI').style.width=(TOTAL?(done/TOTAL*100):0)+'%';
    return;                                   // এখানেই শেষ — উপরে লাফ দিবে না
  }
  const c=e.target.closest('.cell[data-info]');
  if(c){
    e.preventDefault();
    $('mAr').textContent = c.querySelector('.ar').textContent.trim();
    $('mName').textContent = decodeURIComponent(c.dataset.name||'');
    $('mInfo').textContent = 'মাখরাজ — '+decodeURIComponent(c.dataset.info||'');
    $('modal').hidden=false;
  }
},{passive:false});

$('mClose').onclick=()=>{ $('modal').hidden=true; };
$('modal').addEventListener('click',e=>{ if(e.target===$('modal')) $('modal').hidden=true; });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') $('modal').hidden=true;
  if($('modal').hidden && cur>=0){
    if(e.key==='ArrowLeft') go(cur+1);
    if(e.key==='ArrowRight') go(cur-1);
  }
});

/* ===================== চালু ===================== */
if(role) setRole(role); else $('gate').style.display='flex';
</script>
</body>
</html>
