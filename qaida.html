<!DOCTYPE html>
<html lang="bn" data-theme="light" data-fs="m">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>আলিফিয়া ইলম — কায়দা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f2f5f9; --card:#ffffff; --soft:#f7f9fc; --line:#d3dbe6; --line2:#b9c4d4;
--ink:#0a1020; --ink2:#475569; --ar:#0a1020;
--g:#0d7a4f; --gbg:#e4f5ec; --r:#c02a35; --rbg:#fdeaec;
--acc:#0d7a4f; --rad:16px; --sh:0 1px 3px rgba(16,24,40,.08),0 6px 18px rgba(16,24,40,.06);
}
html[data-theme="dark"]{
--bg:#0c1219; --card:#161e29; --soft:#1c2634; --line:#34475f; --line2:#4a627f;
--ink:#f7fafd; --ink2:#cbd6e4; --ar:#ffffff;
--g:#4ee3a4; --gbg:#0f3527; --r:#ff939b; --rbg:#3a1a1e;
--acc:#4ee3a4; --sh:0 1px 3px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.35);
}
html[data-fs="s"]{--b:16px;--a:34px;--tile:60px;--q:26px;}
html[data-fs="m"]{--b:18px;--a:42px;--tile:72px;--q:32px;}
html[data-fs="l"]{--b:20.5px;--a:52px;--tile:86px;--q:39px;}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
 font-family:'Hind Siliguri',system-ui,sans-serif;
 font-size:var(--b); line-height:1.95; font-weight:500;
 background:var(--bg); color:var(--ink);
 -webkit-user-select:none;user-select:none;
 -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
 overflow-x:hidden; padding-bottom:100px;
 transition:background .2s,color .2s;
}
/* সংখ্যা পরিষ্কার দেখানোর জন্য */
.num{font-weight:700;letter-spacing:.04em;padding:0 .06em;}
.ar{font-family:'Noto Naskh Arabic',serif;direction:rtl;color:var(--ar);font-weight:500;line-height:2.15;}
.wrap{max-width:760px;margin:0 auto;padding:0 12px;}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:2px solid var(--line);}
.hbar{display:flex;align-items:center;gap:8px;padding:10px 12px;max-width:760px;margin:0 auto;}
.logo{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:var(--gbg);color:var(--g);
 display:grid;place-items:center;font-family:'Noto Naskh Arabic',serif;font-size:25px;font-weight:700;line-height:1;}
.hname{flex:1 1 auto;min-width:0;font-weight:700;font-size:1.02em;line-height:1.45;
 white-space:normal;overflow:visible;}
.hname small{display:block;font-weight:500;font-size:.74em;color:var(--ink2);line-height:1.5;}
.ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);
 background:var(--soft);color:var(--ink);font-size:.84em;font-weight:700;cursor:pointer;
 display:grid;place-items:center;font-family:inherit;line-height:1;}
.ic:active{transform:scale(.94);}
.rolebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px 10px;max-width:760px;margin:0 auto;}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;
 font-size:.82em;font-weight:700;border:2px solid;line-height:1.9;}
.chip.s{color:var(--r);border-color:var(--r);background:var(--rbg);}
.chip.u{color:var(--g);border-color:var(--g);background:var(--gbg);}
.hint{font-size:.8em;color:var(--ink2);font-weight:500;line-height:1.7;}
.pbwrap{max-width:760px;margin:0 auto;padding:0 12px 11px;}
.pbtxt{font-size:.8em;color:var(--ink2);margin-bottom:6px;line-height:1.7;}
.pb{height:9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);overflow:hidden;display:flex;}
.pb i{display:block;height:100%;}
.pb .fs{background:var(--r);} .pb .fu{background:var(--g);}

/* ---------- cards ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--rad);
 box-shadow:var(--sh);padding:16px 14px;margin:14px 0;overflow:visible;}
.ptitle{font-size:1.3em;font-weight:700;line-height:1.55;}
.psub{color:var(--ink2);font-size:.88em;margin-top:2px;line-height:1.7;}
.paim{margin-top:11px;padding:11px 13px;border-right:5px solid var(--acc);
 background:var(--soft);border-radius:10px;font-size:.9em;line-height:1.8;}
.bt{font-weight:700;font-size:1em;margin:0 0 11px;padding-bottom:8px;border-bottom:2px solid var(--line);line-height:1.7;}

/* ---------- note ---------- */
.note{background:var(--soft);border:2px solid var(--line);border-radius:12px;padding:13px;margin:13px 0;}
.note h4{font-size:.96em;margin-bottom:7px;color:var(--acc);line-height:1.7;}
.note p{font-size:.94em;margin:7px 0;line-height:1.9;}
.note b{color:var(--acc);font-weight:700;}
.unote{background:var(--gbg);border:2px dashed var(--g);border-radius:12px;padding:13px;margin:13px 0;
 font-size:.92em;line-height:1.9;}
.unote strong{display:block;color:var(--g);margin-bottom:4px;font-size:.88em;}

/* ---------- tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile),1fr));gap:9px;}
.tile{position:relative;aspect-ratio:1/1;border:2px solid var(--line);border-radius:13px;
 background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:2px;cursor:pointer;padding:6px 3px 5px;}
.tile:active{border-color:var(--line2);}
.tile span{font-family:'Noto Naskh Arabic',serif;font-size:var(--a);color:var(--ar);
 line-height:1.15;font-weight:500;}
.tile em{font-style:normal;font-size:.64em;color:var(--ink2);line-height:1.4;text-align:center;}
.mk{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;
 border:2px solid var(--line);background:var(--card);cursor:pointer;padding:0;
 display:grid;place-items:center;z-index:2;}
.mk i{display:block;width:8px;height:8px;border-radius:99px;background:var(--line2);}
.mk.on-s{border-color:var(--r);background:var(--rbg);} .mk.on-s i{background:var(--r);}
.mk.on-u{border-color:var(--g);background:var(--gbg);} .mk.on-u i{background:var(--g);}
.mk.both{border-color:var(--g);background:var(--gbg);}
.mk.both i{background:linear-gradient(90deg,var(--r) 50%,var(--g) 50%);}

/* ---------- rows ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.ch{border:2px solid var(--line);border-radius:11px;background:var(--soft);
 padding:8px 14px;font-family:'Noto Naskh Arabic',serif;direction:rtl;
 font-size:calc(var(--a) * .74);color:var(--ar);line-height:2;}
.lines{display:flex;flex-direction:column;gap:9px;}
.ln{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
 border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:10px 36px 10px 13px;}
.ln .a{font-family:'Noto Naskh Arabic',serif;direction:rtl;font-size:calc(var(--a) * .72);
 color:var(--ar);line-height:2;flex:1 1 130px;min-width:0;overflow-wrap:anywhere;}
.ln .m{font-size:.88em;color:var(--ink2);flex:1 1 130px;min-width:0;line-height:1.85;overflow-wrap:anywhere;}
.ln .mk{top:7px;right:7px;}
.ln.big .a{font-size:calc(var(--a) * .58);flex:1 1 100%;text-align:right;}
.ln.big .m{flex:1 1 100%;}

/* ---------- table ---------- */
.tbx{width:100%;overflow-x:auto;}
.tb{width:100%;border-collapse:collapse;font-size:.9em;}
.tb th,.tb td{border:2px solid var(--line);padding:9px 6px;text-align:center;line-height:1.8;}
.tb th{background:var(--soft);font-weight:700;font-size:.9em;}
.tb td.a{font-family:'Noto Naskh Arabic',serif;font-size:calc(var(--a)*.62);color:var(--ar);line-height:1.9;}

/* ---------- surah ---------- */
.smeta{text-align:center;margin-bottom:13px;}
.sname{font-family:'Amiri',serif;font-size:1.55em;color:var(--ar);font-weight:700;line-height:2;}
.sbn{font-weight:700;font-size:1.1em;line-height:1.7;}
.sinfo{font-size:.83em;color:var(--ink2);line-height:1.7;}
.mushaf{border:2px solid var(--line);border-radius:14px;background:var(--soft);
 padding:18px 14px;direction:rtl;text-align:center;
 font-family:'Amiri','Noto Naskh Arabic',serif;font-size:var(--q);line-height:2.5;color:var(--ar);}
.ayn{display:inline-grid;place-items:center;width:1.5em;height:1.5em;margin:0 .26em;
 border:2px solid var(--acc);border-radius:99px;color:var(--acc);
 font-size:.5em;font-family:'Noto Naskh Arabic',serif;line-height:1;vertical-align:middle;font-weight:700;}
.means{margin-top:15px;}
.mn{display:flex;gap:11px;align-items:flex-start;padding:9px 2px;border-bottom:1px dashed var(--line);
 font-size:.92em;line-height:1.9;}
.mn:last-child{border-bottom:0;}
.mn b{flex:0 0 27px;height:27px;border-radius:99px;background:var(--soft);border:2px solid var(--line);
 display:grid;place-items:center;font-size:.74em;color:var(--acc);font-weight:700;line-height:1;}

/* ---------- home ---------- */
.cover{text-align:center;padding:26px 6px 10px;}
.cover .bsm{font-family:'Amiri',serif;font-size:1.75em;color:var(--ar);line-height:2.2;}
.cover h1{font-size:1.52em;margin-top:6px;line-height:1.6;}
.cover p{color:var(--ink2);font-size:.92em;margin-top:6px;line-height:1.8;}
.big{display:flex;gap:14px;align-items:flex-start;width:100%;
 background:var(--card);border:2px solid var(--line);border-radius:var(--rad);
 box-shadow:var(--sh);padding:16px 14px;margin:12px 0;cursor:pointer;font-family:inherit;color:inherit;
 text-align:left;overflow:visible;}
.big .bi{flex:0 0 54px;height:54px;border-radius:14px;display:grid;place-items:center;font-size:26px;
 font-family:'Noto Naskh Arabic',serif;line-height:1;}
.big .bx{flex:1 1 auto;min-width:0;}
.big .bx b{display:block;font-size:1.14em;line-height:1.7;}
.big .bx span{display:block;font-size:.86em;color:var(--ink2);line-height:1.8;margin-top:2px;
 overflow-wrap:anywhere;}
.big .bx em{display:block;font-style:normal;font-size:.8em;color:var(--ink2);margin-top:7px;line-height:1.7;}

/* ---------- role ---------- */
.role{min-height:68vh;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:18px 4px;}
.rbtn{width:100%;padding:20px 16px;border-radius:var(--rad);border:3px solid;background:var(--card);
 font-family:inherit;font-size:1.06em;font-weight:700;color:inherit;cursor:pointer;text-align:left;line-height:1.7;}
.rbtn span{display:block;font-weight:500;font-size:.82em;color:var(--ink2);margin-top:4px;line-height:1.8;}
.rbtn.s{border-color:var(--r);} .rbtn.u{border-color:var(--g);}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--line);}
.nb{display:flex;gap:7px;align-items:center;padding:9px 12px;max-width:760px;margin:0 auto;}
.nbtn{flex:0 0 auto;padding:11px 14px;border-radius:12px;border:2px solid var(--line);
 background:var(--soft);color:var(--ink);font-family:inherit;font-weight:700;font-size:.88em;
 cursor:pointer;line-height:1.5;}
.nbtn.go{background:var(--acc);border-color:var(--acc);color:#fff;}
html[data-theme="dark"] .nbtn.go{color:#06231a;}
.nbtn:disabled{opacity:.35;}
.sel{flex:1 1 auto;min-width:0;padding:11px 8px;border-radius:12px;border:2px solid var(--line);
 background:var(--soft);color:var(--ink);font-family:inherit;font-size:.88em;font-weight:600;line-height:1.5;}
.foot{text-align:center;font-size:.78em;color:var(--ink2);padding:3px 0 9px;line-height:1.7;}

/* ---------- modal ---------- */
.mask{position:fixed;inset:0;z-index:60;background:rgba(6,10,18,.62);
 display:none;align-items:flex-end;justify-content:center;}
.mask.on{display:flex;}
.modal{width:100%;max-width:760px;background:var(--card);border-radius:20px 20px 0 0;
 border-top:3px solid var(--line);padding:18px 16px 28px;max-height:88vh;overflow-y:auto;}
.modal .mar{font-family:'Noto Naskh Arabic',serif;font-size:calc(var(--a)*1.5);text-align:center;
 color:var(--ar);line-height:1.7;}
.modal h3{text-align:center;font-size:1.22em;margin:4px 0 13px;line-height:1.6;}
.mrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:.92em;line-height:1.85;}
.mrow b{flex:0 0 96px;color:var(--ink2);font-weight:600;}
.close{width:100%;margin-top:16px;padding:13px;border-radius:12px;border:2px solid var(--line);
 background:var(--soft);font-family:inherit;font-weight:700;font-size:.94em;color:var(--ink);cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <div class="logo">ا</div>
    <div class="hname">আলিফিয়া ইলম<small>কায়দা শাখা</small></div>
    <button class="ic" id="bTh">🌙</button>
    <button class="ic" id="bFs">অ+</button>
    <button class="ic" id="bRo">↺</button>
  </div>
  <div class="rolebar" id="rolebar"></div>
  <div class="pbwrap" id="pbwrap"></div>
</header>

<main class="wrap" id="main"></main>
<nav id="nav"></nav>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
const $=s=>document.querySelector(s);
const BN=n=>String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const NB=n=>'<span class="num">'+BN(n)+'</span>';
const AR=n=>String(n).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
function E(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;}

const note=(t,l)=>({k:'note',t,l});
const un=(t)=>({k:'un',t});
const grid=(items)=>({k:'grid',items});
const row=(t,s)=>({k:'row',t,s});
const ex=(t,l)=>({k:'ex',t,l});
const big=(t,l)=>({k:'big',t,l});
const tbl=(t,h,r)=>({k:'tbl',t,h,r});
const sura=(bn,arn,info,ayat,mean)=>({k:'sura',bn,arn,info,ayat,mean});

const HORF=[
['ا','আলিফ','মুখগহ্বর (জাওফ)','টান ছাড়া সোজা, হালকা করে পড়ুন।'],
['ب','বা','দুই ঠোঁট','ঠোঁট মিলিয়ে ছেড়ে দিন — বাংলা "ব" এর মতো।'],
['ت','তা','জিহ্বার আগা ও উপরের দাঁতের গোড়া','পাতলা "ত", জোর দেবেন না।'],
['ث','ছা','জিহ্বার আগা ও উপরের দাঁতের আগা','জিহ্বার আগা দাঁতের ফাঁকে।'],
['ج','জীম','জিহ্বার মাঝ ও উপরের তালু','পরিষ্কার "জ", "য" নয়।'],
['ح','হা','কণ্ঠনালীর মাঝখান','গলা থেকে গরম নিঃশ্বাসের মতো "হ"।'],
['خ','খা','কণ্ঠনালীর উপরের ভাগ','গলার উপর থেকে মোটা "খ"।'],
['د','দাল','জিহ্বার আগা ও উপরের দাঁতের গোড়া','পাতলা "দ"।'],
['ذ','যাল','জিহ্বার আগা ও উপরের দাঁতের আগা','জিহ্বা দাঁতের ফাঁকে — নরম "য"।'],
['ر','রা','জিহ্বার আগা ও তালুর সামনের অংশ','জিহ্বা একটু কেঁপে উঠবে।'],
['ز','যা','জিহ্বার আগা ও নিচের দাঁতের মাথা','শিস্‌ টানা "য"।'],
['س','সীন','জিহ্বার আগা ও নিচের দাঁতের মাথা','পাতলা শিস্‌ "স"।'],
['ش','শীন','জিহ্বার মাঝ ও উপরের তালু','ছড়ানো "শ"।'],
['ص','ছোয়াদ','জিহ্বার আগা ও নিচের দাঁত','মোটা করে "স" — মুখ ভরে।'],
['ض','দোয়াদ','জিহ্বার পাশ ও উপরের মাড়ির দাঁত','মোটা "দ", জিহ্বার পাশ চেপে ধরুন।'],
['ط','ত্বোয়া','জিহ্বার আগা ও উপরের দাঁতের গোড়া','মোটা ও শক্ত "ত"।'],
['ظ','যোয়া','জিহ্বার আগা ও উপরের দাঁতের আগা','মোটা "য", জিহ্বা দাঁতের ফাঁকে।'],
['ع','আইন','কণ্ঠনালীর মাঝখান','গলা চেপে আসা শব্দ, বাংলায় হুবহু নেই।'],
['غ','গাইন','কণ্ঠনালীর উপরের ভাগ','গড়গড়ানির মতো "গ"।'],
['ف','ফা','নিচের ঠোঁটের ভিতর ও উপরের দাঁত','দাঁত ঠোঁটে ছুঁয়ে "ফ"।'],
['ق','ক্বাফ','জিহ্বার গোড়া ও তালুর নরম অংশ','গলার গভীর থেকে মোটা "ক"।'],
['ك','কাফ','জিহ্বার গোড়া, ক্বাফের একটু সামনে','পাতলা "ক"।'],
['ل','লাম','জিহ্বার আগার পাশ ও উপরের মাড়ি','সাধারণ "ল"।'],
['م','মীম','দুই ঠোঁট','ঠোঁট মিলিয়ে "ম"।'],
['ن','নূন','জিহ্বার আগা ও উপরের মাড়ি','নাকে হালকা রেশ থাকবে।'],
['و','ওয়াও','দুই ঠোঁট গোল করে','ঠোঁট গোল — "ওয়া"।'],
['ه','হা','কণ্ঠনালীর শুরু (গভীর)','নরম, ফাঁকা নিঃশ্বাসের "হ"।'],
['ء','হামযা','কণ্ঠনালীর শুরু (গভীর)','হঠাৎ থেমে ছেড়ে দেওয়া শব্দ।'],
['ي','ইয়া','জিহ্বার মাঝ ও উপরের তালু','"ইয়া" — জিহ্বার মাঝ তালুতে।']
];

const P=[

['رَبّ','রব্ব — প্রতিপালক'],['دِين','দী-ন — ধর্ম'],['نَفْس','নাফস — প্রাণ'],
['أَرْض','আরদ্ব — জমিন']]),
un('শব্দ ভেঙে না পড়ে যেন একটানে পড়ে — এখানে এটাই লক্ষ্য।')
]},

{t:'দুই শব্দ একসাথে',s:'দ্বিতীয় ধাপ',aim:'দুইটি শব্দ মিলিয়ে পড়তে পারা।',b:[
note('নিয়ম',['দুই শব্দের মাঝে <b>বেশি ফাঁক রাখবেন না</b>। শ্বাস না ছেড়ে একসাথে পড়ুন।']),
big('পড়ুন',[
['بِسْمِ اللّٰه','বিসমিল্লাহ — আল্লাহর নামে'],
['رَبُّ الْعَالَمِين','রব্বুল আ-লামীন — জগতসমূহের প্রতিপালক'],
['يَوْمِ الدِّين','ইয়াওমিদ্দীন — বিচার দিন'],
['نُورُ السَّمَاء','নূরুস সামা-ই — আকাশের আলো'],
['كِتَابُ اللّٰه','কিতা-বুল্লাহ — আল্লাহর কিতাব'],
['عِبَادُ الرَّحْمٰن','ইবা-দুর রাহমা-ন — দয়াময়ের বান্দারা'],
['أَهْلُ الْبَيْت','আহলুল বাইত — ঘরের লোক'],
['خَيْرُ النَّاس','খাইরুন না-স — সেরা মানুষ']])
]},

{t:'তিন শব্দ একসাথে',s:'তৃতীয় ধাপ',aim:'তিনটি শব্দ একটানে পড়তে পারা।',b:[
big('পড়ুন',[
['الْحَمْدُ لِلّٰهِ رَبِّ','আলহামদু লিল্লা-হি রব্বি'],
['بِسْمِ اللّٰهِ الرَّحْمٰن','বিসমিল্লা-হির রাহমা-ন'],
['سُبْحَانَ رَبِّيَ الْأَعْلَى','সুবহা-না রব্বিয়াল আ‘লা'],
['لَا إِلٰهَ إِلَّا اللّٰه','লা- ইলা-হা ইল্লাল্লাহ'],
['اللّٰهُ أَكْبَرُ كَبِيرًا','আল্লাহু আকবারু কাবীরা'],
['رَبِّ زِدْنِي عِلْمًا','রব্বি যিদনী ইলমা — হে প্রভু, আমার জ্ঞান বাড়িয়ে দিন']]),
un('এখানে শ্বাস নেওয়ার জায়গা শিখিয়ে দিন — কোথায় থামা যায়, কোথায় যায় না।')
]},

{t:'ছোট বাক্য',s:'শেষ ধাপ',aim:'পূর্ণ একটি বাক্য না থেমে পড়তে পারা।',b:[
big('পড়ুন',[
['بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ','বিসমিল্লা-হির রাহমা-নির রাহীম'],
['الْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِينَ','আলহামদু লিল্লা-হি রব্বিল আ-লামীন'],
['سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ','সুবহা-নাল্লা-হি ওয়া বিহামদিহ'],
['لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰهِ','লা- হাওলা ওয়ালা- ক্বুওয়াতা ইল্লা- বিল্লাহ'],
['رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً','রব্বানা- আ-তিনা- ফিদ্দুনইয়া- হাসানাহ'],
['إِنَّا لِلّٰهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ','ইন্না- লিল্লা-হি ওয়া ইন্না- ইলাইহি রা-জিঊন']]),
un('এখান পর্যন্ত ঠিক হলে ছাত্র সূরা ধরার জন্য প্রস্তুত।')
]},

{t:'সূরা আল-ফাতিহা',s:'প্রথম সূরা',aim:'কুরআনের ধরনে আয়াত ধরে ধরে পড়তে পারা।',b:[
note('পড়ার নিয়ম',['প্রতিটি আয়াতের শেষে <b>গোল নম্বর</b> আছে — সেটাই <b>ওয়াকফ</b>, অর্থাৎ থামার জায়গা।',
'এক আয়াত পড়ুন, সেখানে থামুন, শ্বাস নিন, তারপর পরের আয়াত।',
'নিচে একই নম্বর ধরে ধরে প্রতিটি আয়াতের <b>অর্থ</b> দেওয়া আছে।']),
sura('সূরা আল-ফাতিহা','الْفَاتِحَة','মক্কী · সাত ('+BN(7)+') আয়াত',
['بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ',
'الْحَمْدُ لِلّٰهِ رَبِّ الْعَالَمِينَ',
'الرَّحْمٰنِ الرَّحِيمِ',
'مَالِكِ يَوْمِ الدِّينِ',
'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ',
'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',
'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ'],
['পরম করুণাময় অতি দয়ালু আল্লাহর নামে শুরু করছি।',
'সব প্রশংসা আল্লাহর জন্য, যিনি সমস্ত জগতের প্রতিপালক।',
'যিনি পরম করুণাময়, অতি দয়ালু।',
'যিনি বিচার দিনের মালিক।',
'আমরা কেবল আপনারই ইবাদত করি এবং কেবল আপনারই কাছে সাহায্য চাই।',
'আমাদের সরল পথ দেখান।',
'তাদের পথ, যাদের উপর আপনি অনুগ্রহ করেছেন; তাদের পথ নয় যারা অভিশপ্ত, আর নয় পথভ্রষ্টদের পথ।']),
un('ফাতিহা ছাড়া নামায হয় না। এটি সবচেয়ে বেশি সময় দিয়ে শোধরাবেন।')
]},

{t:'সূরা আল-ফীল',s:'হাতিওয়ালাদের ঘটনা',aim:'পাঁচ আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-ফীল','الْفِيل','মক্কী · পাঁচ ('+BN(5)+') আয়াত',
['أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَابِ الْفِيلِ',
'أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ',
'وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ',
'تَرْمِيهِمْ بِحِجَارَةٍ مِنْ سِجِّيلٍ',
'فَجَعَلَهُمْ كَعَصْفٍ مَأْكُولٍ'],
['আপনি কি দেখেননি, আপনার প্রতিপালক হাতিওয়ালাদের সাথে কী করেছিলেন?',
'তিনি কি তাদের ষড়যন্ত্র ব্যর্থ করে দেননি?',
'তিনি তাদের উপর ঝাঁকে ঝাঁকে পাখি পাঠালেন।',
'যারা তাদের উপর পোড়ামাটির পাথর নিক্ষেপ করছিল।',
'অতঃপর তিনি তাদের করে দিলেন খেয়ে ফেলা ভুসির মতো।'])
]},

{t:'সূরা কুরাইশ',s:'শীত ও গ্রীষ্মের সফর',aim:'চার আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা কুরাইশ','قُرَيْش','মক্কী · চার ('+BN(4)+') আয়াত',
['لِإِيلَافِ قُرَيْشٍ',
'إِيلَافِهِمْ رِحْلَةَ الشِّتَاءِ وَالصَّيْفِ',
'فَلْيَعْبُدُوا رَبَّ هٰذَا الْبَيْتِ',
'الَّذِي أَطْعَمَهُمْ مِنْ جُوعٍ وَآمَنَهُمْ مِنْ خَوْفٍ'],
['কুরাইশের অভ্যস্ততার কারণে।',
'শীত ও গ্রীষ্মের সফরে তাদের অভ্যস্ততার কারণে।',
'অতএব তারা যেন এই ঘরের প্রতিপালকের ইবাদত করে।',
'যিনি তাদের ক্ষুধায় খাবার দিয়েছেন এবং ভয় থেকে নিরাপদ করেছেন।'])
]},

{t:'সূরা আল-মাউন',s:'যে বিচার দিন অস্বীকার করে',aim:'সাত আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-মাউন','الْمَاعُون','মক্কী · সাত ('+BN(7)+') আয়াত',
['أَرَأَيْتَ الَّذِي يُكَذِّبُ بِالدِّينِ',
'فَذٰلِكَ الَّذِي يَدُعُّ الْيَتِيمَ',
'وَلَا يَحُضُّ عَلَى طَعَامِ الْمِسْكِينِ',
'فَوَيْلٌ لِلْمُصَلِّينَ',
'الَّذِينَ هُمْ عَنْ صَلَاتِهِمْ سَاهُونَ',
'الَّذِينَ هُمْ يُرَاءُونَ',
'وَيَمْنَعُونَ الْمَاعُونَ'],
['আপনি কি তাকে দেখেছেন, যে বিচার দিনকে মিথ্যা বলে?',
'সে-ই তো এতিমকে ধাক্কা দিয়ে সরিয়ে দেয়।',
'এবং মিসকিনকে খাবার দিতে উৎসাহ দেয় না।',
'দুর্ভোগ সেই নামাযিদের জন্য —',
'যারা নিজেদের নামায সম্পর্কে উদাসীন।',
'যারা লোক দেখানোর জন্য করে।',
'এবং নিত্যপ্রয়োজনীয় জিনিস দিতে বাধা দেয়।'])
]},

{t:'সূরা আল-কাউছার',s:'সবচেয়ে ছোট সূরা',aim:'তিন আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-কাউছার','الْكَوْثَر','মক্কী · তিন ('+BN(3)+') আয়াত',
['إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ',
'فَصَلِّ لِرَبِّكَ وَانْحَرْ',
'إِنَّ شَانِئَكَ هُوَ الْأَبْتَرُ'],
['নিশ্চয়ই আমি আপনাকে কাউছার দান করেছি।',
'অতএব আপনার প্রতিপালকের জন্য নামায পড়ুন এবং কুরবানি করুন।',
'নিশ্চয়ই আপনার শত্রুই নির্বংশ।'])
]},

{t:'সূরা আল-কাফিরুন',s:'দ্বীনের পার্থক্য',aim:'ছয় আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-কাফিরুন','الْكَافِرُون','মক্কী · ছয় ('+BN(6)+') আয়াত',
['قُلْ يَا أَيُّهَا الْكَافِرُونَ',
'لَا أَعْبُدُ مَا تَعْبُدُونَ',
'وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ',
'وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ',
'وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ',
'لَكُمْ دِينُكُمْ وَلِيَ دِينِ'],
['বলুন, হে কাফিররা!',
'আমি তার ইবাদত করি না, যার ইবাদত তোমরা করো।',
'আর তোমরাও তাঁর ইবাদতকারী নও, যাঁর ইবাদত আমি করি।',
'আর আমিও তার ইবাদতকারী নই, যার ইবাদত তোমরা করেছ।',
'আর তোমরাও তাঁর ইবাদতকারী নও, যাঁর ইবাদত আমি করি।',
'তোমাদের দ্বীন তোমাদের, আমার দ্বীন আমার।'])
]},

{t:'সূরা আন-নাসর',s:'সাহায্য ও বিজয়',aim:'তিন আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আন-নাসর','النَّصْر','মাদানী · তিন ('+BN(3)+') আয়াত',
['إِذَا جَاءَ نَصْرُ اللّٰهِ وَالْفَتْحُ',
'وَرَأَيْتَ النَّاسَ يَدْخُلُونَ فِي دِينِ اللّٰهِ أَفْوَاجًا',
'فَسَبِّحْ بِحَمْدِ رَبِّكَ وَاسْتَغْفِرْهُ إِنَّهُ كَانَ تَوَّابًا'],
['যখন আল্লাহর সাহায্য ও বিজয় এসে যাবে।',
'আর আপনি মানুষকে দলে দলে আল্লাহর দ্বীনে প্রবেশ করতে দেখবেন।',
'তখন আপনার প্রতিপালকের প্রশংসাসহ তাসবীহ পড়ুন এবং তাঁর কাছে ক্ষমা চান। নিশ্চয়ই তিনি ক্ষমা কবুলকারী।'])
]},

{t:'সূরা আল-ইখলাস',s:'আল্লাহর পরিচয়',aim:'চার আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-ইখলাস','الْإِخْلَاص','মক্কী · চার ('+BN(4)+') আয়াত',
['قُلْ هُوَ اللّٰهُ أَحَدٌ',
'اللّٰهُ الصَّمَدُ',
'لَمْ يَلِدْ وَلَمْ يُولَدْ',
'وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ'],
['বলুন, তিনি আল্লাহ, এক।',
'আল্লাহ কারও মুখাপেক্ষী নন, সবাই তাঁর মুখাপেক্ষী।',
'তিনি কাউকে জন্ম দেননি, তাঁকেও জন্ম দেওয়া হয়নি।',
'আর তাঁর সমতুল্য কেউ নেই।'])
]},

{t:'সূরা আল-ফালাক',s:'আশ্রয় প্রার্থনা',aim:'পাঁচ আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আল-ফালাক','الْفَلَق','মক্কী · পাঁচ ('+BN(5)+') আয়াত',
['قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ',
'مِنْ شَرِّ مَا خَلَقَ',
'وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ',
'وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ',
'وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ'],
['বলুন, আমি আশ্রয় চাই ভোরের প্রতিপালকের কাছে।',
'তিনি যা সৃষ্টি করেছেন তার অনিষ্ট থেকে।',
'অন্ধকার রাতের অনিষ্ট থেকে, যখন তা ছেয়ে যায়।',
'গিরায় ফুঁ দেওয়া নারীদের অনিষ্ট থেকে।',
'আর হিংসুকের অনিষ্ট থেকে, যখন সে হিংসা করে।'])
]},

{t:'সূরা আন-নাস',s:'শেষ সূরা',aim:'ছয় আয়াত শুদ্ধভাবে পড়তে পারা।',b:[
sura('সূরা আন-নাস','النَّاس','মক্কী · ছয় ('+BN(6)+') আয়াত',
['قُلْ أَعُوذُ بِرَبِّ النَّاسِ',
'مَلِكِ النَّاسِ',
'إِلٰهِ النَّاسِ',
'مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ',
'الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ',
'مِنَ الْجِنَّةِ وَالنَّاسِ'],
['বলুন, আমি আশ্রয় চাই মানুষের প্রতিপালকের কাছে।',
'মানুষের অধিপতির কাছে।',
'মানুষের মাবুদের কাছে।',
'আত্মগোপনকারী কুমন্ত্রণাদাতার অনিষ্ট থেকে।',
'যে মানুষের অন্তরে কুমন্ত্রণা দেয়।',
'জিন ও মানুষের মধ্য থেকে।'])
]},

{t:'শেষ কথা',s:'কায়দা শেষ',aim:'এরপর কী করতে হবে তা জানা।',b:[
note('এখন যা করবেন',[
'পুরো কায়দা <b>আরও একবার</b> প্রথম থেকে পড়ুন — এবার আগের চেয়ে দ্রুত।',
'শেষ দশ ('+NB(10)+')টি সূরা <b>মুখস্থ</b> করুন। নামাযে কাজে লাগবে।',
'তারপর <b>তাজবীদ শাখায়</b> যান — সেখানে মাখরাজ, সিফাত, নূন-মীম সাকিন, গুন্নাহ, মাদ্দ ও ওয়াকফ বিস্তারিত আছে।']),
note('মনে রাখবেন',[
'শুদ্ধ পড়া একদিনে হয় না। <b>প্রতিদিন অল্প, নিয়মিত</b> — এটাই পথ।',
'নিজে নিজে শেখার চেয়ে <b>উস্তাদের মুখে শোনা</b> অনেক বেশি কাজে দেয়।']),
un('ছাত্রের চিহ্ন দেখে বুঝে নিন কোন পৃষ্ঠা বাকি, সেগুলো আবার ধরুন।')
]}
];

/* ===================== অবস্থা ===================== */
const K={p:'aq_page',th:'aq_theme',fs:'aq_fs',ro:'aq_role',ms:'aq_ms',mu:'aq_mu'};
const S={view:'role',page:0,role:'',
 ms:new Set(JSON.parse(localStorage.getItem(K.ms)||'[]')),
 mu:new Set(JSON.parse(localStorage.getItem(K.mu)||'[]'))};
function save(){localStorage.setItem(K.p,S.page);localStorage.setItem(K.ro,S.role);
 localStorage.setItem(K.ms,JSON.stringify([...S.ms]));localStorage.setItem(K.mu,JSON.stringify([...S.mu]));}

function cnt(p){let c=0;p.b.forEach(b=>{
 if(b.k==='grid')c+=b.items.length;
 else if(b.k==='ex'||b.k==='big')c+=b.l.length;
 else if(b.k==='sura')c+=1;});return c;}
const TOTAL=P.reduce((a,p)=>a+cnt(p),0);

(function(){const th=localStorage.getItem(K.th)||'light';const fs=localStorage.getItem(K.fs)||'m';
 document.documentElement.dataset.theme=th;document.documentElement.dataset.fs=fs;
 $('#bTh').textContent=th==='dark'?'☀️':'🌙';
 const r=localStorage.getItem(K.ro);if(r){S.role=r;S.view='home';}
 S.page=parseInt(localStorage.getItem(K.p)||'0',10)||0;})();

$('#bTh').onclick=()=>{const d=document.documentElement;const n=d.dataset.theme==='dark'?'light':'dark';
 d.dataset.theme=n;localStorage.setItem(K.th,n);$('#bTh').textContent=n==='dark'?'☀️':'🌙';};
$('#bFs').onclick=()=>{const d=document.documentElement;const o=['s','m','l'];
 const n=o[(o.indexOf(d.dataset.fs)+1)%3];d.dataset.fs=n;localStorage.setItem(K.fs,n);};
$('#bRo').onclick=()=>{S.view='role';draw();};

function mkBtn(id){const b=E('button','mk');b.appendChild(E('i'));
 const s=S.ms.has(id),u=S.mu.has(id);
 if(s&&u)b.classList.add('both');else if(s)b.classList.add('on-s');else if(u)b.classList.add('on-u');
 b.onclick=ev=>{ev.stopPropagation();const set=S.role==='u'?S.mu:S.ms;
  set.has(id)?set.delete(id):set.add(id);save();draw();};
 return b;}

function openHorf(i){const h=HORF[i];const m=$('#modal');m.innerHTML='';
 m.appendChild(E('div','mar',h[0]));m.appendChild(E('h3',null,h[1]));
 [['হরফের নাম',h[1]],['মাখরাজ',h[2]],['পড়ার নিয়ম',h[3]],['ক্রম',NB(i+1)+' নম্বর হরফ']]
  .forEach(x=>{const r=E('div','mrow');r.appendChild(E('b',null,x[0]));r.appendChild(E('span',null,x[1]));m.appendChild(r);});
 const c=E('button','close','বন্ধ করুন');c.onclick=closeM;m.appendChild(c);
 $('#mask').classList.add('on');}
function closeM(){$('#mask').classList.remove('on');}
$('#mask').onclick=e=>{if(e.target.id==='mask')closeM();};

function drawBlock(b,pi,bi){
 const id=n=>pi+'-'+bi+'-'+n;

 if(b.k==='note'){const d=E('div','note');d.appendChild(E('h4',null,b.t));
  b.l.forEach(x=>d.appendChild(E('p',null,x)));return d;}

 if(b.k==='un'){if(S.role!=='u')return null;
  const d=E('div','unote');d.appendChild(E('strong',null,'উস্তাদের নোট'));
  d.appendChild(E('span',null,b.t));return d;}

 if(b.k==='grid'){const w=E('div');const g=E('div','tiles');
  b.items.forEach((it,n)=>{const t=E('div','tile');
   t.appendChild(E('span',null,it.ar));t.appendChild(E('em',null,it.lab));
   t.appendChild(mkBtn(id(n)));t.onclick=()=>openHorf(it.idx);g.appendChild(t);});
  w.appendChild(g);return w;}

 if(b.k==='row'){const w=E('div');w.appendChild(E('div','bt',b.t));
  const c=E('div','chips');b.s.split('|').forEach(x=>c.appendChild(E('div','ch',x)));
  w.appendChild(c);return w;}

 if(b.k==='ex'||b.k==='big'){const w=E('div');w.appendChild(E('div','bt',b.t));
  const l=E('div','lines');
  b.l.forEach((x,n)=>{const r=E('div','ln'+(b.k==='big'?' big':''));
   r.appendChild(E('div','a',x[0]));r.appendChild(E('div','m',x[1]));
   r.appendChild(mkBtn(id(n)));l.appendChild(r);});
  w.appendChild(l);return w;}

 if(b.k==='tbl'){const w=E('div');w.appendChild(E('div','bt',b.t));
  const bx=E('div','tbx');const t=E('table','tb');
  const hr=E('tr');b.h.forEach(x=>hr.appendChild(E('th',null,x)));
  const th=E('thead');th.appendChild(hr);t.appendChild(th);
  const tb=E('tbody');b.r.forEach(rw=>{const tr=E('tr');
   rw.forEach(c=>tr.appendChild(E('td','a',c)));tb.appendChild(tr);});
  t.appendChild(tb);bx.appendChild(t);w.appendChild(bx);return w;}

 if(b.k==='sura'){const w=E('div');w.style.position='relative';
  const meta=E('div','smeta');
  meta.appendChild(E('div','sname',b.arn));
  meta.appendChild(E('div','sbn',b.bn));
  meta.appendChild(E('div','sinfo',b.info));
  w.appendChild(meta);
  const mu=E('div','mushaf');
  b.ayat.forEach((a,n)=>{mu.appendChild(document.createTextNode(a+' '));
   mu.appendChild(E('span','ayn',AR(n+1)));mu.appendChild(document.createTextNode(' '));});
  w.appendChild(mu);
  const mn=E('div','means');mn.appendChild(E('div','bt','অর্থ'));
  b.mean.forEach((m,n)=>{const d=E('div','mn');
   d.appendChild(E('b',null,BN(n+1)));d.appendChild(E('span',null,m));mn.appendChild(d);});
  w.appendChild(mn);
  const mb=mkBtn(id(0));mb.style.position='absolute';mb.style.top='0';mb.style.right='0';
  w.appendChild(mb);return w;}

 return null;
}

function head(){
 const rb=$('#rolebar'),pb=$('#pbwrap');rb.innerHTML='';pb.innerHTML='';
 if(S.view==='role'){rb.style.display='none';pb.style.display='none';return;}
 rb.style.display='flex';
 rb.appendChild(E('span','chip '+(S.role==='u'?'u':'s'),S.role==='u'?'● উস্তাদ':'● ছাত্র'));
 rb.appendChild(E('span','hint',S.role==='u'
  ?'সবুজ চিহ্ন আপনার · লাল চিহ্ন ছাত্রের'
  :'ঘরের কোণে চাপ দিলে লাল চিহ্ন বসবে'));
 if(S.view!=='book'){pb.style.display='none';return;}
 pb.style.display='block';
 const s=S.ms.size,u=S.mu.size;
 pb.appendChild(E('div','pbtxt','ছাত্রের চিহ্ন '+NB(s)+' · উস্তাদের চিহ্ন '+NB(u)+' · মোট ঘর '+NB(TOTAL)));
 const bar=E('div','pb');
 const f1=E('i','fs');f1.style.width=Math.min(100,s/TOTAL*100)+'%';
 const f2=E('i','fu');f2.style.width=Math.min(100,u/TOTAL*100)+'%';
 bar.append(f1,f2);pb.appendChild(bar);}

function nav(){
 const n=$('#nav');n.innerHTML='';
 if(S.view!=='book'){n.style.display='none';return;}
 n.style.display='block';
 const b=E('div','nb');
 const h=E('button','nbtn','হোম');h.onclick=()=>{S.view='home';draw();};
 const pv=E('button','nbtn','‹');pv.disabled=S.page===0;
 pv.onclick=()=>{if(S.page>0){S.page--;save();draw();}};
 const sel=E('select','sel');
 P.forEach((p,i)=>{const o=E('option',null,BN(i+1)+'. '+p.t);o.value=i;
  if(i===S.page)o.selected=true;sel.appendChild(o);});
 sel.onchange=()=>{S.page=+sel.value;save();draw();};
 const nx=E('button','nbtn go','পরের ›');nx.disabled=S.page===P.length-1;
 nx.onclick=()=>{if(S.page<P.length-1){S.page++;save();draw();}};
 b.append(h,pv,sel,nx);n.appendChild(b);
 n.appendChild(E('div','foot','আলিফিয়া ইলম একাডেমি'));}

function draw(){
 const m=$('#main');m.innerHTML='';head();nav();

 if(S.view==='role'){
  const w=E('div','role');
  w.appendChild(E('div','cover','<div class="bsm">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>'
   +'<h1>আলিফিয়া ইলম একাডেমি</h1><p>আপনি কে? নিচ থেকে বেছে নিন।</p>'));
  const s=E('button','rbtn s','ছাত্র<span>পড়ব এবং পড়া হয়ে গেলে লাল চিহ্ন দেব।</span>');
  s.onclick=()=>{S.role='s';S.view='home';save();draw();};
  const u=E('button','rbtn u','উস্তাদ<span>পড়াব, নোট দেখব এবং সবুজ চিহ্ন দেব।</span>');
  u.onclick=()=>{const c=prompt('উস্তাদের কোড লিখুন');if(c===null)return;
   if(c.trim().toUpperCase()==='ALIF-USTAD'){S.role='u';S.view='home';save();draw();}
   else alert('কোড মেলেনি।');};
  w.append(s,u);m.appendChild(w);window.scrollTo(0,0);return;}

 if(S.view==='home'){
  m.appendChild(E('div','cover','<div class="bsm">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>'
   +'<h1>আলিফিয়া ইলম একাডেমি</h1><p>নিচ থেকে বেছে নিন।</p>'));
  const q=E('button','big');
  q.innerHTML='<div class="bi" style="background:var(--gbg);color:var(--g)">ا</div>'
   +'<div class="bx"><b>কায়দা</b><span>উনত্রিশ ('+NB(29)+') হরফ, যবর-যের-পেশ, তানবীন, জযম, তাশদীদ, মাদ্দ, শব্দ, বাক্য ও নামাযের দশ ('+NB(10)+')টি সূরা।</span>'
   +'<em>মোট '+NB(P.length)+' পৃষ্ঠা · চলছে পৃষ্ঠা '+NB(S.page+1)+'</em></div>';
  q.onclick=()=>{S.view='book';draw();};
  m.appendChild(q);
  const t=E('button','big');
  t.innerHTML='<div class="bi" style="background:var(--rbg);color:var(--r)">✦</div>'
   +'<div class="bx"><b>তাজবীদ</b><span>সতেরো ('+NB(17)+')টি মাখরাজ, হরফের গুণ, নূন ও মীম সাকিন, গুন্নাহ, মাদ্দের প্রকার, লাম-রা, কলকলা ও ওয়াক্‌ফ।</span>'
   +'<em>আলাদা ফাইল — tajwid.html</em></div>';
  t.onclick=()=>{location.href='tajwid.html';};
  m.appendChild(t);window.scrollTo(0,0);return;}

 const p=P[S.page];
 const c=E('div','card');
 c.appendChild(E('div','ptitle',NB(S.page+1)+'. '+p.t));
 c.appendChild(E('div','psub',p.s));
 c.appendChild(E('div','paim','<b>উদ্দেশ্য:</b> '+p.aim));
 m.appendChild(c);
 const body=E('div','card');
 p.b.forEach((b,bi)=>{const n=drawBlock(b,S.page,bi);if(n)body.appendChild(n);});
 m.appendChild(body);window.scrollTo(0,0);}

document.addEventListener('keydown',e=>{
 if(S.view!=='book')return;
 if(e.key==='Escape')closeM();
 if(e.key==='ArrowLeft'&&S.page<P.length-1){S.page++;save();draw();}
 if(e.key==='ArrowRight'&&S.page>0){S.page--;save();draw();}});

draw();
</script>
</body>
</html>
